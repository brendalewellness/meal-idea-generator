/* ---------- Saved meal plan library ---------- */
function loadSavedPlans(){
  try{
    const raw = localStorage.getItem(PLANS_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveSavedPlans(arr){
  try{ localStorage.setItem(PLANS_KEY, JSON.stringify(arr)); }catch(e){}
}
function saveCurrentPlan(name){
  const arr = loadSavedPlans();
  const existing = arr.findIndex(p => p.name === name);
  const planObj = {
    id: Date.now(),
    name: name,
    data: JSON.parse(JSON.stringify(weekState)),
    savedAt: new Date().toISOString()
  };
  if(existing >= 0){
    planObj.id = arr[existing].id;
    arr[existing] = planObj;
  } else {
    arr.push(planObj);
  }
  saveSavedPlans(arr);
  return planObj;
}
function loadPlanIntoState(name){
  const arr = loadSavedPlans();
  const plan = arr.find(p => p.name === name);
  if(!plan) return false;
  // Deep-copy the saved data into weekState
  Object.assign(weekState, JSON.parse(JSON.stringify(plan.data)));
  // Ensure all expected fields exist
  if(!weekState.days) weekState.days = [[],[],[],[],[],[],[]];
  if(!weekState.mealTypes) weekState.mealTypes = ['breakfast','morning-snack','lunch','afternoon-snack','dinner','night-snack'];
  if(!weekState.microSelection) weekState.microSelection = ['calcium','iron','sodium','potassium','fibre','vitaminC'];
  if(typeof weekState.showMicros === 'undefined') weekState.showMicros = false;
  saveWeek();
  return true;
}
function deleteSavedPlan(name){
  const arr = loadSavedPlans().filter(p => p.name !== name);
  saveSavedPlans(arr);
}

/* ---------- Food-category auto-detection ----------
   Recipes aren't manually tagged with food-type categories (soup, salad,
   beef, pork, etc.).  Instead we auto-detect from the recipe name +
   ingredient list using keyword matching.  This lets users filter the
   homepage grid by dish type without editing every recipe. */
const FOOD_CATS = [
  'soup','salad','dessert','beef','pork','chicken',
  'seafood','rice','noodles','eggs','vegetable','fruit'
];
const FOOD_CAT_PATTERNS = {
  soup:      ['soup','broth','stew','consomm','汤','羹','炖'],
  salad:     ['salad','沙拉','凉拌'],
  dessert:   ['dessert','cake','pudding','cookie','pancake','sweet','chocolate','mousse','tart','crumble','yogurt bowl','ice cream','甜','蛋糕','饼干'],
  beef:      ['beef','beef steak','brisket','ox','牛腩','牛肉'],
  pork:      ['pork','bacon','ham','sausage','猪','排骨','培根','香肠','猪脚'],
  chicken:   ['chicken','poultry','turkey','chicken wing','duck','鸡肉','鸡腿','鸡胸','鸡翼','鸡块','鸭肉'],
  seafood:   ['fish','salmon','tuna','shrimp','prawn','seafood','cod','sardine','scallop','crab','lobster','oyster','鱼','虾','海鲜','沙丁鱼'],
  rice:      ['fried rice','rice bowl','congee','porridge','risotto','rice pudding','rice cake','onigiri','饭','粥','米饭','炒饭'],
  noodles:   ['noodle','pasta','spaghetti','udon','soba','ramen','linguine','面','意面','面条'],
  eggs:      ['egg','omelet','scrambled','poached','boiled egg','蛋','煎蛋','炒蛋'],
  vegetable: ['tofu','vegetable','mushroom','lentil','bean','spinach','broccoli','cauliflower','kale','cabbage','carrot','potato','tomato','cucumber','avocado','蔬菜','豆腐','菌','菇','豆'],
  fruit:     ['berry','banana','apple','mango','pineapple','fruit','smoothie','orange','grape','peach','pear','kiwi','蓝莓','草莓','水果']
};
function foodCats(m){
  const enName = ((m.en && m.en.name)||'').toLowerCase();
  const zhName = ((m.zh && m.zh.name)||'');
  const ings = ((m.en && m.en.ingredients)||[]).join(' ').toLowerCase();
  const zhIngs = ((m.zh && m.zh.ingredients)||[]).join(' ');
  const hay = enName + ' ' + ings;
  const zhHay = zhName + ' ' + zhIngs;
  const result = [];
  for(const cat of FOOD_CATS){
    const patterns = FOOD_CAT_PATTERNS[cat];
    if(patterns.some(p => hay.includes(p) || zhHay.includes(p))){
      result.push(cat);
    }
  }
  return result;
}

/* --- 5-category food system (Proteins / Carbs / Vegetables / Fat & Flavor / Complete)
   New ingredient recipes have an explicit `foodCats` array.
   Existing recipes are auto-categorized based on their tags, ingredients, and name. */
const FOOD_CATS_5 = ['protein','carb','vegetable','fat-flavor','complete'];

const PROTEIN_PATTERNS = ['beef','pork','chicken','turkey','duck','lamb','mutton','bacon','sausage','ham',
  'steak','minced','ground beef','burger','patty','ribs','roast','fish','salmon','tuna','cod','sardine',
  'shrimp','prawn','seafood','scallop','crab','lobster','oyster','egg','omelet','scrambled','poached',
  'tofu','tempeh','lentil','bean','chickpea','edamame','cottage cheese','greek yogurt','yogurt',
  '牛肉','猪','鸡','鸭','羊','鱼','虾','海鲜','蛋','豆腐','豆','酸奶','奶酪','芝士'];

const CARB_PATTERNS = ['rice','noodle','pasta','spaghetti','udon','soba','ramen','bread','toast','tortilla',
  'oat','porridge','congee','grain','quinoa','cereal','cracker','potato','sweet potato','yam','taro',
  'fruit','banana','apple','berry','mango','pineapple','orange','grape','peach','pear','kiwi',
  '米饭','粥','面','面条','意面','面包','燕麦','土豆','红薯','水果','蓝莓','草莓'];

const VEGETABLE_PATTERNS = ['spinach','broccoli','cauliflower','kale','cabbage','carrot','tomato','cucumber',
  'lettuce','zucchini','eggplant','bell pepper','onion','garlic','mushroom','asparagus','green bean',
  'bok choy','celery','radish','squash','pumpkin','vegetable','veg','salad greens',
  '菠菜','西兰花','花椰菜','羽衣甘蓝','卷心菜','胡萝卜','番茄','黄瓜','生菜','茄子','蘑菇','芦笋','蔬菜'];

const FAT_FLAVOR_PATTERNS = ['avocado','olive','olive oil','coconut oil','butter','ghee','cream',
  'nuts','almond','walnut','cashew','pecan','peanut','seed','chia','flax','hemp','sesame','sunflower',
  'nut butter','peanut butter','almond butter','tahini','sauce','dressing','dip','spread','mayo','mustard',
  'seasoning','condiment','spice','herb','salt','pepper','soy sauce','vinegar','honey','maple',
  '牛油果','橄榄','油','黄油','奶油','坚果','杏仁','核桃','花生','种子','奇亚','亚麻','芝麻','酱','调味'];

function mealFoodCats(m){
  if(!m) return ['complete'];
  // Explicit foodCats field (new ingredient recipes)
  if(Array.isArray(m.foodCats) && m.foodCats.length) return m.foodCats;

  // Auto-categorize based on name + ingredients
  const enName = ((m.en && m.en.name)||'').toLowerCase();
  const zhName = ((m.zh && m.zh.name)||'');
  const ings = ((m.en && m.en.ingredients)||[]).join(' ').toLowerCase();
  const zhIngs = ((m.zh && m.zh.ingredients)||[]).join(' ');
  const hay = enName + ' ' + ings;
  const zhHay = zhName + ' ' + zhIngs;
  const result = [];

  if(PROTEIN_PATTERNS.some(p=>hay.includes(p) || zhHay.includes(p))) result.push('protein');
  if(CARB_PATTERNS.some(p=>hay.includes(p) || zhHay.includes(p))) result.push('carb');
  if(VEGETABLE_PATTERNS.some(p=>hay.includes(p) || zhHay.includes(p))) result.push('vegetable');
  if(FAT_FLAVOR_PATTERNS.some(p=>hay.includes(p) || zhHay.includes(p))) result.push('fat-flavor');

  // Complete: recipes with multiple food groups or complex steps
  const stepCount = (m.en && m.en.steps) ? m.en.steps.length : 0;
  if(result.length >= 3 || (result.length >= 2 && stepCount >= 3)) result.push('complete');

  // Fallback
  if(!result.length) result.push('complete');

  return result;
}

/* --- Portion size helper: extracts practical portion description from a recipe.
   For simple recipes (not 'complete'), parses the servings field for a number + unit,
   multiplies by the component's servings count, and returns a scaled string like
   "4 eggs", "8 oz", "2 cups". For complex recipes, returns '' (empty). --- */
function getPortionDesc(m, servings){
  if(!m) return '';
  const cats = mealFoodCats(m);
  // Only show for simple recipes (no 'complete' category)
  if(cats.includes('complete')) return '';
  const d = c(m);
  const servField = d.servings || '';
  if(!servField) return '';
  // Try to extract a leading number (including fractions like 1/2, 3/4)
  let match = servField.match(/^(\d+(?:\/\d+)?)\s*(.*)$/);
  if(match){
    let num;
    const numStr = match[1];
    if(numStr.includes('/')){
      const [a, b] = numStr.split('/').map(Number);
      num = a / b;
    } else {
      num = parseFloat(numStr);
    }
    const unit = match[2].trim();
    const total = num * (servings || 1);
    let numDisplay;
    if(total % 1 === 0) numDisplay = String(total);
    else {
      // Try to express as fraction if close to common fractions
      const rounded = Math.round(total * 4) / 4;
      if(rounded % 1 === 0) numDisplay = String(rounded);
      else if(Math.abs(rounded * 2 % 1 - 0.5) < 0.01) numDisplay = (Math.floor(rounded) > 0 ? Math.floor(rounded) + ' 1/2' : '1/2');
      else if(Math.abs(rounded * 4 % 1 - 0.25) < 0.01) numDisplay = (Math.floor(rounded) > 0 ? Math.floor(rounded) + ' 1/4' : '1/4');
      else if(Math.abs(rounded * 4 % 1 - 0.75) < 0.01) numDisplay = (Math.floor(rounded) > 0 ? Math.floor(rounded) + ' 3/4' : '3/4');
      else numDisplay = String(Math.round(total * 100) / 100);
    }
    return numDisplay + (unit ? ' ' + unit : '');
  }
  // Try Chinese pattern: number + 克/毫升 at end
  match = servField.match(/(\d+(?:\.\d+)?)\s*(克|毫升|g|ml)$/);
  if(match){
    const num = parseFloat(match[1]);
    const unit = match[2];
    const total = Math.round(num * (servings || 1));
    return total + unit;
  }
  // No parseable number — return field as-is
  return servField;
}

/* ---------- 过滤逻辑 ---------- */
function matches(m, carb, focus, diet, avoid, foodCat, search){
  carb = carb || state.carb; focus = focus || state.focus;
  diet = diet || state.diet; avoid = avoid || state.avoid;
  // foodCat & search default to state values but can be overridden
  // (e.g. week plan picker passes '' to skip homepage filters)
  foodCat = (foodCat === undefined) ? state.foodCat : foodCat;
  search = (search === undefined) ? state.search : search;
  if(carb !== 'any' && m.carb !== carb) return false;
  for(const x of focus){ if(!m.tags.includes(x)) return false; }
  for(const x of diet){ if(!m.tags.includes(x)) return false; }
  for(const x of avoid){ if(m.contains.includes(x)) return false; }
  // Food-category filter (soup, salad, beef, pork, etc.)
  if(foodCat){
    const cats = foodCats(m);
    if(!cats.includes(foodCat)) return false;
  }
  // Keyword search across both language recipe names
  if(search){
    const q = search.toLowerCase().trim();
    if(q){
      const hay = ((m.en && m.en.name)||'') + ' ' + ((m.zh && m.zh.name)||'');
      if(!hay.toLowerCase().includes(q)) return false;
    }
  }
  return true;
}
function filtered(){ return ALL_MEALS.filter(m=>matches(m)); }

/* ---------- 工具 ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x])); }
function byId(id){ return ALL_MEALS.find(m=>m.id===id); }

/* ---------- 宏量营养素计算 ---------- */
function macroCalories(m, serv){
  serv = serv || 1;
  // Per-recipe manual override (from recipe library editor)
  if(typeof m.calories === 'number' && m.calories > 0) return Math.round(m.calories) * serv;
  if(!m.macros) return 0;
  return ((m.macros.protein.g||0)*4 + (m.macros.fat.g||0)*9 + (m.macros.netCarbs.g||0)*4) * serv;
}
/* Auto-calculate macro percentages from grams.
   protein = 4 cal/g, carbs = 4 cal/g, fat = 9 cal/g.
   pct = (g * calPerG) / totalCal * 100  (rounded to nearest integer) */
function calcMacroPcts(m){
  if(!m || !m.macros) return { protein:0, fat:0, netCarbs:0 };
  const p = m.macros.protein.g || 0;
  const f = m.macros.fat.g || 0;
  const c = m.macros.netCarbs.g || 0;
  const total = p*4 + f*9 + c*4;
  if(total === 0) return { protein:0, fat:0, netCarbs:0 };
  return {
    protein: Math.round(p*4 / total * 100),
    fat: Math.round(f*9 / total * 100),
    netCarbs: Math.round(c*4 / total * 100)
  };
}
function dayMacros(entries){
  const tot = { protein:0, fat:0, netCarbs:0, calories:0 };
  entries.forEach(e=>{
    const m = byId(entryId(e)); if(!m || !m.macros) return;
    const serv = entryServ(e);
    tot.protein += (m.macros.protein.g||0)*serv;
    tot.fat += (m.macros.fat.g||0)*serv;
    tot.netCarbs += (m.macros.netCarbs.g||0)*serv;
    tot.calories += macroCalories(m, serv);
  });
  return tot;
}
/* ---------- 微量营养素计算 ---------- */
const MICRO_KEYS = ['calcium','iron','sodium','potassium','fibre','vitaminC'];
function dayMicros(entries){
  const tot = {};
  MICRO_KEYS.forEach(k=>tot[k]=0);
  entries.forEach(e=>{
    const m = byId(entryId(e)); if(!m || !m.micros) return;
    const serv = entryServ(e);
    MICRO_KEYS.forEach(k=>{ tot[k] += (m.micros[k]||0)*serv; });
  });
  return tot;
}
function macroHTML(m){
  if(!m.macros) return '';
  const L = t();
  const colors = { protein:'#495a58', fat:'#d4967d', netCarbs:'#8a9b8e', calories:'#b89a7a' };
  const labels = { protein: L.protein, fat: L.fat, netCarbs: L.netCarbs, calories: L.calories };
  const cal = Math.round(macroCalories(m));
  const pcts = calcMacroPcts(m);
  const data = {
    protein:    { g:m.macros.protein.g,    pct:pcts.protein },
    fat:        { g:m.macros.fat.g,        pct:pcts.fat },
    netCarbs:   { g:m.macros.netCarbs.g,   pct:pcts.netCarbs },
    calories:   { g:cal, pct:'' }
  };
  return `<div class="macro-grid">
    ${['protein','fat','netCarbs','calories'].map(k=>{
      const v = data[k];
      return `<div class="macro-cell">
        <div class="g">${v.g}<span>${k==='calories'?'':L.grams}</span></div>
        <div class="lbl">${labels[k]}</div>
        ${k==='calories'?'':`<div class="pct">${v.pct}%</div>`}
        ${k==='calories'?'':`<div class="macro-bar"><div class="fill" style="width:${v.pct}%;background:${colors[k]}"></div></div>`}
      </div>`;
    }).join('')}
  </div>`;
}
function macroTagsHTML(m){
  if(!m.macros) return '';
  const L = t();
  const cal = Math.round(macroCalories(m));
  return `<div class="h-macros"><span class="m-tag">${L.protein} ${m.macros.protein.g}${L.grams} · ${L.fat} ${m.macros.fat.g}${L.grams} · ${L.carbs} ${m.macros.netCarbs.g}${L.grams} · ${L.calories} ${cal}</span></div>`;
}

/* ---------- 渲染：食物分类筛选 ---------- */
function renderFoodCats(){
  const L = t();
  // Use the unfiltered list (before food-cat filter) to compute counts,
  // so counts don't change when a food-cat is selected.
  const baseList = ALL_MEALS.filter(m=>{
    if(state.carb !== 'any' && m.carb !== state.carb) return false;
    for(const x of state.focus){ if(!m.tags.includes(x)) return false; }
    for(const x of state.diet){ if(!m.tags.includes(x)) return false; }
    for(const x of state.avoid){ if(m.contains.includes(x)) return false; }
    if(state.search){
      const q = state.search.toLowerCase().trim();
      if(q){
        const hay = ((m.en && m.en.name)||'') + ' ' + ((m.zh && m.zh.name)||'');
        if(!hay.toLowerCase().includes(q)) return false;
      }
    }
    return true;
  });
  const counts = {};
  FOOD_CATS.forEach(c=>{ counts[c] = 0; });
  baseList.forEach(m=>{ foodCats(m).forEach(c=>{ if(counts[c]!==undefined) counts[c]++; }); });
  const el = $('#foodCatRow');
  if(!el) return;
  el.innerHTML = `<span class="fcat-all">${L.foodCatAll}</span>` +
    FOOD_CATS.filter(c=>counts[c] > 0).map(c=>
      `<button class="foodcat-chip ${state.foodCat===c?'on':''}" data-foodcat="${c}">${L.foodCat[c]}<span class="n">${counts[c]}</span></button>`
    ).join('');
}

/* ---------- 渲染：图片 / 占位 ---------- */
function imgSrc(m){
  if(!m.img) return '';
  if(/^data:/.test(m.img)) return m.img; // legacy inline data URI
  if(/^idb:/.test(m.img)) return imgCache[m.img.slice(4)] || ''; // IndexedDB lookup
  return 'images/' + m.img;
}
function photoHTML(m, cls, dataRec){
  const img = m.img ? `<img src="${imgSrc(m)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const rec = dataRec ? ` data-rec="${dataRec}"` : '';
  return `<div class="${cls}" data-type="${m.type}"${rec}><span class="ph-emoji">${m.emoji}</span>${img}</div>`;
}
function focusTagsHTML(m){
  if(!m.focus || !m.focus.length) return '';
  return `<div class="h-focus">${m.focus.map(f=>`<span class="f-tag">${esc(f)}</span>`).join('')}</div>`;
}
function wrapName(name){
  // Let the browser wrap naturally — no forced line breaks.
  // CSS handles width/overflow so the name uses the full cell width
  // and only wraps when the text doesn't fit on one line.
  return esc(name);
}
function tagHTML(m){
  const L = t();
  const out = [];
  if(m.tags.includes('gut-healing')) out.push(`<span class="tag gut">${L.tagShort['gut-healing']}</span>`);
  if(m.tags.includes('asian')) out.push(`<span class="tag asian">${L.tagShort['asian']}</span>`);
  m.tags.filter(x=>!['gut-healing','asian'].includes(x)).slice(0,2)
    .forEach(x=>out.push(`<span class="tag">${L.tag[x]||x}</span>`));
  return `<div class="tags">${out.join('')}</div>`;
}

  $$('#planBody .day').forEach(dayEl=>{

    dayEl.addEventListener('dragover', e=>{ if(!dz()) return; e.preventDefault(); dz().classList.add('over'); });
    dayEl.addEventListener('dragleave', ()=>{ if(dz()) dz().classList.remove('over'); });
    dayEl.addEventListener('drop', e=>{
      if(!dz()) return; e.preventDefault(); addToDay(e.dataTransfer.getData('text/plain'), +dz().dataset.drop);
    });

  $$('#planBody [data-del]').forEach(b=>b.onclick=()=>{
    const day = +b.dataset.day;
    state['day'+day] = state['day'+day].filter(x=>x!==b.dataset.del);

  });
  $$('#planBody [data-clear]').forEach(b=>b.onclick=()=>{

  $$('#planBody [data-day-title]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      state['day'+inp.dataset.dayTitle+'Title'] = inp.value;
      save(); buildHandout();
    });
  });
}

/* ---------- 一键填充 ---------- */
function autoFill(day){
  const L = t();
  const pool = filtered();
  const pick = (type,n)=>{
    const arr = pool.filter(m=>mealHasType(m, type));
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr.slice(0,n).map(m=>m.id);
  };
  const ids = [...pick('breakfast',1),...pick('lunch',1),...pick('dinner',1),...pick('snack',1)];
  if(!ids.length){ toast(L.tNoMatch); return; }
  state['day'+day] = ids; save(); renderAll();
  toast(L.tFilled(day));
}

function buildHandout(){

      <div class="h-day">${esc(label)}${macroLine}</div>
      <div class="h-grid">${arr.map(handoutMealHTML).join('')}</div>`;

    ? `<div class="h-recipes-start"></div>
       <div class="h-day">${L.hRecipes}</div>
       <div class="h-recipes-grid">${uniq.map(handoutRecipeHTML).join('')}</div>`

    <div class="h-head">
      ${brandLogoHTML()}
      <div class="h-brand-text">
        <div class="h-practice">${L.practiceName}</div>
        <div class="h-credential">${L.credential}</div>
      </div>
      <div style="flex:1;text-align:right">
        <div class="h-title">${L.hTitle(name)}</div>
        <div class="h-sub">${dateStr}</div>

}

/* ---------- 轻提示 ---------- */
let toastTimer;
function toast(msg){
  let el = $('#toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2421;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(-4px)'; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%)'; }, 1900);
}

function openLibModal(){

/* Live macro % preview in recipe editor — recalculates when grams change */
function updateMacroPctPreview(){
  const pg = +($('#re-p-g') && $('#re-p-g').value) || 0;
  const fg = +($('#re-f-g') && $('#re-f-g').value) || 0;
  const cg = +($('#re-c-g') && $('#re-c-g').value) || 0;
  const total = pg*4 + fg*9 + cg*4;
  const pct = cal => total ? Math.round(cal/total*100) + '%' : '0%';
  const set = (id, v) => { const el = $('#'+id); if(el) el.textContent = v; };
  set('re-p-pct', pct(pg*4));
  set('re-f-pct', pct(fg*9));
  set('re-c-pct', pct(cg*4));
}

            <div class="lib-thumb" data-type="${m.type}">

  // Inline UI update for select mode — patches DOM without re-rendering (preserves scroll position)
  function updateLibSelectUI(){
    const n = libSelected.size;
    const cntEl = $('#libSheet .sel-count');
    if(cntEl) cntEl.textContent = n + ' ' + L.libSelected;
    const selAllBtn = $('#libSelectAll');

      selAllBtn.textContent = allSel ? L.libDeselectAll : L.libSelectAll;

    const patchBulk = (sel, label) => {
      const btn = $(sel);
      if(btn){
        btn.textContent = label + ' (' + n + ')';
        btn.disabled = n === 0;
        btn.style.opacity = n === 0 ? '.4' : '';
        btn.style.cursor = n === 0 ? 'not-allowed' : '';

    };

    else patchBulk('#libBulkArchive', L.libArchiveSelected);
    patchBulk('#libBulkDelete', L.libDeleteSelected);

      const isSel = libSelected.has(id);
      el.classList.toggle('selected', isSel);
      const cb = el.querySelector('.lib-check');
      if(cb) cb.checked = isSel;
    });
  }

  // Select All / Deselect All
  const selAll = $('#libSelectAll');
  if(selAll) selAll.onclick = ()=>{
    if(listMeals.length && listMeals.every(m=>libSelected.has(m.id))){
      listMeals.forEach(m=>libSelected.delete(m.id));
    } else {
      listMeals.forEach(m=>libSelected.add(m.id));
    }
    updateLibSelectUI();
  };
  // Individual checkbox toggle — row click toggles selection (inline, no re-render)
  $$('#libSheet [data-lib-item-id]').forEach(el=>el.addEventListener('click',function(e){
    if(!libSelectMode) return;
    e.preventDefault();
    const id = el.dataset.libItemId;
    if(libSelected.has(id)) libSelected.delete(id); else libSelected.add(id);
    updateLibSelectUI();

  // Bulk actions
  const bulkArc = $('#libBulkArchive');
  if(bulkArc) bulkArc.onclick = ()=>bulkArchive([...libSelected]);
  const bulkDel = $('#libBulkDelete');
  if(bulkDel) bulkDel.onclick = ()=>bulkDelete([...libSelected]);
  const bulkRst = $('#libBulkRestore');

  const storageEl = $('#libStorage');
  if(storageEl){
    const info = getStorageInfo();
    const pct = Math.min(100, Math.round(info.totalBytes / info.limit * 100));
    const usedKB = Math.round(info.totalBytes / 1024);
    const limitKB = Math.round(info.limit / 1024);
    const barColor = pct > 85 ? 'var(--danger)' : pct > 60 ? 'var(--brand-coral)' : 'var(--accent)';
    storageEl.innerHTML = `
      <div class="storage-bar" style="background:${barColor};width:${pct}%"></div>
      <span class="storage-text">${usedKB}/${limitKB}KB ${pct > 85 ? '⚠ ' + (L.storageFull || 'Storage nearly full') : ''}</span>

      <span style="flex:1"></span>
      <button class="btn ghost" id="libExport" style="font-size:11px;padding:3px 10px">${L.backupExport || 'Export'}</button>
      <button class="btn ghost" id="libImport" style="font-size:11px;padding:3px 10px">${L.backupImport || 'Import'}</button>
      <input type="file" accept="application/json,.json" id="libImportFile" style="display:none">
      ${ud.deleted && ud.deleted.length ? `<button class="btn ghost" id="libRecover" style="font-size:11px;padding:3px 10px;color:var(--danger);border-color:var(--danger)">${L.recoverDeleted || 'Recover Deleted'} (${ud.deleted.length})</button>` : ''}
    `;
    const optBtn = $('#libOptimize');
    if(optBtn) optBtn.onclick = ()=>{
      compressStoredImages(function(count, savedKB, ok){
        if(count === 0){
          toast(L.storageNothing || 'No images to compress');
        } else if(ok){
          renderLibModal();
          toast('Compressed ' + count + ' images, saved ~' + savedKB + 'KB');
        } else {
          // Compression wasn't enough — offer to strip data URIs
          if(confirm(L.storageStripConfirm || 'Storage still full. Remove all uploaded recipe images to free space? (Recipe photos will revert to emoji placeholders)')){
            const stripped = stripAllDataImages();
            renderLibModal();
            toast('Removed ' + stripped + ' uploaded images');

      toast((L.backupExported || 'Exported') + ': ' + r.recipeCount + ' recipes, ' + r.imageCount + ' images (' + r.sizeKB + 'KB)');

function saveRecipeFromForm(origMeal){
  const L = t();
  const val = id => { const el = $('#'+id); return el ? el.value.trim() : ''; };
  const lines = id => { const el = $('#'+id); return el ? el.value.split('\n').map(s=>s.trim()).filter(Boolean) : []; };

  const nameZh = val('re-name-zh');
  const nameEn = val('re-name-en');
  if(!nameZh && !nameEn){ toast('Name required'); return; }

  const tags = $$('#re-tags .chip.on').map(b=>b.dataset.tag);
  const contains = $$('#re-contains .chip.on').map(b=>b.dataset.cont);
  // Multi-type categories: read in the canonical order so the primary type is
  // stable. Order matters because `types[0]` is used as the visual primary.
  const selectedTypes = $$('#re-types .chip.on').map(b=>b.dataset.reType);
  const types = MEAL_TYPES.filter(t => selectedTypes.includes(t));
  if(!types.length){
    toast(L.recTypeRequired || 'At least one category is required');
    return;
  }
  const focus = lines('re-focus');

  const imgPrev = $('#re-img-preview');
  const uploadedImg = imgPrev ? imgPrev.dataset.uploaded : null;
  const hasImgInPreview = !!(imgPrev && imgPrev.querySelector('img'));

  // Determine image: new upload > keep existing > null (cleared)
  let img;
  if(uploadedImg){
    img = uploadedImg; // new upload — data URI
  } else if(hasImgInPreview && origMeal.img){
    img = origMeal.img; // keep existing (idb: marker, filename, or data URI)
  } else {
    img = null; // cleared or never had one
  }

  // Food categories (5-category system)
  const selectedFCs = $$('#re-foodcats .chip.on').map(b=>b.dataset.reFc);
  const foodCatsVal = FOOD_CATS_5.filter(fc => selectedFCs.includes(fc));

  const updated = {
    type: types[0],
    types: types.slice(),
    carb: val('re-carb') || 'moderate',
    emoji: val('re-emoji') || '🍽',
    tags, contains, focus,
    foodCats: foodCatsVal.length ? foodCatsVal : ['complete'],
    portionSize: parseFloat(val('re-portion-size')) || 0,
    portionUnit: val('re-portion-unit') || '',
    img: img || null,
    en: {
      name: nameEn || nameZh,
      time: val('re-time-en') || val('re-time-zh') || '',
      servings: val('re-serv-en') || val('re-serv-zh') || '1',
      why: val('re-why-en'),
      ingredients: lines('re-ing-en').length ? lines('re-ing-en') : lines('re-ing-zh'),
      steps: lines('re-steps-en').length ? lines('re-steps-en') : lines('re-steps-zh'),
      notes: val('re-notes-en')
    },
    zh: {
      name: nameZh || nameEn,
      time: val('re-time-zh') || val('re-time-en') || '',
      servings: val('re-serv-zh') || val('re-serv-en') || '1',
      why: val('re-why-zh'),
      ingredients: lines('re-ing-zh').length ? lines('re-ing-zh') : lines('re-ing-en'),
      steps: lines('re-steps-zh').length ? lines('re-steps-zh') : lines('re-steps-en'),
      notes: val('re-notes-zh')
    },
    macros: (()=>{
      const pg = +val('re-p-g')||0, fg = +val('re-f-g')||0, cg = +val('re-c-g')||0;
      const total = pg*4 + fg*9 + cg*4;
      const pct = g_cal => total ? Math.round(g_cal/total*100) : 0;
      return {
        protein:  { g:pg, pct:pct(pg*4) },
        fat:      { g:fg, pct:pct(fg*9) },
        netCarbs: { g:cg, pct:pct(cg*4) }
      };
    })()
  };

  // If image is a data URI (new upload), store in IndexedDB instead of localStorage.
  // localStorage gets a short 'idb:<id>' marker (~10 bytes), IndexedDB holds the image.
  if(updated.img && typeof updated.img === 'string' && updated.img.startsWith('data:')){
    var imgId = origMeal.id;
    imgCache[imgId] = updated.img; // cache immediately for rendering
    idbPut(imgId, updated.img); // async save to IndexedDB
    updated.img = 'idb:' + imgId;
  }
  // If image was cleared, also remove from IndexedDB
  if(!updated.img && origMeal.img && origMeal.img.startsWith('idb:')){
    idbDel(origMeal.img.slice(4));
    delete imgCache[origMeal.img.slice(4)];
  }

// Optional per-recipe calorie override. Blank → auto-calculate from macros.
// Stored only when the user provides a value; otherwise omitted so the field
// resets to the freshly-computed baseline on the next reload.
const rawCal = val('re-cal');
const calN = parseFloat(rawCal);
const userClearedCalories = (rawCal === '' || isNaN(calN) || calN < 0);
if(!userClearedCalories){
  updated.calories = calN;
} else {
  delete updated.calories;
}

// Per-recipe micronutrient edits. We compare each input against what was
// shown when the editor opened — only persist `micros` when something
// actually changed, otherwise leave the override empty so the meal keeps
// falling back to the MICROS defaults. Blank inputs are treated as a
// deliberate "zero" and force the field into the override.
const initialMicros = {}; // captured just before the editor rendered
MICRO_KEYS.forEach(mk=>{
  const v = (origMeal.micros && typeof origMeal.micros[mk] === 'number')
    ? origMeal.micros[mk]
    : (typeof MICROS !== 'undefined' && MICROS[origMeal.id] ? MICROS[origMeal.id][mk] : 0);
  initialMicros[mk] = (typeof v === 'number') ? v : 0;
});

const microsEdits = {};
let microChanged = false;
let userClearedAnyMicro = false;
MICRO_KEYS.forEach(mk=>{
  const raw = val('re-micro-' + mk);
  let cur;
  if(raw === ''){
    cur = 0;
    userClearedAnyMicro = true;
  } else {
    const n = parseFloat(raw);
    cur = isNaN(n) || n < 0 ? initialMicros[mk] : n;
  }
  if(Math.abs(cur - initialMicros[mk]) > 1e-6) microChanged = true;
  microsEdits[mk] = cur;
});
if(microChanged){
  updated.micros = microsEdits;
} else {
  delete updated.micros;
}

  const ud = loadUserData();

  if(origMeal._custom || ud.custom.find(r=>r.id===origMeal.id)){
    // Update custom recipe
    const idx = ud.custom.findIndex(r=>r.id===origMeal.id);
    if(idx >= 0){
      ud.custom[idx] = { ...ud.custom[idx], ...updated };
      if(userClearedCalories) delete ud.custom[idx].calories;
      if(!microChanged) delete ud.custom[idx].micros;
    } else {
      const merged = { id: origMeal.id, ...updated };
      if(userClearedCalories) delete merged.calories;
      if(!microChanged) delete merged.micros;
      ud.custom.push(merged);
    }
  } else {
    // Override built-in recipe — spread over a fresh empty target so an empty
    // override object doesn't leave the prior calories override around.
    ud.overrides[origMeal.id] = userClearedCalories ? updated : { ...(ud.overrides[origMeal.id]||{}), ...updated };
    if(userClearedCalories) delete ud.overrides[origMeal.id].calories;
    if(!microChanged) delete ud.overrides[origMeal.id].micros;
  }

  const ok = saveUserData(ud);
  if(!ok){
    toast(L.saveFailed || 'Save failed — storage full. Try smaller images or removing unused recipes.');
    return;
  }
  rebuildMeals();
  editingId = null;
  renderLibModal();
  renderAll();
  toast(L.libSaved);
}

function deleteRecipe(id){
  const L = t();
  const ud = loadUserData();
  // Clean up IndexedDB image if present
  idbDel(id);
  delete imgCache[id];
  const isCustom = ud.custom.find(r=>r.id===id);
  if(isCustom){
    ud.custom = ud.custom.filter(r=>r.id!==id);
  } else {
    ud.deleted.push(id);
    delete ud.overrides[id];
  }
  const ok = saveUserData(ud);
  if(!ok){
    toast(L.saveFailed || 'Save failed — storage full.');
    return;
  }
  rebuildMeals();
  renderLibModal();
  renderAll();
  toast(L.libDeleted);
}

function archiveRecipe(id){

function unarchiveRecipe(id){

/* Build a list of archived recipes (built-in with overrides + custom),
   applying the same merge logic as rebuildMeals but filtering FOR archived IDs. */
function getArchivedMeals(){
  const ud = loadUserData();
  const archived = ud.archived || [];
  if(!archived.length) return [];
  return BASE_MEALS
    .filter(m => archived.includes(m.id))
    .map(m => {
      const merged = ud.overrides[m.id] ? Object.assign({}, m, ud.overrides[m.id]) : m;
      if(!merged.micros && typeof MICROS !== 'undefined' && MICROS[merged.id]){
        merged.micros = MICROS[merged.id];
      }
      const ts = mealTypes(merged);
      merged.types = ts.length ? ts.slice() : ['snack'];
      merged.type = merged.types[0];
      return merged;
    })
    .concat(ud.custom.filter(r => archived.includes(r.id)).map(m => {
      const c = {...m, _custom: true};
      if(!c.micros && typeof MICROS !== 'undefined' && MICROS[c.id]) c.micros = MICROS[c.id];
      const ts = mealTypes(c);
      c.types = ts.length ? ts.slice() : ['snack'];
      c.type = c.types[0];
      return c;
    }))
    .sort((a,b)=>{
      const ty = ['breakfast','lunch','dinner','snack'];
      const dt = ty.indexOf(a.type) - ty.indexOf(b.type);
      if(dt) return dt;
      return c(a).name.localeCompare(c(b).name);
    });
}

function bulkArchive(ids){
  const L = t();
  if(!ids.length) return;
  const msg = (L.libConfirmBulkArchive||'Archive {n} selected recipes?').replace('{n}', ids.length);
  if(!confirm(msg)) return;
  const ud = loadUserData();
  if(!ud.archived) ud.archived = [];
  ids.forEach(id=>{ if(!ud.archived.includes(id)) ud.archived.push(id); });
  const ok = saveUserData(ud);
  if(!ok){ toast(L.saveFailed||'Save failed — storage full.'); return; }
  rebuildMeals();
  libSelectMode = false;
  libSelected.clear();
  renderLibModal();
  renderAll();
  toast((L.libBulkArchived||'Archived {n} recipes').replace('{n}', ids.length));
}

function bulkDelete(ids){
  const L = t();
  if(!ids.length) return;
  const msg = (L.libConfirmBulkDelete||'Delete {n} selected recipes? This cannot be undone.').replace('{n}', ids.length);
  if(!confirm(msg)) return;
  const ud = loadUserData();
  ids.forEach(id=>{
    idbDel(id);
    delete imgCache[id];
    const isCustom = ud.custom.find(r=>r.id===id);
    if(isCustom){
      ud.custom = ud.custom.filter(r=>r.id!==id);
    } else {
      if(!ud.deleted.includes(id)) ud.deleted.push(id);
      delete ud.overrides[id];
    }
    // Also remove from archived if present
    if(ud.archived) ud.archived = ud.archived.filter(x=>x!==id);
  });
  const ok = saveUserData(ud);
  if(!ok){ toast(L.saveFailed||'Save failed — storage full.'); return; }
  rebuildMeals();
  libSelectMode = false;
  libSelected.clear();
  renderLibModal();
  renderAll();
  toast((L.libBulkDeleted||'Deleted {n} recipes').replace('{n}', ids.length));
}

function bulkRestore(ids){
  const L = t();
  if(!ids.length) return;
  const msg = (L.libConfirmBulkRestore||'Restore {n} selected recipes?').replace('{n}', ids.length);
  if(!confirm(msg)) return;
  const ud = loadUserData();
  if(!ud.archived) ud.archived = [];
  ud.archived = ud.archived.filter(x=>!ids.includes(x));
  const ok = saveUserData(ud);
  if(!ok){ toast(L.saveFailed||'Save failed — storage full.'); return; }
  rebuildMeals();
  libSelectMode = false;
  libSelected.clear();
  renderLibModal();
  renderAll();
  toast((L.libBulkRestored||'Restored {n} recipes').replace('{n}', ids.length));
}

function recoverDeletedRecipes(){
  const L = t();
  const ud = loadUserData();
  const count = (ud.deleted||[]).length;
  if(count === 0){ toast((L.recoverDeletedDone || 'Recovered') + ': 0'); return; }
  if(!confirm((L.recoverDeletedConfirm || 'Restore all deleted built-in recipes?') + ' (' + count + ')')) return;
  ud.deleted = [];
  saveUserData(ud);
  rebuildMeals();
  renderLibModal();
  renderAll();
  toast((L.recoverDeletedDone || 'Recovered') + ': ' + count);
}

function openWeekModal(){

}
function closeWeekModal(){ $('#weekModal').classList.remove('open'); }

function renderWeekModal(){
  const L = t();
  const dayLabels = L.weekDays;
  // Always show grid — even when empty (Feature 1: empty cells with "+")
  const MTYPES = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const usedSnackIds = weekState.days.map(()=>new Set());

  // Build grid — ONE cell per (day, slot), with up to 2 meals (Feature 4: split view)
  const gridHTML = MTYPES.map(mt=>{
    const cells = weekState.days.map((dayArr,di)=>{
      // Find entries of this slot type in day
      const matchingEntries = dayArr.filter(e=>{
        const m = byId(entryId(e));
        return m && slotEntryMatch(e, m, mt) && !usedSnackIds[di].has(m.id);
      });
      const isSnackSlot = SLOT_LIB_TYPE[mt] && SLOT_LIB_TYPE[mt]!==mt;
      // Allow 2 meals per cell for all slots (including snacks)
      const maxPerCell = 2;
      const entries = matchingEntries.slice(0, maxPerCell);
      entries.forEach(e=>usedSnackIds[di].add(entryId(e)));

      if(!entries.length){
        return `<div class="week-cell empty-cell" data-wday="${di}" data-wtype="${mt}">+</div>`;
      }

      // Render single or split view
      const mealsHTML = entries.map((e,mi)=>{

        const serv = entryServ(e);

          ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">`

        const nameSize = entries.length>1 ? 'wc-name-sm' : '';
        return `<div class="wc-meal" data-wmid="${m.id}" data-wentry="${mi}">

      const inner = entries.length>1 ? `<div class="wc-split">${mealsHTML}</div>` : mealsHTML;
      return `<div class="week-cell" data-wday="${di}" data-wtype="${mt}" data-wmcount="${entries.length}">${inner}</div>`;
    }).join('');
    return `<div class="wg-row">
      <div class="wg-label">${L.type[mt]}</div>

  const dayHeaders = `<div class="wg-row">

      return `<div class="wg-day-head">${esc(dl)}</div>`;

  // Totals row — macros always; micronutrients when enabled (Feature 6)
  const totalsHTML = (() => {
    const rows = ['protein','fat','netCarbs'].map(k=>{

  $$('#weekSheetModal .week-cell').forEach(cell=>{

        saveWeek(); renderWeekModal();

    });
  });

  $$('#weekSheetModal .wc-meal').forEach(mealEl=>{

  });

function openWeekCellPicker(dayIdx, mealType, opts){
  const L = t();
  opts = opts || {mode:'add'};
  const pool = ALL_MEALS.filter(m=>slotMatchesMeal(m, mealType) && matches(m, weekState.carb, weekState.focus, weekState.diet, weekState.avoid, '', ''));
  if(!pool.length){ toast(L.tNoMatch); return; }

  // Title depends on mode (Feature 2: replace vs add)
  let title;
  if(opts.mode === 'replace') title = L.weekReplaceMeal + ' — ' + L.type[mealType] + ' — ' + L.weekDays[dayIdx];
  else if(opts.mode === 'add-second') title = L.weekAddSecond + ' — ' + L.type[mealType] + ' — ' + L.weekDays[dayIdx];
  else title = L.type[mealType] + ' — ' + L.weekDays[dayIdx];

  // Grid picker with large images — show ALL matching recipes (scrollable)
  function renderPickGrid(list){
    return list.map(m=>{
      const d = c(m);
      return `<div class="wk-pick-card" data-wk-pick="${m.id}">
        <div class="wk-pick-thumb" data-type="${m.type}">
          ${m.img ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">` : `<span style="font-size:32px">${m.emoji}</span>`}
        </div>
        <div class="wk-pick-name">${esc(d.name)}</div>
        <div class="wk-pick-meta">${esc(d.time)} · ${esc(d.servings)}${L.servingsUnit}</div>
      </div>`;
    }).join('');
  }

  $('#weekSheetModal').innerHTML = `
    <button class="modal-close" data-week-close>✕</button>
    <div style="padding:16px 20px">
      <button class="wk-pick-back" data-wk-back>&#8592; ${L.weekBack}</button>
      <h2 style="font-family:var(--font-heading);font-size:16px;margin-bottom:8px">${title}</h2>
      <div class="wk-pick-searchbar">
        <span class="search-ic">🔍</span>
        <input class="wk-pick-search" id="wkPickSearch" type="search" autocomplete="off" placeholder="${L.libSearch}" oninput="filterWeekPicker(this.value)">
        <span class="wk-pick-count" id="wkPickCount">${pool.length}</span>
      </div>
      <div class="wk-pick-grid" id="wkPickGrid">${renderPickGrid(pool) || `<div class="empty">${L.empty}</div>`}</div>
    </div>
  `;

  // Live search filter for the picker
  window.filterWeekPicker = function(q){
    q = (q||'').toLowerCase().trim();
    const filtered = q ? pool.filter(m=>{
      const hay = (((m.en&&m.en.name)||'') + ' ' + ((m.zh&&m.zh.name)||'')).toLowerCase();
      return hay.includes(q);
    }) : pool;
    const g = $('#wkPickGrid');
    const c2 = $('#wkPickCount');
    if(g) g.innerHTML = renderPickGrid(filtered) || `<div class="empty">${L.empty}</div>`;
    if(c2) c2.textContent = filtered.length;
    // Re-bind click handlers for new cards
    $$('#weekSheetModal [data-wk-pick]').forEach(el=>el.onclick=()=>pickWeekMeal(el.dataset.wkPick));
  };

  // Centralised pick handler (so dynamically re-rendered cards stay clickable)
  function pickWeekMeal(mid){
    const dayArr = weekState.days[dayIdx];

    if(opts.mode === 'replace'){
      // Find the entry to replace (by type + index)
      const matching = dayArr.filter(ex=>{
        const m = byId(entryId(ex));
        return m && slotEntryMatch(ex, m, mealType);
      });
      const targetEntry = matching[opts.entryIdx || 0];
      if(targetEntry){
        // Replace the ID but keep servings and slot
        targetEntry.id = mid;
      } else {
        dayArr.push(mkEntry(mid, mealType));
      }
      saveWeek(); renderWeekModal();
    } else if(opts.mode === 'add-second'){
      // Add as second meal (only if not already present)
      if(!dayArr.some(ex=>entryId(ex)===mid)) dayArr.push(mkEntry(mid, mealType));
      saveWeek(); renderWeekModal();
    } else {
      // Default add mode
      if(!dayArr.some(ex=>entryId(ex)===mid)) dayArr.push(mkEntry(mid, mealType));
      saveWeek(); renderWeekModal();
    }
  }

  // Feature 3: close/back returns to week plan grid (NOT closeWeekModal)
  $$('#weekSheetModal [data-week-close]').forEach(b=>b.onclick=()=>{ renderWeekModal(); });
  $$('#weekSheetModal [data-wk-back]').forEach(b=>b.onclick=()=>{ renderWeekModal(); });

  // Bind pick handlers for all cards
  $$('#weekSheetModal [data-wk-pick]').forEach(el=>el.onclick=()=>pickWeekMeal(el.dataset.wkPick));
}

function generateWeekPlan(){
  const L = t();
  const pool = ALL_MEALS.filter(m=>matches(m, weekState.carb, weekState.focus, weekState.diet, weekState.avoid, '', ''));
  if(!pool.length){ toast(L.tNoMatch); return; }

  const days = [[],[],[],[],[],[],[]];
  const mTypes = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const natural = weekState.repeatStrategy === 'natural';

  // For each meal slot, pick recipes and distribute
  mTypes.forEach((mt, mtIdx)=>{
    const candidates = pool.filter(m=>slotDisplayMatch(m, mt));
    if(!candidates.length) return;
    // Shuffle
    const shuffled = candidates.slice();
    for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
    // Offset into shuffled list so different snack slots pick different meals on the same day
    const off = mtIdx;

    if(natural && mt === 'breakfast'){
      const b1 = shuffled[(0+off)%shuffled.length].id;
      const b2 = shuffled[(1+off)%shuffled.length].id;
      const b3 = shuffled[(2+off)%shuffled.length].id;
      [b1,b1,b1,b2,b2,b2,b3].forEach((id,di)=> days[di].push(mkEntry(id, mt)));
    } else if(natural && (mt === 'lunch' || mt === 'dinner')){
      const x1 = shuffled[(0+off)%shuffled.length].id;
      const x2 = shuffled[(1+off)%shuffled.length].id;
      const x3 = shuffled[(2+off)%shuffled.length].id;
      const x4 = shuffled[(3+off)%shuffled.length].id;
      [x1,x1,x2,x2,x3,x3,x4].forEach((id,di)=> days[di].push(mkEntry(id, mt)));
    } else if(natural){
      // All snack variants (incl. morning/afternoon/night)
      const s1 = shuffled[(0+off)%shuffled.length].id;
      const s2 = shuffled[(1+off)%shuffled.length].id;
      const s3 = shuffled[(2+off)%shuffled.length].id;
      [s1,s1,s1,s2,s2,s2,s3].forEach((id,di)=> days[di].push(mkEntry(id, mt)));
    } else {
      // Different daily: pick 7 different (or as many as available)
      const picks = shuffled.slice(0, Math.min(7, shuffled.length)).map(m=>m.id);
      while(picks.length < 7) picks.push(shuffled[Math.floor(Math.random()*shuffled.length)].id);
      picks.forEach((id,di)=> days[di].push(mkEntry(id, mt)));
    }
  });

  weekState.days = days;
  saveWeek();
  renderWeekModal();
  toast(L.weekGenerated);
}

function exportWeekPDF(){
  const L = t();
  if(!weekState.days.some(d=>d.length)){ toast(L.weekNeedGen); return; }
  const en = state.lang === 'en';
  const name = weekState.clientName || (state.clientName || L.defaultClient);
  const MTYPES = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const dayLabels = L.weekDays;
  const showMacros = weekState.showMacros;
  const showMicros = weekState.showMicros;
  const microSel = weekState.microSelection || MICRO_KEYS;

  const dayHeaders = `<div class="ws-row"><div class="ws-dh"></div>${dayLabels.map(dl=>`<div class="ws-dh">${esc(dl)}</div>`).join('')}</div>`;

  // Dedup helper: each day's first snack slot wins so a meal doesn't appear in 3 columns
  const usedSnackPdf = weekState.days.map(()=>new Set());
  const rows = MTYPES.map(mt=>{
    const cells = weekState.days.map((dayArr,di)=>{
      // Find matching entries (new data model: {id, servings} objects)
      const matchingEntries = dayArr.filter(e=>{
        const m = byId(entryId(e));
        return m && slotEntryMatch(e, m, mt) && !usedSnackPdf[di].has(m.id);
      });
      const isSnackSlot = SLOT_LIB_TYPE[mt] && SLOT_LIB_TYPE[mt]!==mt;
      const maxPerCell = 2;
      const entries = matchingEntries.slice(0, maxPerCell);
      entries.forEach(e=>usedSnackPdf[di].add(entryId(e)));
      if(!entries.length) return `<div class="ws-cell"></div>`;

      // Render single or split view (Feature 4: split view in PDF)
      const mealsHTML = entries.map(e=>{
        const m = byId(entryId(e)); if(!m) return '';
        const d = c(m);
        const serv = entryServ(e);
        const servLabel = serv !== 1 ? ` <span class="ws-serv">(${serv} ${L.weekServings})</span>` : '';
        const mc = showMacros && m.macros ? `<div class="ws-mm">P${Math.round(m.macros.protein.g*serv)} F${Math.round(m.macros.fat.g*serv)} C${Math.round(m.macros.netCarbs.g*serv)} ${Math.round(macroCalories(m, serv))}${L.weekCalories}</div>` : '';
        const img = m.img ? `<div class="ws-img"><img src="${imgSrc(m)}" alt="" onerror="this.remove()"></div>` : `<div class="ws-img"><span class="ph-emoji">${m.emoji}</span></div>`;
        return `<div class="ws-m-item">${img}<div class="ws-mn">${wrapName(d.name)}${servLabel}</div>${mc}</div>`;
      }).join('');

      if(entries.length > 1){
        return `<div class="ws-cell ws-split">${mealsHTML}</div>`;
      }
      return `<div class="ws-cell">${mealsHTML}</div>`;
    }).join('');
    return `<div class="ws-row"><div class="ws-ml">${L.type[mt]}</div>${cells}</div>`;
  }).join('');

  // Totals — macros always; micronutrients when enabled (Feature 6)
  const totRows = ['protein','fat','netCarbs'].map(k=>{
    const cells = weekState.days.map(dayArr=>{
      const dm = dayMacros(dayArr);
      const v = Math.round(dm[k]);
      return `<div class="ws-tcell">${v}g</div>`;
    }).join('');
    const label = k==='protein'?L.weekProtein : k==='fat'?L.weekFat : L.weekCarbs;
    return `<div class="ws-trow"><div class="ws-tlabel">${label}</div>${cells}</div>`;
  }).join('');
  const calCells = weekState.days.map(dayArr=>{
    const dm = dayMacros(dayArr);
    return `<div class="ws-tcell">${Math.round(dm.calories)}</div>`;
  }).join('');
  // Day-of-week header row for the totals section (Task 11)
  const totDayHeader = `<div class="ws-trow ws-thead"><div class="ws-tlabel"></div>${dayLabels.map(dl=>`<div class="ws-thcell">${esc(dl)}</div>`).join('')}</div>`;
  let totRowsAll = totDayHeader + totRows + `<div class="ws-trow"><div class="ws-tlabel">${L.weekCalories}</div>${calCells}</div>`;
  // Micronutrient rows in PDF (Feature 6)
  if(showMicros){
    microSel.forEach(mk=>{
      const cells = weekState.days.map(dayArr=>{
        const dm = dayMicros(dayArr);
        return `<div class="ws-tcell">${Math.round(dm[mk])}${L.microUnit[mk]}</div>`;

    });

  // Notes section

function showSavePlanBar(){
  const L = t();

  const existing = $('#wk-save-bar');
  if(existing){ existing.remove(); return; }
  const bar = document.createElement('div');
  bar.id = 'wk-save-bar';
  bar.className = 'wk-save-bar';
  const defaultName = weekState.clientName
    ? `${weekState.clientName} - ${new Date().toLocaleDateString()}`
    : `Plan - ${new Date().toLocaleDateString()}`;
  bar.innerHTML = `
    <input type="text" id="wk-plan-name" placeholder="${L.weekPlanNamePh}" value="${esc(defaultName)}">
    <button class="btn primary" id="wk-plan-save-btn">${L.weekSavePlan}</button>
    <button class="btn" id="wk-plan-cancel-btn">${L.weekClose}</button>
  `;
  const actions = $('#weekSheetModal .week-actions');
  if(actions) actions.parentNode.insertBefore(bar, actions);
  const input = $('#wk-plan-name');
  if(input){ input.focus(); input.select(); }
  $('#wk-plan-save-btn').onclick = ()=>{
    const name = input.value.trim();
    if(!name){ toast(L.weekPlanNameReq); return; }
    saveCurrentPlan(name);
    bar.remove();
    toast(L.weekPlanSaved);
  };
  $('#wk-plan-cancel-btn').onclick = ()=>{ bar.remove(); };
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); $('#wk-plan-save-btn').click(); }
    if(e.key === 'Escape'){ bar.remove(); }
  });
}

function showPlansList(){
  const L = t();
  const plans = loadSavedPlans();
  // Remove existing overlay
  const existing = $('#wk-plans-overlay');
  if(existing){ existing.remove(); return; }
  const overlay = document.createElement('div');
  overlay.id = 'wk-plans-overlay';
  overlay.className = 'wk-plans-overlay';
  const plansHTML = plans.length === 0
    ? `<div class="wk-plans-empty">${L.weekNoSavedPlans}</div>`
    : plans.slice().reverse().map(p=>{
        const dt = new Date(p.savedAt || p.id);
        const dateStr = dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const clientName = p.data && p.data.clientName ? ` · ${esc(p.data.clientName)}` : '';
        return `<div class="wk-plan-item">
          <div class="wk-plan-info">
            <div class="wk-plan-name">${esc(p.name)}${clientName}</div>
            <div class="wk-plan-date">${dateStr}</div>
          </div>
          <div class="wk-plan-actions">
            <button class="btn-sm primary" data-plan-load="${esc(p.name)}">${L.weekLoadPlan}</button>
            <button class="btn-sm danger" data-plan-del="${esc(p.name)}">${L.weekDeletePlan}</button>
          </div>
        </div>`;
      }).join('');
  overlay.innerHTML = `
    <div class="wk-plans-modal">
      <div class="wk-plans-head">
        <h3>${L.weekSavedPlans}</h3>
        <button class="modal-close" id="wk-plans-close">✕</button>
      </div>
      <div class="wk-plans-body">${plansHTML}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  $('#wk-plans-close').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  $$('#wk-plans-overlay [data-plan-load]').forEach(b=>{
    b.onclick = ()=>{
      const name = b.dataset.planLoad;
      if(loadPlanIntoState(name)){
        overlay.remove();
        renderWeekModal();
        toast(L.weekPlanLoaded);
      }
    };
  });
  $$('#wk-plans-overlay [data-plan-del]').forEach(b=>{
    b.onclick = ()=>{
      const name = b.dataset.planDel;
      deleteSavedPlan(name);
      overlay.remove();
      showPlansList();
      toast(L.weekPlanDeleted);
    };
  });
}

function renderDetailModal(){
  const L = t();
  ensureDetailDays();
  const di = detailState.currentDay;
  const day = detailState.days[di] || detailState.days[0];
  const microSel = detailState.microSelection || [];

  /* ---- Day tabs ---- */
  const tabsHTML = Array.from({length: detailState.numDays}, (_,i)=>{

  /* ---- Config area ---- */
  const cfgHTML = `
    <div class="dt-config">
      <div class="cfg">
        <label>${L.weekClientName}</label>
        <input id="dt-client" value="${esc(detailState.clientName)}" placeholder="${L.weekClientPh}" style="width:150px">

      </div>

  /* ---- Helper: build macro/micro lines for a component ---- */

    const serv = comp.servings || 1;
    const macLine = detailState.showMacros && m.macros

      : '';
    const microLines = (detailState.microSelection||[]).map(mk=>{
      if(!m.micros) return '';
      return `${L.microLabels[mk]}: <b>${Math.round((m.micros[mk]||0)*serv)}</b>${L.microUnit[mk]}`;
    }).filter(Boolean);
    return {mac:macLine, micros:microLines};
  }

  /* ---- Helper: calculate row totals (macros + micros) ---- */
  function rowTotals(row){
    const entries = row.components.map(c=>{
      const m = byId(c.id); if(!m) return null;
      return {id:c.id, servings:c.servings||1};
    }).filter(Boolean);
    const dm = dayMacros(entries);
    const dmi = dayMicros(entries);
    return {dm, dmi};
  }

  /* ---- Meal rows for current day ---- */
  const rowsHTML = day.rows.map((row, ri)=>{
    const {dm, dmi} = rowTotals(row);
    const rowMac = detailState.showMacros
      ? `P<b>${Math.round(dm.protein)}</b>g F<b>${Math.round(dm.fat)}</b>g C<b>${Math.round(dm.netCarbs)}</b>g <b>${Math.round(dm.calories)}</b>${L.weekCalories}`
      : '';
    const rowMicros = microSel.map(mk=>`${L.microLabels[mk]}: <b>${Math.round(dmi[mk])}</b>${L.microUnit[mk]}`).join(' · ');
    const rowMacrosHTML = (rowMac || rowMicros) ? `<span class="dt-row-macros">${rowMac}${rowMac && rowMicros ? ' · ' : ''}${rowMicros}</span>` : '';

    const compsHTML = row.components.map((comp, ci)=>{
      const m = byId(comp.id); if(!m) return '';
      const d = c(m);
      const serv = comp.servings || 1;
      const thumb = m.img
        ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">`
        : `<span style="font-size:32px">${m.emoji}</span>`;
      const {mac, micros} = compMacLines(comp);
      const portionStr = getPortionDisplay(m, serv);
      return `<div class="dt-comp" data-dt-comp="${ri}:${ci}">
        <div class="dt-comp-thumb" data-type="${m.type}">${thumb}</div>
        <div class="dt-comp-name">${esc(d.name)}</div>
        <div class="dt-comp-portion">${esc(portionStr)}</div>
        <div class="dt-comp-serv-row">
          <label>${L.detailServings}</label>
          <input class="dt-comp-serv-input" type="number" min="0.5" step="0.5" value="${serv}" data-dt-serv="${ri}:${ci}">
        </div>
        ${mac ? `<div class="dt-comp-mac">${mac}</div>` : ''}
        ${micros.map(ml=>`<div class="dt-comp-mac">${ml}</div>`).join('')}
        <label style="display:flex;align-items:center;gap:3px;padding:2px 8px 5px;font-size:13px;color:var(--muted);cursor:pointer" title="${L.detailExportRecipe}">
          <input type="checkbox" class="dt-comp-export-cb" data-dt-exportcb="${ri}:${ci}" ${comp.includeInExport === true ? 'checked' : ''}>
        </label>
        <button class="dt-comp-del" data-dt-compdel="${ri}:${ci}">✕</button>
      </div>`;
    }).join('');

    /* Empty / add component slots */
    const maxComps = 4;
    const emptySlots = maxComps - row.components.length;
    const addCompsHTML = emptySlots > 0
      ? Array.from({length: emptySlots}, (_,ci)=>{
          const realCi = row.components.length + ci;
          return `<div class="dt-comp-empty" data-dt-addcomp="${ri}:${realCi}">+</div>`;
        }).join('')
      : '';

    return `<div class="dt-row" data-dt-row="${ri}">
      <div class="dt-row-head">
        <input class="dt-row-label" type="text" value="${esc(row.label||'')}" placeholder="${L.detailRowLabelPh}" data-dt-rowlabel="${ri}">
        ${rowMacrosHTML}
        <button class="dt-row-del" data-dt-rowdel="${ri}">✕</button>
      </div>
      <div class="dt-comps">${compsHTML}${addCompsHTML}</div>
    </div>`;
  }).join('');

  /* ---- Day totals ---- */
  const entries = detailDayEntries(day);
  const dm = dayMacros(entries);
  const dmi = dayMicros(entries);
  let totalsHTML = `<div class="dt-day-totals"><div class="dt-trow">`;
  totalsHTML += `<span class="dt-tcell"><span class="dt-tlabel">${L.protein}</span> <b>${Math.round(dm.protein)}g</b></span>`;
  totalsHTML += `<span class="dt-tcell"><span class="dt-tlabel">${L.fat}</span> <b>${Math.round(dm.fat)}g</b></span>`;
  totalsHTML += `<span class="dt-tcell"><span class="dt-tlabel">${L.netCarbs}</span> <b>${Math.round(dm.netCarbs)}g</b></span>`;
  totalsHTML += `<span class="dt-tcell"><span class="dt-tlabel">${L.weekCalories}</span> <b>${Math.round(dm.calories)}</b></span>`;
  microSel.forEach(mk=>{
    totalsHTML += `<span class="dt-tcell"><span class="dt-tlabel">${L.microLabels[mk]}</span> <b>${Math.round(dmi[mk])}${L.microUnit[mk]}</b></span>`;
  });
  totalsHTML += `</div></div>`;

  /* ---- Assemble modal ---- */
  $('#detailSheetModal').innerHTML = `
    <button class="modal-close" data-detail-close>✕</button>
    <div class="dt-tabs">${tabsHTML}</div>
    <div class="dt-main-layout">
      <div class="dt-left-panel">
        ${cfgHTML}
      </div>
      <div class="dt-right-panel">
        <div class="dt-day-wrap">
          ${rowsHTML}
          <div class="dt-row-add" data-dt-addrow>${L.detailAddRow}</div>
          ${totalsHTML}
          <div class="dt-hint">${L.detailDragHint}</div>
        </div>
      </div>
    </div>
    <div class="dt-actions">
      <button class="btn" id="dt-save-plan">${L.detailSavePlan}</button>
      <button class="btn" id="dt-load-plan">${L.detailLoadPlan}</button>
      <button class="btn" id="dt-clear">${L.detailClear}</button>
      <button class="btn coral-btn" id="dt-export">${L.detailExport}</button>
    </div>
  `;

  /* ---- Bind events ---- */
  $$('#detailSheetModal [data-detail-close]').forEach(b=>b.onclick=closeDetailModal);

  // Day tabs
  $$('#detailSheetModal [data-dt-tab]').forEach(b=>b.onclick=()=>{
    detailState.currentDay = +b.dataset.dtTab;
    saveDetail(); renderDetailModal();
  });

  // Config: client name
  const dtClient = $('#dt-client');
  if(dtClient) dtClient.addEventListener('input', e=>{ detailState.clientName=e.target.value; saveDetail(); });

  // Config: num days
  const dtNumDays = $('#dt-numdays');
  if(dtNumDays) dtNumDays.addEventListener('change', e=>{
    detailState.numDays = +e.target.value;
    ensureDetailDays();
    if(detailState.currentDay >= detailState.numDays) detailState.currentDay = detailState.numDays - 1;
    saveDetail(); renderDetailModal();
  });

  // Config: show macros
  const dtShowMacros = $('#dt-showmacros');
  if(dtShowMacros) dtShowMacros.addEventListener('change', e=>{ detailState.showMacros=e.target.checked; saveDetail(); renderDetailModal(); });

  // Config: show component macros in PDF
  const dtShowCompMacros = $('#dt-showcompmacros');
  if(dtShowCompMacros) dtShowCompMacros.addEventListener('change', e=>{ detailState.showCompMacros=e.target.checked; saveDetail(); });

  // Config: micronutrient checkboxes
  $$('#detailSheetModal [data-dt-micro]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const mk = cb.dataset.dtMicro;
      if(cb.checked && !microSel.includes(mk)) microSel.push(mk);
      else { const i = microSel.indexOf(mk); if(i>=0) microSel.splice(i,1); }
      detailState.microSelection = microSel;
      saveDetail(); renderDetailModal();
    });
  });

  // Config: include recipes
  const dtInclRecipes = $('#dt-inclrecipes');
  if(dtInclRecipes) dtInclRecipes.addEventListener('change', e=>{ detailState.includeRecipes=e.target.checked; saveDetail(); });

  // Config: notes
  const dtNotes = $('#dt-notes');
  if(dtNotes) dtNotes.addEventListener('input', e=>{ detailState.notes=e.target.value; saveDetail(); });

  // Row label editing
  $$('#detailSheetModal [data-dt-rowlabel]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const ri = +inp.dataset.dtRowlabel;
      day.rows[ri].label = e.target.value;
      saveDetail();
    });
  });

  // Row delete
  $$('#detailSheetModal [data-dt-rowdel]').forEach(b=>b.onclick=()=>{
    const ri = +b.dataset.dtRowdel;
    day.rows.splice(ri, 1);
    if(!day.rows.length) day.rows.push(mkDetailRow(''));
    saveDetail(); renderDetailModal();
  });

  // Add row
  $$('#detailSheetModal [data-dt-addrow]').forEach(b=>b.onclick=()=>{
    day.rows.push(mkDetailRow(''));
    saveDetail(); renderDetailModal();
  });

  // Component delete
  $$('#detailSheetModal [data-dt-compdel]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [ri, ci] = b.dataset.dtCompdel.split(':').map(Number);
    day.rows[ri].components.splice(ci, 1);
    saveDetail(); renderDetailModal();
  });

  // Serving size change — update servings and re-render to refresh nutrient amounts
  $$('#detailSheetModal [data-dt-serv]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const [ri, ci] = inp.dataset.dtServ.split(':').map(Number);
      const val = parseFloat(e.target.value);
      day.rows[ri].components[ci].servings = (isNaN(val) || val < 0.5) ? 1 : val;
      saveDetail();
      // Update only the affected component's macro/amount text (avoid full re-render losing focus)
      updateDetailCompOnly(ri, ci);
      updateDetailRowTotals(ri);
      updateDetailDayTotals();
    });
  });

  // Export recipe checkbox
  $$('#detailSheetModal [data-dt-exportcb]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      e.stopPropagation();
      const [ri, ci] = cb.dataset.dtExportcb.split(':').map(Number);
      day.rows[ri].components[ci].includeInExport = cb.checked;
      saveDetail();
    });
  });

  // Add component (click empty slot)
  $$('#detailSheetModal [data-dt-addcomp]').forEach(el=>el.onclick=()=>{
    const [ri, ci] = el.dataset.dtAddcomp.split(':').map(Number);
    openDetailPicker(di, ri);
  });

  // Component click (show full recipe popup)
  $$('#detailSheetModal [data-dt-comp]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-dt-compdel]') || e.target.closest('[data-dt-serv]') || e.target.closest('[data-dt-exportcb]')) return;
    const [ri, ci] = el.dataset.dtComp.split(':').map(Number);
    const comp = day.rows[ri] && day.rows[ri].components[ci];
    if(comp && comp.id) showDetailRecipe(comp.id);
  });

  // Drag-and-drop onto empty slots and existing components
  $$('#detailSheetModal .dt-comp-empty, #detailSheetModal .dt-comp').forEach(el=>{
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.style.borderColor='var(--brand-coral)'; el.style.background='var(--brand-soft)'; });
    el.addEventListener('dragleave', ()=>{ el.style.borderColor=''; el.style.background=''; });
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.style.borderColor=''; el.style.background='';
      const mid = e.dataTransfer.getData('text/plain');
      if(!mid) return;
      if(mid.startsWith('weekmove:') || mid.startsWith('dtmove:')) return; // ignore internal drags here
      const ri = el.dataset.dtAddcomp ? +el.dataset.dtAddcomp.split(':')[0] : (el.dataset.dtComp ? +el.dataset.dtComp.split(':')[0] : -1);
      if(ri < 0) return;
      const row = day.rows[ri];
      if(row.components.length >= 4) return;
      if(!row.components.some(c=>c.id===mid)){
        row.components.push(mkDetailComponent(mid));
        saveDetail(); renderDetailModal();
      }
    });
  });

  // Make components draggable (for reordering / moving between rows)
  $$('#detailSheetModal [data-dt-comp]').forEach(el=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart', e=>{
      const [ri, ci] = el.dataset.dtComp.split(':').map(Number);
      e.dataTransfer.setData('text/plain', `dtmove:${di}:${ri}:${ci}`);
    });
  });

  // Handle drop from component drag (move between rows)
  $$('#detailSheetModal .dt-comp-empty, #detailSheetModal .dt-comp').forEach(el=>{
    el.addEventListener('drop', e=>{
      const data = e.dataTransfer.getData('text/plain');
      if(data && data.startsWith('dtmove:')){
        e.preventDefault();
        const [, fromDi, fromRi, fromCi] = data.split(':').map(Number);
        const targetRi = el.dataset.dtAddcomp ? +el.dataset.dtAddcomp.split(':')[0] : (el.dataset.dtComp ? +el.dataset.dtComp.split(':')[0] : -1);
        if(targetRi < 0) return;
        const fromDay = detailState.days[fromDi] || day;
        const comp = fromDay.rows[fromRi]?.components[fromCi];
        if(!comp) return;
        const targetRow = day.rows[targetRi];
        if(targetRow.components.length >= 4) return;
        if(fromDi === di && fromRi === targetRi) return;
        fromDay.rows[fromRi].components.splice(fromCi, 1);
        targetRow.components.push(comp);
        saveDetail(); renderDetailModal();
      }
    }, true);
  });

  // Action buttons
  $('#dt-export').onclick = ()=>exportDetailPDF();
  $('#dt-clear').onclick = ()=>{
    detailState.days = detailState.days.map((d,i)=> i===di ? mkDetailDay(d.label||('Day '+(i+1))) : d);
    saveDetail(); renderDetailModal();
    toast(L.detailCleared);
  };
  $('#dt-save-plan').onclick = ()=>showDetailSaveBar();
  $('#dt-load-plan').onclick = ()=>showDetailPlansList();
}

/* ---- Update only one component's macro/amount display (avoids losing input focus) ---- */
function updateDetailCompOnly(ri, ci){
  const day = detailState.days[detailState.currentDay] || detailState.days[0];
  const comp = day.rows[ri]?.components[ci]; if(!comp) return;
  const el = $(`#detailSheetModal [data-dt-comp="${ri}:${ci}"]`); if(!el) return;
  const m = byId(comp.id); if(!m) return;
  const serv = comp.servings || 1;
  const L = t();
  // Update portion display
  const portionEl = el.querySelector('.dt-comp-portion');
  if(portionEl) portionEl.textContent = getPortionDisplay(m, serv);
  // Update macro lines
  const macEls = el.querySelectorAll('.dt-comp-mac');
  const macLine = detailState.showMacros && m.macros
    ? `P<b>${Math.round(m.macros.protein.g*serv)}</b>g F<b>${Math.round(m.macros.fat.g*serv)}</b>g C<b>${Math.round(m.macros.netCarbs.g*serv)}</b>g <b>${Math.round(macroCalories(m, serv))}</b>${L.weekCalories}`
    : '';
  if(macEls.length > 0 && macLine) macEls[0].innerHTML = macLine;
}

/* ---- Update row totals inline ---- */
function updateDetailRowTotals(ri){
  const day = detailState.days[detailState.currentDay] || detailState.days[0];
  const row = day.rows[ri]; if(!row) return;
  const el = $(`#detailSheetModal [data-dt-row="${ri}"] .dt-row-macros`); if(!el) return;
  const entries = row.components.map(c=>{const m=byId(c.id);return m?{id:c.id,servings:c.servings||1}:null;}).filter(Boolean);
  const dm = dayMacros(entries);
  const dmi = dayMicros(entries);
  const L = t();
  const microSel = detailState.microSelection || [];
  let html = detailState.showMacros
    ? `P<b>${Math.round(dm.protein)}</b>g F<b>${Math.round(dm.fat)}</b>g C<b>${Math.round(dm.netCarbs)}</b>g <b>${Math.round(dm.calories)}</b>${L.weekCalories}`
    : '';
  const microStr = microSel.map(mk=>`${L.microLabels[mk]}: <b>${Math.round(dmi[mk])}</b>${L.microUnit[mk]}`).join(' · ');
  if(html && microStr) html += ' · ' + microStr;
  else if(!html) html = microStr;
  el.innerHTML = html;
}

/* ---- Update day totals inline ---- */
function updateDetailDayTotals(){
  const day = detailState.days[detailState.currentDay] || detailState.days[0];
  const entries = detailDayEntries(day);
  const dm = dayMacros(entries);
  const dmi = dayMicros(entries);
  const el = $('#detailSheetModal .dt-day-totals .dt-trow'); if(!el) return;
  const L = t();
  const microSel = detailState.microSelection || [];
  let html = '';
  html += `<span class="dt-tcell"><span class="dt-tlabel">${L.protein}</span> <b>${Math.round(dm.protein)}g</b></span>`;
  html += `<span class="dt-tcell"><span class="dt-tlabel">${L.fat}</span> <b>${Math.round(dm.fat)}g</b></span>`;
  html += `<span class="dt-tcell"><span class="dt-tlabel">${L.netCarbs}</span> <b>${Math.round(dm.netCarbs)}g</b></span>`;
  html += `<span class="dt-tcell"><span class="dt-tlabel">${L.weekCalories}</span> <b>${Math.round(dm.calories)}</b></span>`;
  microSel.forEach(mk=>{
    html += `<span class="dt-tcell"><span class="dt-tlabel">${L.microLabels[mk]}</span> <b>${Math.round(dmi[mk])}${L.microUnit[mk]}</b></span>`;
  });
  el.innerHTML = html;
}

/* ---- Detail recipe popup (shows full recipe inside detail modal) ---- */
function showDetailRecipe(id){
  const L = t(), m = byId(id); if(!m){ renderDetailModal(); return; }
  const d = c(m);
  const cats = mealFoodCats(m);
  const catLabel = L.foodCatLabel[cats[0]] || L.foodCatLabel.complete;

    const ml = L.microLabels[k] || k;
    const mu = L.microUnit[k] || '';
    return `<span class="dt-rec-micro"><b>${Math.round(v)}${mu}</b> ${ml}</span>`;
  }).filter(Boolean).join('') : '';

  $('#detailSheetModal').innerHTML = `
    <button class="modal-close" data-detail-close>✕</button>
    <div class="dt-rec-wrap">
      <button class="btn dt-rec-back" data-dt-back>← ${L.detailBack}</button>
      <div class="dt-rec-card">
        ${photoHTML(m,'dt-rec-hero')}
        <div class="dt-rec-body">
          <h2>${esc(d.name)}</h2>
          <div class="dt-rec-alt">${esc(altName(m))}</div>
          <div class="dt-rec-meta">
            <span><b>${catLabel}</b></span>
            <span>⏱ <b>${esc(d.time)}</b></span>
            <span>🍽 <b>${esc(d.servings)}</b></span>
          </div>
          <div class="dt-rec-tags">${(m.tags||[]).map(x=>`<span class="tag">${L.tag[x]||x}</span>`).join('')}
            ${(m.contains||[]).map(x=>`<span class="tag">${L.containsTag(x)}</span>`).join('')}</div>
          ${d.why?`<div class="dt-rec-why">${esc(d.why)}</div>`:''}
          <div class="dt-rec-two">
            <div>
              <div class="sec-t">${L.ingredients}</div>
              <ul class="ing">${d.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
            </div>
            <div>
              <div class="sec-t">${L.method}</div>
              <ol class="steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
            </div>
          </div>
          ${m.macros ? `<div class="dt-rec-macros"><div class="sec-t">${L.macrosLabel}</div>${macroHTML(m)}</div>` : ''}
          ${microHTML ? `<div class="dt-rec-micros"><div class="sec-t">${L.weekMicros}</div><div class="dt-rec-micro-list">${microHTML}</div></div>` : ''}
          ${d.notes?`<div class="dt-rec-notes"><b>${L.notesLabel}</b>${esc(d.notes)}</div>`:''}
        </div>
      </div>
    </div>
  `;
  $$('#detailSheetModal [data-detail-close]').forEach(b=>b.onclick=closeDetailModal);
  $$('#detailSheetModal [data-dt-back]').forEach(b=>b.onclick=()=>renderDetailModal());
}

/* ---- Detail picker ---- */
let dtPickerCat = 'all';
let dtPickerDiet = new Set();
function openDetailPicker(dayIdx, rowIdx){
  const L = t();
  const pool = ALL_MEALS.slice();
  if(!pool.length){ toast(L.detailNoMatch); return; }
  dtPickerCat = 'all';
  dtPickerDiet = new Set();

  // Category tab counts
  const catCounts = { all:pool.length, protein:0, carb:0, vegetable:0, 'fat-flavor':0, complete:0 };
  pool.forEach(m=>{ mealFoodCats(m).forEach(fc=>{ if(catCounts[fc]!==undefined) catCounts[fc]++; }); });

  function matchesDietFilter(m){
    if(dtPickerDiet.size === 0) return true;
    for(const diet of dtPickerDiet){
      if(diet === 'vegetarian' && !(m.tags||[]).includes('vegetarian')) return false;
      if(diet === 'vegan' && !(m.tags||[]).includes('vegan')) return false;
      if(diet === 'gluten-free' && (m.contains||[]).includes('gluten')) return false;
      if(diet === 'dairy-free' && (m.contains||[]).includes('dairy')) return false;
    }
    return true;
  }

  function getFilteredPool(){
    let result = pool;
    if(dtPickerCat !== 'all') result = result.filter(m=>mealFoodCats(m).includes(dtPickerCat));
    result = result.filter(matchesDietFilter);
    return result;
  }

  function renderPickGrid(list){
    return list.map(m=>{
      const d = c(m);
      return `<div class="wk-pick-card" data-dt-pick="${m.id}">
        <div class="wk-pick-thumb" data-type="${m.type}">
          ${m.img ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">` : `<span style="font-size:32px">${m.emoji}</span>`}
        </div>
        <div class="wk-pick-name">${esc(d.name)}</div>
        <div class="wk-pick-meta">${esc(d.time)} · ${esc(d.servings)}${L.servingsUnit}</div>
      </div>`;
    }).join('');
  }

  function renderCatTabs(){
    return ['all','protein','carb','vegetable','fat-flavor','complete'].map(k=>
      `<button class="dt-pick-tab ${dtPickerCat===k?'on':''}" data-dt-pickcat="${k}">${L.tabs[k]}<span class="n">${catCounts[k]}</span></button>`
    ).join('');
  }

  function renderDietFilters(){
    const labels = { vegetarian: L.dtDietVegetarian, vegan: L.dtDietVegan, 'gluten-free': L.dtDietGlutenFree, 'dairy-free': L.dtDietDairyFree };
    return DIET_FILTERS.map(k=>
      `<button class="dt-pick-diet ${dtPickerDiet.has(k)?'on':''}" data-dt-diet="${k}">${labels[k]}</button>`
    ).join('');
  }

  function refreshGrid(){
    const basePool = getFilteredPool();
    const searchEl = $('#dtPickSearch');
    const q = searchEl ? searchEl.value.toLowerCase().trim() : '';
    const finalPool = q ? basePool.filter(m=>{
      const hay = (((m.en&&m.en.name)||'') + ' ' + ((m.zh&&m.zh.name)||'')).toLowerCase();
      return hay.includes(q);
    }) : basePool;
    const g = $('#dtPickGrid');
    const c2 = $('#dtPickCount');
    if(g) g.innerHTML = renderPickGrid(finalPool) || `<div class="empty">${L.empty}</div>`;
    if(c2) c2.textContent = finalPool.length;
    $$('#detailSheetModal [data-dt-pick]').forEach(el=>el.onclick=()=>pickDetailMeal(el.dataset.dtPick, dayIdx, rowIdx));
  }

  $('#detailSheetModal').innerHTML = `
    <button class="modal-close" data-detail-close>✕</button>
    <div style="padding:16px 20px">
      <button class="wk-pick-back" data-dt-back>&#8592; ${L.detailBack}</button>
      <h2 style="font-family:var(--font-heading);font-size:16px;margin-bottom:8px">${L.detailAddComp}</h2>
      <div class="dt-pick-tabs" id="dtPickTabs">${renderCatTabs()}</div>
      <div class="dt-pick-diet-row" id="dtPickDiet">${renderDietFilters()}</div>
      <div class="wk-pick-searchbar">
        <span class="search-ic">🔍</span>
        <input class="wk-pick-search" id="dtPickSearch" type="search" autocomplete="off" placeholder="${L.libSearch}">
        <span class="wk-pick-count" id="dtPickCount">${pool.length}</span>
      </div>
      <div class="wk-pick-grid" id="dtPickGrid">${renderPickGrid(pool) || `<div class="empty">${L.empty}</div>`}</div>
    </div>
  `;

  // Category tab clicks
  $$('#detailSheetModal [data-dt-pickcat]').forEach(b=>b.onclick=()=>{
    dtPickerCat = b.dataset.dtPickcat;
    // Update tab active states
    $$('#detailSheetModal [data-dt-pickcat]').forEach(tb=>tb.classList.toggle('on', tb.dataset.dtPickcat===dtPickerCat));
    refreshGrid();
  });

  // Diet filter clicks
  $$('#detailSheetModal [data-dt-diet]').forEach(b=>b.onclick=()=>{
    const diet = b.dataset.dtDiet;
    if(dtPickerDiet.has(diet)) dtPickerDiet.delete(diet);
    else dtPickerDiet.add(diet);
    b.classList.toggle('on');
    refreshGrid();
  });

  // Search input
  const searchEl = $('#dtPickSearch');
  if(searchEl) searchEl.addEventListener('input', ()=>refreshGrid());

  function pickDetailMeal(mid, di, ri){
    const day = detailState.days[di]; if(!day) return;
    const row = day.rows[ri]; if(!row) return;
    if(row.components.length >= 4) return;
    if(!row.components.some(c=>c.id===mid)){
      row.components.push(mkDetailComponent(mid));
      saveDetail(); renderDetailModal();
    } else {
      renderDetailModal();
    }
  }

  $$('#detailSheetModal [data-detail-close]').forEach(b=>b.onclick=()=>renderDetailModal());
  $$('#detailSheetModal [data-dt-back]').forEach(b=>b.onclick=()=>renderDetailModal());
  $$('#detailSheetModal [data-dt-pick]').forEach(el=>el.onclick=()=>pickDetailMeal(el.dataset.dtPick, dayIdx, rowIdx));
}
