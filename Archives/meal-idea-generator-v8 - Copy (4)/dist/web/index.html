/* ---- Detail PDF export ---- */
function exportDetailPDF(){
  const L = t();
  ensureDetailDays();
  // Check if any day has content
  const hasContent = detailState.days.slice(0, detailState.numDays).some(d=>d.rows.some(r=>r.components.length));
  if(!hasContent){ toast(L.weekNeedGen || 'Add meals first'); return; }

  const name = detailState.clientName || (state.clientName || L.defaultClient);
  const showMacros = detailState.showMacros;
  const showCompMacros = detailState.showCompMacros !== false;
  const microSel = detailState.microSelection || [];
  const includeRecipes = detailState.includeRecipes;
  const en = state.lang === 'en';

  // Build each day's HTML
  const daysHTML = detailState.days.slice(0, detailState.numDays).map((day, di)=>{
    const entries = detailDayEntries(day);
    const dm = dayMacros(entries);
    const dmi = dayMicros(entries);

    // Meal rows
    const rowsHTML = day.rows.map(row=>{
      // Row totals for macro line beside label
      const rowEntries = row.components.map(c=>{const m=byId(c.id);return m?{id:c.id,servings:c.servings||1}:null;}).filter(Boolean);
      const rdm = dayMacros(rowEntries);
      const rmi = dayMicros(rowEntries);
      const rowMac = showMacros
        ? `${L.protein} <b>${Math.round(rdm.protein)}</b>g · ${L.fat} <b>${Math.round(rdm.fat)}</b>g · ${L.netCarbs} <b>${Math.round(rdm.netCarbs)}</b>g · <b>${Math.round(rdm.calories)}</b>${L.weekCalories}`
        : '';
      const rowMicros = microSel.map(mk=>`${L.microLabels[mk]}: <b>${Math.round(rmi[mk])}</b>${L.microUnit[mk]}`).join(' · ');
      const rowMacrosHTML = (rowMac || rowMicros) ? `<span class="ds-row-macros">${rowMac}${rowMac && rowMicros ? ' · ' : ''}${rowMicros}</span>` : '';

      const compsHTML = row.components.map(comp=>{
        const m = byId(comp.id); if(!m) return '';
        const d = c(m);
        const serv = comp.servings || 1;
        const thumb = m.img
          ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">`
          : `<span class="ph-emoji">${m.emoji}</span>`;
        const macLine = showCompMacros && showMacros && m.macros
          ? `${L.protein} <b>${Math.round(m.macros.protein.g*serv)}</b>g · ${L.fat} <b>${Math.round(m.macros.fat.g*serv)}</b>g · ${L.netCarbs} <b>${Math.round(m.macros.netCarbs.g*serv)}</b>g · <b>${Math.round(macroCalories(m, serv))}</b>${L.weekCalories}`
          : '';
        const microLines = showCompMacros ? microSel.map(mk=>{
          if(!m.micros) return '';
          return `${L.microLabels[mk]}: <b>${Math.round((m.micros[mk]||0)*serv)}</b>${L.microUnit[mk]}`;
        }).filter(Boolean) : [];
        const portionStr = getPortionDisplay(m, serv);
        return `<div class="ds-comp">
          <div class="ds-comp-thumb" data-type="${m.type}">${thumb}</div>
          <div class="ds-comp-name">${esc(d.name)}</div>
          <div class="ds-comp-portion">${esc(portionStr)}</div>
          ${macLine ? `<div class="ds-comp-mac">${macLine}</div>` : ''}
          ${microLines.map(ml=>`<div class="ds-comp-mac">${ml}</div>`).join('')}
        </div>`;
      }).join('');

      if(!compsHTML) return '';
      const label = row.label || (L.detailTitle2);
      return `<div class="ds-row">
        <div class="ds-row-label">${esc(label)}${rowMacrosHTML}</div>
        <div class="ds-comps">${compsHTML}</div>
      </div>`;
    }).join('');

    // Day totals
    let totHTML = `<div class="ds-day-totals"><div class="ds-trow">`;
    totHTML += `<span class="ds-tcell"><span class="ds-tlabel">${L.protein}</span> <b>${Math.round(dm.protein)}g</b></span>`;
    totHTML += `<span class="ds-tcell"><span class="ds-tlabel">${L.fat}</span> <b>${Math.round(dm.fat)}g</b></span>`;
    totHTML += `<span class="ds-tcell"><span class="ds-tlabel">${L.netCarbs}</span> <b>${Math.round(dm.netCarbs)}g</b></span>`;
    totHTML += `<span class="ds-tcell"><span class="ds-tlabel">${L.weekCalories}</span> <b>${Math.round(dm.calories)}</b></span>`;
    microSel.forEach(mk=>{
      totHTML += `<span class="ds-tcell"><span class="ds-tlabel">${L.microLabels[mk]}</span> <b>${Math.round(dmi[mk])}${L.microUnit[mk]}</b></span>`;
    });
    totHTML += `</div></div>`;

    // Notes
    const notesHTML = detailState.notes && detailState.notes.trim()
      ? `<div class="ds-notes">${esc(detailState.notes.trim())}</div>`
      : '';

    const dayLabel = day.label || (`${L.detailTitle2} ${di+1}`);
    return `<div class="ds-day">
      <div class="ds-day-label">${esc(dayLabel)}${totHTML}</div>
      ${rowsHTML}
      ${notesHTML}
    </div>`;
  }).join('');

  // Optional recipe pages — only include components where includeInExport === true
  let recipesHTML = '';
  if(includeRecipes){
    const allIds = [];
    detailState.days.slice(0, detailState.numDays).forEach(day=>{
      day.rows.forEach(row=>{
        row.components.forEach(comp=>{
          if(comp.id && comp.includeInExport === true && !allIds.includes(comp.id)) allIds.push(comp.id);
        });
      });
    });
    if(allIds.length){
      recipesHTML = `<div class="ds-recipes-start"></div>`;
      recipesHTML += allIds.map(id=>{
        const m = byId(id); if(!m) return '';
        const d = c(m);
        const rPhoto = m.img
          ? `<div class="ds-recipe-photo"><img src="${imgSrc(m)}" alt="" onerror="this.parentElement.style.display='none'"></div>`
          : `<div class="ds-recipe-photo" data-type="${m.type}"><span class="ph-emoji">${m.emoji}</span></div>`;
        const macroLine = m.macros ? `<div class="ws-r-macros">
          <span>${L.protein}: <b>${m.macros.protein.g}${L.grams}</b></span>
          <span>${L.fat}: <b>${m.macros.fat.g}${L.grams}</b></span>
          <span>${L.carbs}: <b>${m.macros.netCarbs.g}${L.grams}</b></span>
          <span>${L.calories}: <b>${Math.round(macroCalories(m))}</b></span>
        </div>` : '';
        return `<div class="ds-recipe">
          <div class="ds-recipe-top">
            ${rPhoto}
            <div>
              <h4>${esc(d.name)}</h4>
              <div class="ds-recipe-meta">${L.type[m.type]} · ${esc(d.time)} · ${esc(d.servings)}${L.servingsUnit}</div>
            </div>
          </div>
          <div class="ds-recipe-cols">
            <div><div class="sec-t">${L.ingredients}</div><ul class="ing">${d.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
            <div><div class="sec-t">${L.method}</div><ol class="steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
          </div>
          ${macroLine}
        </div>`;
      }).join('');
    }
  }

  // Footer
  const footHTML = `<div class="ds-foot">${L.practiceName} · ${L.credential}</div>`;

  // Header
  const headHTML = `
    <div class="ds-head">
      ${brandLogoHTMLSmall('ds-logo')}
      <div class="ds-brand-text">
        <div class="pn">${L.practiceName}</div>
        <div class="cr">${L.credential}</div>
      </div>
      <div style="flex:1;text-align:right">
        <div class="ds-title">${L.detailTitle2}</div>
        <div class="ds-sub">${L.detailSubtitle(esc(name))}</div>
      </div>
    </div>
  `;

  const sheetContent = headHTML + daysHTML + recipesHTML + footHTML;

  // Open a dedicated print window — portrait, one page per day
  const w = window.open('', '_blank');
  if(!w){ toast(L.tPopup); return; }
  const css = document.querySelector('style').textContent;
  w.document.write(`<!DOCTYPE html><html lang="${document.documentElement.lang}"><head><meta charset="UTF-8"><base href="${location.href}">
    <title>${L.detailTitle2}</title>

    <style>${css}

    #detailSheet .ds-row{margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}

/* ---------- 事件绑定 ---------- */
function bindLibrary(){
  $$('#libGrid [data-add]').forEach(b=>b.onclick=()=>addToDay(b.dataset.add, state.addDay));
  $$('#libGrid [data-rec]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.rec));
  $$('#planBody [data-rec]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.rec));
  $$('#libGrid .meal').forEach(card=>{
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.querySelector('[data-add]').dataset.add);
    });
  });
}

function bindGlobal(){
  $('#carbSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.carb = b.dataset.carb; save(); renderAll();
  });
  const toggle = (evt, attr, key) => {
    const b = evt.target.closest('['+attr+']'); if(!b) return;
    const v = b.getAttribute(attr);
    state[key] = state[key].includes(v) ? state[key].filter(x=>x!==v) : [...state[key], v];
    save(); renderAll();
  };
  $('#focusChips').addEventListener('click', e=>toggle(e,'data-focus','focus'));
  $('#dietChips').addEventListener('click',  e=>toggle(e,'data-diet','diet'));
  $('#avoidChips').addEventListener('click', e=>toggle(e,'data-avoid','avoid'));

  $('#typeTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.type = b.dataset.type; save(); renderAll();
  });
  $('#foodCatRow').addEventListener('click', e=>{
    const b = e.target.closest('[data-foodcat]'); if(!b) return;
    const cat = b.dataset.foodcat;
    state.foodCat = (state.foodCat === cat) ? '' : cat;
    save(); renderAll();
  });
  $('#daySeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.addDay = +b.dataset.day; save(); renderAll();
  });

  /* Recipe keyword search — filters within the active tab */
  const refreshSearch = ()=>{
    renderFoodCats(); renderTabs(); renderLibrary(); bindLibrary();
    $('#matchN').textContent = filtered().length + ' / ' + ALL_MEALS.length;
    buildHandout();
  };
  $('#mainSearch').addEventListener('input', e=>{
    state.search = e.target.value; save(); refreshSearch();
  });
  $('#searchClear').addEventListener('click', ()=>{
    state.search=''; $('#mainSearch').value=''; save(); refreshSearch();
    $('#mainSearch').focus();
  });
  // Reset all filters button
  var rfb = $('#resetFiltersBtn');
  if(rfb) rfb.addEventListener('click', function(){ resetAllFilters(); });

  $('#btnAuto').onclick = ()=>autoFill(state.addDay);
  $('#btnLib').onclick = ()=>openLibModal();
  $('#btnWeek').onclick = ()=>openWeekModal();
  $('#btnDetail').onclick = ()=>openDetailModal();

  $('#clientName').addEventListener('input', e=>{ state.clientName=e.target.value; save(); buildHandout(); });
  $('#clientNote').addEventListener('input', e=>{ state.clientNote=e.target.value; save(); buildHandout(); });
  $('#optRecipes').addEventListener('change', e=>{ state.includeRecipes=e.target.checked; save(); buildHandout(); });
  $('#optMacros').addEventListener('change', e=>{ state.showMacros=e.target.checked; save(); buildHandout(); });

  $('#btnLang').onclick = ()=>{
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    save(); renderAll();
    toast(t().tLang);
  };

  $('#btnDemo').onclick = ()=>{ applyDemo(); save(); renderAll(); toast(t().tDemo); };
  $('#btnPdf').onclick = exportPDF;
  $('#btnPreview').onclick = ()=>{
    const L = t();
    if(!state.day1.length && !state.day2.length && !state.day3.length){ toast(L.tNeedMeal); return; }
    buildHandout();
    const w = window.open('', '_blank');
    if(!w){ toast(L.tPopup); return; }
    const css = document.querySelector('style').textContent;
    w.document.write(`<!DOCTYPE html><html lang="${document.documentElement.lang}"><head><meta charset="UTF-8"><title>${L.previewTitle}</title>
      <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>${css}
      body{background:#f6f5f1;padding:0}
      #handout{display:block !important;background:#fff;max-width:820px;margin:22px auto;padding:34px 38px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
    </style></head><body><div id="handout">${$('#handout').innerHTML}</div></body></html>`);
    w.document.close();
  };
  $('#btnReset').onclick = ()=>{
    state.day1=[]; state.day2=[]; state.day3=[]; save(); renderAll(); toast(t().tCleared);
  };

  $$('#modal [data-close]').forEach(b=>b.onclick=closeModal);
  $$('#libModal [data-lib-close]').forEach(b=>b.onclick=closeLibModal);
  $$('#weekModal [data-week-close]').forEach(b=>b.onclick=closeWeekModal);
  $$('#detailModal [data-detail-close]').forEach(b=>b.onclick=closeDetailModal);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeLibModal(); closeWeekModal(); closeDetailModal(); } });
}

/* ---------- 启动 ---------- */
load();
loadWeek();
loadDetail();
const qs = new URLSearchParams(location.search);
if(qs.has('lang')){
  const q = qs.get('lang');
  if(q === 'zh' || q === 'en') state.lang = q;
}
if(qs.has('demo')) applyDemo();

/* Migrate images from localStorage to IndexedDB, then load all IDB images, then render.
   This frees localStorage (5MB limit) by moving image data to IndexedDB (50MB+). */
if(typeof indexedDB !== 'undefined'){
  migrateImagesToIDB().then(function(count){
    idbLoadAll().then(function(){
      if(count > 0) toast('Migrated ' + count + ' images to IndexedDB — storage freed');
      renderAll();
      bindGlobal();
    });
  }).catch(function(){
    renderAll();
    bindGlobal();
    setTimeout(function(){
      compressStoredImages(function(c, saved, ok){
        if(c > 0 && saved > 0){ if(ok){ renderAll(); } else { stripAllDataImages(); renderAll(); } }
      });
    }, 1500);
  });
} else {
  renderAll();
  bindGlobal();
  setTimeout(function(){
    compressStoredImages(function(c, saved, ok){
      if(c > 0 && saved > 0){ if(ok){ renderAll(); } else { stripAllDataImages(); renderAll(); } }
    });
  }, 1500);
}
// Diagnostic: log recipe counts and filter state on startup
console.log('[Meal Idea Generator] BASE_MEALS:', BASE_MEALS.length, '| ALL_MEALS:', ALL_MEALS.length, '| Filtered:', filtered().length, '| Filters:', JSON.stringify({carb:state.carb, focus:state.focus, diet:state.diet, avoid:state.avoid, type:state.type, foodCat:state.foodCat, search:state.search}));
</script>
