<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Idea Generator · 餐食灵感生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 基础与主题 ===================== */
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1f2421; --muted:#6b7570; --line:#e5e3dc;
  --accent:#3f7d58; --accent-soft:#eaf1ec; --accent-ink:#2c5a3f;
  --danger:#b4544a;
  /* Brenda Le Wellness brand colors */
  --brand-dark:#495a58;
  --brand-coral:#d4967d;
  --brand-cream:#dcd9d0;
  --brand-soft:#f2efe9;
  --r:12px; --sh:0 1px 2px rgba(31,36,33,.05), 0 6px 18px rgba(31,36,33,.06);
  --font-heading:'Lora',Georgia,'Times New Roman',serif;
  --font-body:'Source Sans Pro','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}

/* ===================== 顶栏 ===================== */
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.88);
  backdrop-filter:saturate(1.6) blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:11px 20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px}
.brand b{font-size:16px; letter-spacing:-.2px}
.brand span{font-size:11.5px; color:var(--muted); letter-spacing:.3px}
.topbar .grow{flex:1}
.client-in{
  display:flex; align-items:center; gap:7px; background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:6px 11px;
}
.client-in label{font-size:12px; color:var(--muted); white-space:nowrap}
.client-in input{border:none; background:transparent; outline:none; width:130px; font-weight:500}
.btn{
  border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 14px;
  font-size:13px; font-weight:500; transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:#cfcdc4; background:#fbfaf8}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#376f4d}
.btn.brand-btn{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff}
.btn.brand-btn:hover{background:#3e4d4b}
.btn.coral-btn{background:var(--brand-coral); border-color:var(--brand-coral); color:#fff}
.btn.coral-btn:hover{background:#c98770}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--bg); color:var(--ink)}
.btn.lang{display:inline-flex; align-items:center; gap:6px; font-weight:600; padding:7px 13px}
.btn.lang .globe{font-size:14px; line-height:1}

/* ===================== 三栏布局 ===================== */
.app{
  display:grid; grid-template-columns:266px minmax(0,1fr) 330px;
  gap:18px; padding:18px 20px 60px; align-items:start;
  max-width:1560px; margin:0 auto;
}
@media (max-width:1240px){ .app{grid-template-columns:240px minmax(0,1fr)} .col-plan{grid-column:1/-1} }
@media (max-width:880px){ .app{grid-template-columns:1fr} }
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.col-side{position:sticky; top:66px}
.col-plan{position:sticky; top:66px; max-height:calc(100vh - 80px); overflow-y:auto}
@media (max-width:1240px){ .col-plan{position:static; max-height:none} }
@media (max-width:880px){ .col-side{position:static} }

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.card-pad{padding:15px 16px}
.card-h{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.card-h h3{font-size:13px; letter-spacing:.2px}
.card-h .hint{font-size:11.5px; color:var(--muted); font-weight:400}

/* ===================== 筛选器 ===================== */
.fgroup{padding:14px 16px; border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:none}
.ftitle{
  font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
  font-weight:600; margin-bottom:9px; display:flex; align-items:center; gap:6px;
}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:5px 11px; font-size:12.5px; color:#3d453f; transition:.13s; user-select:none;
  display:inline-flex; align-items:center; gap:5px;
}
.chip:hover{border-color:#c9c7bd}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.chip.on.warn{background:var(--danger); border-color:var(--danger)}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{flex:1; padding:7px 6px; font-size:12.5px; background:#fff; color:#4a544e; transition:.13s}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent); color:#fff}

.matchbar{
  padding:12px 16px; background:var(--accent-soft); display:flex; align-items:center;
  justify-content:space-between; gap:8px; font-size:12.5px; color:var(--accent-ink);
}
.matchbar b{font-size:17px; font-weight:700}

/* ===================== 菜品库 ===================== */
.lib-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tabs{display:flex; gap:4px; background:var(--bg); border-radius:9px; padding:3px}
.tabs button{
  padding:6px 13px; border-radius:7px; font-size:12.5px; color:var(--muted); font-weight:500; transition:.13s;
}
.tabs button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button .n{font-size:11px; opacity:.6; margin-left:4px}

.daypick{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); margin-left:auto}
.daypick .seg button{padding:5px 12px; font-size:12.5px}

.lib-searchbar{
  position:relative; display:flex; align-items:center; margin:0 16px; padding-top:4px;
}
.main-search{
  flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 30px 8px 32px;
  font-size:13px; outline:none; transition:.13s; background:var(--bg);
}
.main-search:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-soft)}
.lib-searchbar .search-ic{position:absolute; left:10px; font-size:13px; opacity:.5; pointer-events:none}
.search-clear{
  position:absolute; right:6px; border:none; background:transparent; cursor:pointer;
  font-size:13px; color:var(--muted); padding:4px 6px; border-radius:6px; line-height:1;
}
.search-clear:hover{background:var(--bg); color:var(--ink)}

.foodcat-row{
  display:flex; flex-wrap:wrap; gap:6px; margin:8px 16px 4px; align-items:center;
}
.foodcat-row .fcat-all{font-size:11px; color:var(--muted); margin-right:2px; white-space:nowrap}
.foodcat-chip{
  font-size:11px; padding:3px 10px; border-radius:14px; border:1px solid var(--line);
  background:var(--bg); color:var(--muted); cursor:pointer; transition:.12s; white-space:nowrap;
}
.foodcat-chip:hover{border-color:var(--accent); color:var(--accent)}
.foodcat-chip.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.foodcat-chip .n{font-size:10px; opacity:.7; margin-left:3px}

.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
  gap:14px; padding:16px;
}
@media (max-width:880px){ .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px; padding:13px} }

.meal{
  border:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff;
  display:flex; flex-direction:column; transition:.16s; position:relative;
}
.meal:hover{border-color:#cfcdc4; transform:translateY(-2px); box-shadow:0 8px 20px rgba(31,36,33,.09)}
.meal.custom::after{
  content:'✎'; position:absolute; top:6px; right:6px; z-index:3; font-size:10px;
  background:var(--brand-coral); color:#fff; border-radius:50%; width:16px; height:16px;
  display:grid; place-items:center; pointer-events:none;
}
.photo{position:relative; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.ph-emoji{font-size:42px; line-height:1; font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.photo .ph-emoji,.h-photo .ph-emoji,.rec-hero .ph-emoji,.lib-thumb .ph-emoji,.week-thumb .ph-emoji{
  width:70px; height:70px; border-radius:50%; display:grid; place-items:center; font-size:34px;
  background:rgba(255,255,255,.66); box-shadow:0 2px 10px rgba(31,36,33,.07);
}
.mini .thumb .ph-emoji{font-size:18px; width:30px; height:30px}
.photo[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.photo[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.photo[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.photo[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.typebadge{
  position:absolute; top:8px; left:8px; z-index:2; font-size:10.5px; font-weight:600;
  letter-spacing:.4px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.92);
  color:#3d453f; backdrop-filter:blur(4px);
}
.carbbadge{
  position:absolute; top:8px; right:8px; z-index:2; font-size:10.5px; font-weight:600;
  padding:3px 8px; border-radius:6px; background:rgba(31,36,33,.72); color:#fff;
}
.meal-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1}
.meal-name{font-size:13.5px; font-weight:600; line-height:1.3}
.meal-alt{font-size:11.5px; color:var(--muted); margin-top:1px}
.meal-meta{font-size:11.5px; color:var(--muted); display:flex; gap:9px; flex-wrap:wrap}
.macro-mini{font-size:10px; color:var(--brand-dark); display:flex; gap:6px; flex-wrap:nowrap; white-space:nowrap; overflow:hidden}
.macro-mini span{background:var(--brand-soft); padding:1px 5px; border-radius:4px; white-space:nowrap; flex-shrink:0}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--bg); color:#5a645e; border:1px solid var(--line)}
.tag.gut{background:#eaf5ee; border-color:#d3e8da; color:#2f6b48}
.tag.asian{background:#fdf0ea; border-color:#f6dccf; color:#a4502c}
.meal-actions{display:flex; gap:6px; margin-top:auto}
.meal-info{cursor:pointer; display:flex; flex-direction:column; gap:8px}
.photo.clickable{cursor:pointer}
.photo.clickable:hover img{transform:scale(1.04)}
.photo.clickable img{transition:transform .25s ease}
.meal-info:hover .meal-name{color:var(--accent)}
.addbtn{
  flex:1; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  border-radius:8px; padding:6px; font-size:12px; font-weight:600; transition:.13s;
}
.addbtn:hover{background:var(--accent); color:#fff}
.recbtn{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px;
  font-size:12px; color:var(--muted); transition:.13s;
}
.recbtn:hover{border-color:#cfcdc4; color:var(--ink)}
.empty{
  padding:46px 24px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7;
}
.empty .big{font-size:30px; display:block; margin-bottom:10px; opacity:.5}

/* ===================== 计划栏 ===================== */
.day{padding:13px 14px; border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.day-h{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.day-h h4{font-size:13px}
.day-h .day-title-edit{
  font-size:13px; font-weight:600; border:1px solid transparent; border-radius:5px;
  padding:2px 6px; background:transparent; outline:none; min-width:60px; flex:1;
}
.day-h .day-title-edit:hover{border-color:var(--line); background:var(--bg)}
.day-h .day-title-edit:focus{border-color:var(--brand-coral); background:#fff}
.day-h .cnt{font-size:11px; color:var(--muted); background:var(--bg); padding:2px 7px; border-radius:5px; white-space:nowrap}
.day-h .sp{flex:1}
.mini{
  border:1px solid var(--line); border-radius:9px; padding:6px 7px; display:flex;
  align-items:center; gap:9px; margin-bottom:7px; background:#fff; transition:.13s;
}
.mini:hover{border-color:#cfcdc4}
.mini .thumb{
  width:38px; height:38px; border-radius:7px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:18px;
}
.mini .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.mini .thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.mini .thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.mini .thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.mini .thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.mini .t{flex:1; min-width:0}
.mini .t b{display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mini .t span{font-size:10.5px; color:var(--muted)}
.mini .x{color:#b8bdb9; font-size:15px; padding:3px 5px; border-radius:6px; line-height:1}
.mini .x:hover{background:#f6ecea; color:var(--danger)}
.dropzone{
  border:1.5px dashed var(--line); border-radius:9px; padding:16px 10px; text-align:center;
  color:#a8aeaa; font-size:11.5px; line-height:1.6;
}
.dropzone.over{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.notefield{width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; resize:vertical; min-height:64px; outline:none; font-size:12.5px}
.notefield:focus{border-color:#bcc9c1}
.optrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#4a544e; cursor:pointer; padding:3px 0}
.optrow input{accent-color:var(--accent); width:15px; height:15px}

/* ===================== 食谱弹窗 ===================== */
#modal,#libModal,#weekModal,#detailModal{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:22px}
#modal.open,#libModal.open,#weekModal.open,#detailModal.open{display:flex}
#modal .veil,#libModal .veil,#weekModal .veil,#detailModal .veil{position:absolute; inset:0; background:rgba(25,30,27,.5); backdrop-filter:blur(3px)}
#modal .sheet,#libModal .sheet,#weekModal .sheet,#detailModal .sheet{
  position:relative; background:#fff; border-radius:16px; max-width:760px; width:100%;
  max-height:90vh; overflow:auto; box-shadow:0 30px 70px rgba(0,0,0,.3);
}
#libModal .sheet{max-width:900px}
#weekModal .sheet{max-width:1400px; max-height:94vh}
#detailModal .sheet{max-width:1200px; max-height:96vh; display:flex; flex-direction:column; overflow:hidden}
.rec-hero{position:relative; aspect-ratio:16/7; overflow:hidden; display:grid; place-items:center}
.rec-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.rec-hero .ph-emoji{width:116px; height:116px; font-size:56px}
.rec-hero[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.rec-hero[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.rec-hero[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.rec-hero[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.rec-close,.modal-close{position:absolute; top:12px; right:12px; z-index:3; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; font-size:17px; color:#3d453f}
.rec-close:hover,.modal-close:hover{background:#fff}
.rec-body{padding:20px 24px 26px}
.rec-body h2{font-size:21px; letter-spacing:-.3px; font-family:var(--font-heading)}
.rec-body .alt{color:var(--muted); font-size:13px; margin-top:3px}
.rec-meta{display:flex; gap:14px; flex-wrap:wrap; margin:13px 0; font-size:12.5px; color:var(--muted)}
.rec-meta b{color:var(--ink); font-weight:600}
.why{background:var(--accent-soft); border-left:3px solid var(--accent); padding:10px 13px; border-radius:0 9px 9px 0; font-size:13px; color:var(--accent-ink); margin:13px 0}
.two{display:grid; grid-template-columns:1fr 1.35fr; gap:26px; margin-top:16px}
@media (max-width:640px){ .two{grid-template-columns:1fr} }
.sec-t{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:700; margin-bottom:9px}
.ing{list-style:none; padding:0; margin:0; font-size:13px}
.ing li{padding:6px 0 6px 18px; border-bottom:1px dashed var(--line); position:relative}
.ing li:before{content:""; position:absolute; left:2px; top:13px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.steps{list-style:none; padding:0; margin:0; counter-reset:s; font-size:13px}
.steps li{counter-increment:s; padding:0 0 12px 30px; position:relative}
.steps li:before{
  content:counter(s); position:absolute; left:0; top:0; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center;
}
.notes{margin-top:16px; background:var(--bg); border-radius:9px; padding:11px 13px; font-size:12.5px; color:#4a544e}
.notes b{color:var(--ink)}

/* macro section in recipe modal */
.macro-section{margin-top:16px; background:var(--brand-soft); border-radius:9px; padding:14px 16px}
.macro-section .sec-t{color:var(--brand-dark)}
.macro-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.macro-cell{text-align:center}
.macro-cell .g{font-size:22px; font-weight:700; color:var(--brand-dark); font-family:var(--font-heading)}
.macro-cell .g span{font-size:13px; font-weight:400; color:var(--muted)}
.macro-cell .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px}
.macro-cell .pct{font-size:11px; color:var(--brand-coral); margin-top:2px}
.macro-bar{height:5px; border-radius:3px; background:var(--brand-cream); margin-top:6px; overflow:hidden}
.macro-bar .fill{height:100%; border-radius:3px}

/* ===================== Recipe Library Editor ===================== */
.lib-modal-body{padding:0}
.lib-toolbar{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.lib-toolbar h2{font-size:17px; font-family:var(--font-heading)}
.lib-search{flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:13px; outline:none}
.lib-search:focus{border-color:var(--brand-coral)}
.lib-storage{display:flex; align-items:center; gap:8px; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--bg)}
.lib-storage .storage-bar{height:6px; border-radius:3px; min-width:40px; transition:width .3s}
.lib-storage .storage-text{font-size:11px; color:var(--muted); white-space:nowrap}
.lib-list{padding:14px 18px; display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto}
.lib-item{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; transition:.13s; background:#fff;
}
.lib-item:hover{border-color:#cfcdc4; box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lib-thumb{
  width:50px; height:50px; border-radius:8px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:22px;
}
.lib-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.lib-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.lib-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.lib-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.lib-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.lib-item .info{flex:1; min-width:0}
.lib-item .info b{font-size:13px; font-weight:600; display:block}
.lib-item .info span{font-size:11px; color:var(--muted)}
.lib-item .acts{display:flex; gap:5px}
.lib-item .acts button{padding:5px 9px; font-size:11px; border-radius:6px; border:1px solid var(--line); background:#fff; transition:.13s}
.lib-item .acts button:hover{border-color:#cfcdc4}
.lib-item .acts .del:hover{background:#f6ecea; border-color:var(--danger); color:var(--danger)}
.lib-item .acts .arc:hover{background:#f5f0eb; border-color:var(--accent); color:var(--accent)}
.lib-item .acts .rst:hover{background:#eef5f0; border-color:var(--primary); color:var(--primary)}
.lib-view-toggle{display:flex; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-shrink:0}
.lib-view-toggle button{padding:5px 14px; font-size:12px; font-weight:600; border:none; background:#fff; color:var(--muted); cursor:pointer; transition:.13s; font-family:var(--font-body)}
.lib-view-toggle button:hover{background:var(--bg)}
.lib-view-toggle button.on{background:var(--primary); color:#fff}
.lib-archive-empty{text-align:center; padding:40px 20px; color:var(--muted); font-size:14px}
/* Bulk select */
.lib-select-bar{display:flex; align-items:center; gap:8px; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--bg); flex-wrap:wrap}
.lib-select-bar .sel-count{font-size:12px; font-weight:600; color:var(--primary); white-space:nowrap}
.lib-select-bar .sel-actions{display:flex; gap:6px; flex-wrap:wrap}
.lib-select-bar .sel-actions button{padding:4px 12px; font-size:11px; font-weight:600; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; transition:.13s; font-family:var(--font-body)}
.lib-select-bar .sel-actions button:hover{border-color:#cfcdc4}
.lib-select-bar .sel-actions .bulk-arc:hover{background:#f5f0eb; border-color:var(--accent); color:var(--accent)}
.lib-select-bar .sel-actions .bulk-rst:hover{background:#eef5f0; border-color:var(--primary); color:var(--primary)}
.lib-select-bar .sel-actions .bulk-del:hover{background:#f6ecea; border-color:var(--danger); color:var(--danger)}
.lib-select-bar .sel-actions .bulk-toggle{border-color:var(--primary); color:var(--primary)}
.lib-item .lib-check{width:18px; height:18px; flex-shrink:0; cursor:pointer; accent-color:var(--primary)}
.lib-item.selected{background:#f5f0eb; border-color:var(--accent)}

/* recipe editor form */
.rec-editor{padding:18px 22px 26px}
.rec-editor h2{font-size:18px; font-family:var(--font-heading); margin-bottom:14px}
.form-row{margin-bottom:13px}
.form-row label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; outline:none;
}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--brand-coral)}
.form-row textarea{resize:vertical; min-height:50px; font-family:inherit}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
@media (max-width:560px){ .form-grid2,.form-grid3{grid-template-columns:1fr} }
.tag-edit{display:flex; flex-wrap:wrap; gap:6px}
.tag-edit .chip{font-size:11px; padding:3px 8px; cursor:pointer}
.img-upload-area{
  display:flex; align-items:center; gap:12px;
}
.img-preview{
  width:80px; height:80px; border-radius:10px; border:1px solid var(--line); overflow:hidden;
  display:grid; place-items:center; position:relative; flex:none; font-size:30px;
}
.img-preview img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.img-upload-area .file-btn{
  border:1px dashed var(--line); border-radius:8px; padding:8px 14px; font-size:12px; color:var(--muted);
  cursor:pointer; transition:.13s;
}
.img-upload-area .file-btn:hover{border-color:var(--brand-coral); color:var(--brand-dark)}
.macro-inputs{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media (max-width:760px){ .macro-inputs{grid-template-columns:repeat(2,1fr)} }
@media (max-width:480px){ .macro-inputs{grid-template-columns:1fr} }
.macro-input-group{border:1px solid var(--line); border-radius:8px; padding:10px}
.macro-input-group label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block}
.macro-input-group .fields{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.macro-input-group .field{display:flex; align-items:center; gap:4px}
.macro-input-group .field span{font-size:10px; color:var(--muted); white-space:nowrap}
.macro-input-group .field input{width:100%; padding:4px 6px; font-size:12px; border:1px solid var(--line); border-radius:5px}
.macro-pct-display{font-size:12px; font-weight:600; color:var(--brand-coral); padding:4px 0}
.micro-inputs{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media (max-width:640px){ .micro-inputs{grid-template-columns:repeat(2,1fr)} }
@media (max-width:420px){ .micro-inputs{grid-template-columns:1fr} }
.micro-input-group{border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--bg)}
.micro-input-group label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block}
.micro-input-group .field input{width:100%; padding:4px 6px; font-size:12px; border:1px solid var(--line); border-radius:5px}

/* ===================== 7-Day Plan Generator ===================== */
.week-modal-body{padding:0}
.week-config{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end}
.week-config h2{font-size:19px; font-family:var(--font-heading); width:100%; margin-bottom:4px}
.week-config .cfg{display:flex; flex-direction:column; gap:5px}
.week-config .cfg label{font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600}
.week-config .cfg select,.week-config .cfg input{border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; outline:none}
.week-config .meal-types{display:flex; gap:8px; flex-wrap:wrap}
.week-config .meal-types label{font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer}
.week-config .meal-types input{accent-color:var(--brand-dark); width:15px; height:15px}
.week-grid-wrap{padding:14px 20px; overflow-x:auto}
.week-grid{display:grid; gap:6px; min-width:920px}
.week-grid .wg-row{display:grid; grid-template-columns:110px repeat(7,1fr); gap:6px}
.week-grid .wg-head{
  font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;
  text-align:center; padding:5px;
}
.week-grid .wg-day-head{
  font-size:13px; font-weight:700; color:var(--brand-coral); text-align:center; padding:5px;
  border-bottom:2px solid var(--brand-coral);
}
.week-grid .wg-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--brand-dark); font-weight:700;
  display:flex; align-items:center; padding:5px 8px;
}
.week-cell{
  border:1px solid var(--line); border-radius:9px; padding:6px; min-height:120px; background:#fff;
  display:flex; flex-direction:column; gap:4px; transition:.13s; cursor:pointer; position:relative;
}
.week-cell:hover{border-color:var(--brand-coral); box-shadow:0 2px 8px rgba(212,150,125,.18)}
.week-cell.over{border-color:var(--brand-coral); background:var(--brand-soft)}
.week-cell.empty-cell{background:var(--bg); display:grid; place-items:center; color:#c0c5c0; font-size:18px; min-height:120px}
.week-cell .wc-meal{display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:1.3; height:100%}
.week-cell .wc-meal .week-thumb{
  width:100%; aspect-ratio:4/3; border-radius:7px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:28px;
}
.week-cell .wc-meal .week-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.week-cell .wc-meal .week-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.week-cell .wc-meal .week-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.week-cell .wc-meal .week-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.week-cell .wc-meal .week-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.week-cell .wc-meal b.wc-name{font-size:12px; font-weight:600; line-height:1.3; min-width:0; color:var(--ink); word-break:break-word}
.week-cell .wc-meal b.wc-name .wl{display:block}
.week-cell .wc-meal .wc-x{position:absolute; top:4px; right:4px; color:#fff; background:rgba(0,0,0,.35); border-radius:50%; width:20px; height:20px; display:grid; place-items:center; font-size:12px; flex:none; z-index:2}
.week-cell .wc-meal .wc-x:hover{color:#fff; background:rgba(0,0,0,.55)}
.week-actions{padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

/* Saved plan dialogs */
.wk-save-bar{display:flex; gap:8px; align-items:center; padding:12px 24px; border-top:1px solid var(--line); background:var(--bg); flex-wrap:wrap}
.wk-save-bar input{flex:1; min-width:200px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; color:var(--ink); background:#fff}
.wk-save-bar input:focus{outline:none; border-color:var(--brand-coral)}
.wk-plans-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px}
.wk-plans-modal{background:#fff; border-radius:14px; max-width:560px; width:100%; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,.2)}
.wk-plans-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line)}
.wk-plans-head h3{margin:0; font-size:18px; color:var(--brand-dark); font-family:var(--font-heading)}
.wk-plans-body{overflow-y:auto; padding:12px 22px; flex:1}
.wk-plan-item{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; transition:.13s}
.wk-plan-item:hover{border-color:var(--brand-coral); background:var(--brand-soft)}
.wk-plan-info{flex:1; min-width:0}
.wk-plan-name{font-weight:600; font-size:14px; color:var(--ink); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wk-plan-date{font-size:11px; color:var(--muted)}
.wk-plan-actions{display:flex; gap:6px; flex:none}
.wk-plan-actions .btn-sm{padding:5px 12px; font-size:12px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; transition:.13s}
.wk-plan-actions .btn-sm:hover{border-color:var(--brand-coral)}
.wk-plan-actions .btn-sm.danger:hover{background:#fee; border-color:#e88; color:#c44}
.wk-plan-actions .btn-sm.primary{background:var(--brand-coral); color:#fff; border-color:var(--brand-coral)}
.wk-plans-empty{text-align:center; padding:40px 20px; color:var(--muted); font-size:14px}
.week-day-totals{padding:0 24px 12px; font-size:11px; color:var(--muted)}
.week-day-totals .wdt-row{display:grid; grid-template-columns:110px repeat(7,1fr); gap:6px; margin-top:4px}
.week-day-totals .wdt-cell{text-align:center; padding:4px; font-size:12px}
.week-day-totals .wdt-label{font-weight:700; color:var(--brand-dark); font-size:12px}
.week-day-totals .wdt-thead .wdt-thcell{font-weight:700; color:var(--brand-coral); font-size:11px; border-bottom:2px solid var(--brand-cream); padding-bottom:4px; margin-bottom:2px}

/* Week meal picker grid */
.dt-pick-tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px}
.dt-pick-tab{padding:5px 12px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); cursor:pointer; transition:.13s; font-family:var(--font-body); display:flex; align-items:center; gap:5px}
.dt-pick-tab:hover{background:var(--bg)}
.dt-pick-tab.on{background:var(--brand-dark); color:#fff; border-color:var(--brand-dark)}
.dt-pick-tab .n{font-size:11px; opacity:.6; font-weight:400}
.dt-pick-diet-row{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; padding-top:8px; border-top:1px dashed var(--line)}
.dt-pick-diet{padding:4px 10px; font-size:12px; font-weight:500; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--muted); cursor:pointer; transition:.13s; font-family:var(--font-body)}
.dt-pick-diet:hover{background:var(--accent-soft)}
.dt-pick-diet.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.dt-rec-wrap{overflow-y:auto; padding:20px 24px; flex:1; min-height:0}
.dt-rec-back{margin-bottom:14px; font-size:13px; font-weight:600; cursor:pointer}
.dt-rec-card{max-width:680px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden}
.dt-rec-hero{position:relative; aspect-ratio:16/9; overflow:hidden; display:grid; place-items:center; cursor:pointer}
.dt-rec-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.dt-rec-hero .ph-emoji{font-size:56px}
.dt-rec-hero[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.dt-rec-hero[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.dt-rec-hero[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.dt-rec-hero[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.dt-rec-body{padding:16px 20px 20px}
.dt-rec-body h2{font-size:22px; font-family:var(--font-heading); color:var(--brand-dark); margin:0 0 2px; line-height:1.2}
.dt-rec-alt{font-size:14px; color:var(--muted); margin-bottom:8px}
.dt-rec-meta{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-bottom:8px; flex-wrap:wrap}
.dt-rec-meta b{color:var(--brand-dark); font-weight:600}
.dt-rec-tags{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px}
.dt-rec-why{font-size:14px; color:var(--ink); line-height:1.5; margin-bottom:12px; padding:10px 14px; background:var(--brand-soft); border-radius:8px}
.dt-rec-two{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:14px}
@media(max-width:600px){.dt-rec-two{grid-template-columns:1fr}}
.dt-rec-two .sec-t{font-size:12px; margin-bottom:5px}
.dt-rec-two .ing{font-size:13px; line-height:1.5}
.dt-rec-two .ing li{padding:3px 0 3px 18px}
.dt-rec-two .ing li:before{top:9px; width:5px; height:5px}
.dt-rec-two .steps{font-size:13px; line-height:1.5}
.dt-rec-two .steps li{padding:0 0 6px 28px}
.dt-rec-two .steps li:before{width:20px; height:20px; font-size:11px}
.dt-rec-macros{margin-bottom:14px}
.dt-rec-macros .sec-t{font-size:12px; margin-bottom:5px}
.dt-rec-micros{margin-bottom:14px}
.dt-rec-micros .sec-t{font-size:12px; margin-bottom:5px}
.dt-rec-micro-list{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.dt-rec-micro b{color:var(--brand-dark); font-weight:600}
.dt-rec-notes{font-size:13px; line-height:1.5; color:var(--ink); padding:10px 14px; background:#f7f6f3; border-radius:8px}
.dt-rec-notes b{color:var(--brand-dark); margin-right:6px}
.wk-pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; max-height:55vh; overflow-y:auto; padding:4px}
.wk-pick-card{cursor:pointer; border:1px solid var(--line); border-radius:9px; overflow:hidden; transition:.13s; background:#fff}
.wk-pick-card:hover{border-color:var(--brand-coral); box-shadow:0 2px 10px rgba(212,150,125,.2); transform:translateY(-1px)}
.wk-pick-thumb{position:relative; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center}
.wk-pick-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.wk-pick-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.wk-pick-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.wk-pick-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.wk-pick-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.wk-pick-name{font-size:12px; font-weight:600; padding:6px 8px 2px; line-height:1.3; color:var(--ink); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.wk-pick-meta{font-size:10px; color:var(--muted); padding:0 8px 8px}

.wk-pick-searchbar{position:relative; display:flex; align-items:center; margin-bottom:10px}
.wk-pick-searchbar .search-ic{position:absolute; left:8px; font-size:13px; opacity:.5; pointer-events:none}
.wk-pick-search{flex:1; border:1px solid var(--line); border-radius:8px; padding:6px 30px 6px 28px; font-size:12px; outline:none; transition:.13s; background:var(--bg)}
.wk-pick-search:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-soft)}
.wk-pick-count{position:absolute; right:10px; font-size:11px; color:var(--muted); background:var(--bg); padding:1px 6px; border-radius:8px}

/* Split view: two meals in one cell */
.week-cell .wc-split{display:flex; gap:3px; height:100%}
.week-cell .wc-split .wc-meal{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; font-size:11px; line-height:1.25; position:relative}
.week-cell .wc-split .wc-meal .week-thumb{width:100%; aspect-ratio:4/3; border-radius:5px; flex:none; overflow:hidden; position:relative; display:grid; place-items:center; font-size:22px}
.week-cell .wc-split .wc-meal .week-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.week-cell .wc-split .wc-meal b.wc-name{font-size:10.5px; font-weight:600; line-height:1.2; min-width:0; color:var(--ink); word-break:break-word}
/* Serving size input */
.wc-serv-row{display:flex; align-items:center; gap:3px; font-size:10px; color:var(--muted); margin-top:2px}
.wc-serv-row label{white-space:nowrap}
.wc-serv-input{width:34px; border:1px solid var(--line); border-radius:4px; padding:1px 3px; font-size:10px; text-align:center; background:#fff; color:var(--ink)}
.wc-serv-input:focus{outline:none; border-color:var(--brand-coral)}
.wc-name-sm{font-size:10.5px !important}
/* Add-second button */
.wc-add2nd{position:absolute; bottom:3px; right:3px; z-index:2; width:20px; height:20px; border-radius:50%; background:var(--brand-soft); border:1px solid var(--brand-cream); display:grid; place-items:center; font-size:13px; color:var(--brand-coral); cursor:pointer; line-height:1}
.wc-add2nd:hover{background:var(--brand-coral); color:#fff}
/* Back button in picker */
.wk-pick-back{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--brand-dark); cursor:pointer; margin-bottom:10px; padding:5px 12px; border:1px solid var(--line); border-radius:8px; background:#fff}
.wk-pick-back:hover{border-color:var(--brand-coral); background:var(--brand-soft)}
/* Micronutrient selector */
.wk-micro-sel{display:flex; flex-wrap:wrap; gap:5px}
.wk-micro-sel label{font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff}
.wk-micro-sel input{accent-color:var(--brand-dark); width:14px; height:14px}
/* Micronutrient totals */
.week-day-totals .wdt-micro{font-size:10px; color:var(--muted)}
.week-day-totals .wdt-micro .wdt-cell{font-size:11px}

/* ===================== Detailed Meal Plan ===================== */
.dt-tabs{display:flex; gap:6px; padding:12px 24px 0; flex-wrap:wrap}
.dt-tab{padding:8px 20px; border:1px solid var(--line); border-radius:9px 9px 0 0; background:var(--bg); font-size:18px; font-weight:500; cursor:pointer; color:var(--muted); transition:.13s; border-bottom:none}
.dt-tab:hover{background:#fff; color:var(--ink)}
.dt-tab.active{background:#fff; color:var(--brand-coral); border-color:var(--brand-cream); font-weight:600; position:relative}
.dt-tab.active:after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:#fff}
.dt-config{padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:20px; flex-wrap:wrap; align-items:center}
.dt-config .cfg{display:flex; align-items:center; gap:8px; font-size:17px}
.dt-config .cfg label{white-space:nowrap; color:var(--muted)}
.dt-config select,.dt-config input[type="checkbox"]{font-size:17px; border:1px solid var(--line); border-radius:6px; padding:5px 8px; background:#fff; color:var(--ink)}
.dt-config select:focus{outline:none; border-color:var(--brand-coral)}
.dt-config textarea{width:100%; max-width:600px; font-size:17px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; resize:vertical; background:#fff; color:var(--ink)}
.dt-config textarea:focus{outline:none; border-color:var(--brand-coral)}
.dt-micro-chips{display:flex; flex-wrap:wrap; gap:6px}
.dt-micro-chips label{font-size:16px; display:flex; align-items:center; gap:5px; cursor:pointer; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:#fff}
.dt-micro-chips input{accent-color:var(--brand-dark); width:16px; height:16px}

/* Two-column layout: config left, meal building right */
.dt-main-layout{display:flex; gap:0; flex:1; min-height:0; overflow:hidden}
.dt-left-panel{width:280px; flex-shrink:0; border-right:1px solid var(--line); overflow-y:auto; padding-bottom:12px}
.dt-right-panel{flex:1; min-width:0; overflow-y:auto; padding:0}
.dt-left-panel .dt-config{border-bottom:1px solid var(--line); padding:12px 16px; flex-direction:column; align-items:stretch; gap:8px}
.dt-left-panel .dt-config .cfg{font-size:14px}
.dt-left-panel .dt-config .cfg input[type="text"],
.dt-left-panel .dt-config .cfg input:not([type]),
.dt-left-panel .dt-config .cfg select{width:100%; box-sizing:border-box}
.dt-left-panel .dt-config textarea{font-size:14px; max-width:100%}
.dt-left-panel .dt-micro-chips{font-size:12px}
.dt-left-panel .dt-micro-chips label{gap:2px}
.dt-right-panel .dt-day-wrap{padding:10px 16px 6px; max-height:none; flex:1}

.dt-day-wrap{padding:10px 24px 6px; max-height:58vh; overflow-y:auto}
.dt-row{border:1px solid var(--line); border-radius:11px; margin-bottom:10px; overflow:hidden; background:#fff}
.dt-row-head{display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--brand-soft); border-bottom:1px solid var(--brand-cream)}
.dt-row-label{flex:1; border:none; background:transparent; font-size:20px; font-weight:600; color:var(--brand-dark); font-family:var(--font-heading); outline:none; padding:3px 6px; border-radius:4px}
.dt-row-label:focus{background:#fff; box-shadow:0 0 0 2px var(--accent-soft)}
.dt-row-del{font-size:20px; color:var(--muted); cursor:pointer; border:none; background:transparent; padding:3px 8px; border-radius:4px; line-height:1}
.dt-row-del:hover{color:var(--danger); background:rgba(220,53,69,.08)}
.dt-row-macros{font-size:14px; color:var(--muted); font-weight:400; font-family:var(--font-body); white-space:nowrap}
.dt-row-macros b{color:var(--brand-dark); font-weight:600}
.dt-comps{display:flex; gap:8px; padding:8px 10px; flex-wrap:wrap}
.dt-comp{flex:1 1 165px; min-width:150px; max-width:220px; border:1px solid var(--line); border-radius:9px; overflow:hidden; position:relative; background:#fff; display:flex; flex-direction:column; cursor:default}
.dt-comp-thumb{position:relative; aspect-ratio:5/3; overflow:hidden; display:grid; place-items:center}
.dt-comp-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.dt-comp-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.dt-comp-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.dt-comp-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.dt-comp-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.dt-comp-name{font-size:16px; font-weight:600; padding:5px 8px 2px; line-height:1.2; color:var(--ink); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.dt-comp-portion{font-size:13px; color:var(--brand-coral); font-weight:600; padding:1px 8px 2px}
.dt-comp-serv-row{display:flex; align-items:center; gap:4px; font-size:14px; color:var(--muted); padding:0 8px 2px}
.dt-comp-serv-row label{white-space:nowrap}
.dt-comp-serv-input{width:42px; border:1px solid var(--line); border-radius:4px; padding:2px 4px; font-size:14px; text-align:center; background:#fff; color:var(--ink)}
.dt-comp-serv-input:focus{outline:none; border-color:var(--brand-coral)}
.dt-comp-amt{font-size:14px; color:var(--brand-dark); font-weight:600; padding:0 8px 2px}
.dt-comp-mac{font-size:14px; color:var(--muted); padding:0 8px 5px; line-height:1.3}
.dt-comp-mac b{color:var(--brand-dark); font-weight:600}
.dt-comp-del{position:absolute; top:4px; right:4px; z-index:2; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.9); border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--muted); cursor:pointer; line-height:1}
.dt-comp-del:hover{color:var(--danger); border-color:var(--danger)}
.dt-comp-export-cb{position:absolute; top:4px; left:4px; z-index:2; width:16px; height:16px; accent-color:var(--brand-coral)}
.dt-comp-serv-note{font-size:14px; border:1px solid var(--line); border-radius:4px; padding:3px 6px; margin:3px 8px 5px; background:var(--bg); color:var(--ink); width:auto; flex:1}
.dt-comp-serv-note:focus{outline:none; border-color:var(--brand-coral); background:#fff}
.dt-comp-empty{flex:1 1 165px; min-width:150px; max-width:220px; min-height:120px; border:2px dashed var(--line); border-radius:9px; display:grid; place-items:center; font-size:28px; color:var(--muted); cursor:pointer; transition:.13s; background:var(--bg)}
.dt-comp-empty:hover{border-color:var(--brand-coral); background:var(--brand-soft); color:var(--brand-coral)}
.dt-add-comp{flex:1 1 165px; min-width:150px; max-width:220px; min-height:120px; border:2px dashed var(--brand-cream); border-radius:9px; display:grid; place-items:center; font-size:15px; color:var(--muted); cursor:pointer; transition:.13s; background:transparent}
.dt-add-comp:hover{border-color:var(--brand-coral); background:var(--brand-soft); color:var(--brand-coral)}
.dt-row-add{border:2px dashed var(--brand-cream); border-radius:11px; padding:10px; text-align:center; font-size:17px; color:var(--muted); cursor:pointer; transition:.13s; background:transparent; margin-bottom:10px}
.dt-row-add:hover{border-color:var(--brand-coral); background:var(--brand-soft); color:var(--brand-coral)}
.dt-day-totals{margin-top:10px; padding:10px 14px; border:1px solid var(--brand-cream); border-radius:11px; background:var(--brand-soft); font-size:16px}
.dt-day-totals .dt-trow{display:flex; gap:18px; flex-wrap:wrap}
.dt-day-totals .dt-tlabel{font-weight:600; color:var(--brand-dark)}
.dt-day-totals .dt-tcell{color:var(--muted)}
.dt-day-totals .dt-tcell b{color:var(--brand-dark); font-weight:600}
.dt-hint{font-size:14px; color:var(--muted); padding:5px 0}
.dt-actions{display:flex; gap:10px; padding:12px 24px; border-top:1px solid var(--line); flex-wrap:wrap}
.dt-save-bar{display:flex; gap:10px; align-items:center; padding:10px 24px; border-top:1px solid var(--line); flex-wrap:wrap}
.dt-save-bar input{flex:1; min-width:180px; font-size:17px; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fff; color:var(--ink)}
.dt-save-bar input:focus{outline:none; border-color:var(--brand-coral)}
.dt-plan-list{padding:10px 24px; max-height:250px; overflow-y:auto}
.dt-plan-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; font-size:16px; background:#fff}
.dt-plan-item:hover{border-color:var(--brand-cream)}
.dt-plan-item .pn{flex:1; font-weight:500; color:var(--ink)}
.dt-plan-item .pd{font-size:14px; color:var(--muted)}

/* ===================== 讲义（屏幕隐藏，打印显示） ===================== */
#handout,#recipeSheet,#weekSheet,#detailSheet{display:none}
#handout .h-page{padding:0 0 26px}

/* branding header */
#handout .h-head{
  display:flex; align-items:center; gap:16px; padding-bottom:16px; margin-bottom:22px;
  border-bottom:2.5px solid var(--brand-coral);
}
#handout .h-logo{flex:none}
#handout .h-logo img{height:55px; width:auto; display:block}
#handout .h-brand-text{flex:1}
#handout .h-practice{font-size:18px; color:var(--brand-coral); font-weight:600; font-family:var(--font-heading)}
#handout .h-credential{font-size:13px; color:var(--muted); margin-top:2px}
#handout .h-title{font-size:22px; letter-spacing:-.3px; margin:8px 0 3px; font-family:var(--font-heading); color:var(--brand-dark)}
#handout .h-sub{font-size:13px; color:var(--muted)}
#handout .h-note{margin-top:14px; background:var(--brand-soft); border-radius:9px; padding:14px 18px; font-size:20px; color:var(--brand-dark); border-left:3px solid var(--brand-coral); line-height:1.5}
#handout .h-day{font-size:24px; margin:18px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--brand-cream); display:flex; align-items:baseline; gap:10px; font-family:var(--font-heading); color:var(--brand-dark); break-after:avoid; page-break-after:avoid}
#handout .h-day .cnt{font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body)}
#handout .h-day-macros{margin-left:auto; font-size:16px; color:var(--muted); font-family:var(--font-body); font-weight:400}
#handout .h-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
#handout .h-meal{border:1px solid var(--line); border-radius:11px; overflow:hidden; break-inside:avoid; page-break-inside:avoid}
#handout .h-photo{position:relative; aspect-ratio:5/3; overflow:hidden; display:grid; place-items:center}
#handout .h-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#handout .h-photo[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
#handout .h-photo[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
#handout .h-photo[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
#handout .h-photo[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
#handout .h-photo .ph-emoji{width:64px; height:64px; font-size:32px}
#handout .h-mb{padding:10px 12px 12px}
#handout .h-mb .n{font-size:21px; font-weight:700; font-family:var(--font-heading); color:var(--brand-dark); line-height:1.25}
#handout .h-mb .z{font-size:16px; color:var(--muted); line-height:1.35}
#handout .h-mb .w{font-size:18px; color:#4a544e; margin-top:5px; line-height:1.4}
#handout .h-mb .ing{font-size:16px; color:var(--muted); margin-top:5px; line-height:1.4}
#handout .h-mb .h-macros{margin-top:7px}
#handout .h-mb .h-macros .m-tag{font-size:15px; background:var(--brand-soft); color:var(--brand-dark); padding:4px 8px; border-radius:5px; font-weight:600; white-space:nowrap; display:inline-block}
#handout .h-focus{margin-top:6px; display:flex; gap:4px; flex-wrap:wrap}
#handout .h-focus .f-tag{font-size:9px; background:var(--brand-coral); color:#fff; padding:1px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:.3px}
#handout .h-recipes-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
#handout .h-recipe{break-inside:avoid; page-break-inside:avoid; border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:0}
#handout .h-recipe-top{display:flex; gap:12px; align-items:flex-start; margin-bottom:5px}
#handout .h-recipe-photo{flex:none; width:135px; aspect-ratio:1/1; position:relative; overflow:hidden; border-radius:8px; display:grid; place-items:center}
#handout .h-recipe-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#handout .h-recipe-photo .ph-emoji{width:68px; height:68px; font-size:36px}
#handout .h-recipe-photo[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
#handout .h-recipe-photo[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
#handout .h-recipe-photo[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
#handout .h-recipe-photo[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
#handout .h-recipe-head{flex:1; min-width:0}
#handout .h-recipe h4{font-size:31px; font-family:var(--font-heading); color:var(--brand-dark); line-height:1.25; margin:0}
#handout .h-recipe-meta{font-size:20px; color:var(--muted); font-weight:400; font-family:var(--font-body); margin-top:3px}
#handout .h-recipe .sec-t{font-size:19px; margin-bottom:6px}
#handout .h-recipe .cols{display:block; margin-top:9px}
#handout .h-recipe .cols > div{margin-bottom:9px}
#handout .h-recipe .ing{font-size:20px; line-height:1.4}
#handout .h-recipe .ing li{padding:3px 0 3px 20px}
#handout .h-recipe .ing li:before{top:9px; width:6px; height:6px}
#handout .h-recipe .steps{font-size:20px; line-height:1.4}
#handout .h-recipe .steps li{padding:0 0 6px 30px}
#handout .h-recipe .steps li:before{width:20px;height:20px;font-size:10px}
#handout .h-recipe .r-macros{margin-top:9px; display:flex; gap:10px; font-size:16px; color:var(--muted); flex-wrap:nowrap; white-space:nowrap}
#handout .h-recipe .r-macros b{color:var(--brand-dark); font-weight:700}
#handout .h-foot{
  margin-top:26px; padding-top:12px; border-top:1px solid var(--brand-cream); font-size:14px;
  color:var(--muted); text-align:center; display:flex; justify-content:center; gap:8px; align-items:center;
}
#handout .h-foot img{height:18px; width:auto}

/* ===================== 打印 ===================== */
@media print{
  @page{ size:letter; margin:12mm 12mm 14mm; }
  body{background:#fff; font-size:14px; font-family:var(--font-body); -webkit-print-color-adjust:exact; print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .app,.topbar,#modal,#libModal,#weekModal,#detailModal,.screen-only{display:none !important}
  #handout{display:block !important}
  body.mode-recipe #handout{display:none !important}
  body.mode-recipe #recipeSheet{display:block !important}
  body.mode-week #handout{display:none !important}
  body.mode-week #weekSheet{display:block !important}
  #recipeSheet .r-head{
    display:flex; align-items:center; gap:16px; padding-bottom:14px; margin-bottom:18px;
    border-bottom:2.5px solid var(--brand-coral);
  }
  #recipeSheet .r-logo{flex:none}
  #recipeSheet .r-logo img{height:48px; width:auto}
  #recipeSheet .r-brand-text{flex:1}
  #recipeSheet .r-brand-text .pn{font-size:16px; color:var(--brand-coral); font-weight:600; font-family:var(--font-heading)}
  #recipeSheet .r-brand-text .cr{font-size:12px; color:var(--muted)}
  #recipeSheet .r-head h1{font-size:28px; margin:6px 0 3px; font-family:var(--font-heading); color:var(--brand-dark)}
  #recipeSheet .r-head .z{font-size:14px; color:var(--muted)}
  #recipeSheet .r-meta{display:flex; gap:16px; font-size:13px; color:var(--muted); margin:14px 0}
  #recipeSheet .two{display:grid; grid-template-columns:1fr 1.4fr; gap:26px; margin-top:18px}
  #recipeSheet .sec-t{font-size:12px}
  #recipeSheet .ing li,#recipeSheet .steps li{font-size:13px}
  #recipeSheet .why{background:#f2f6f3; border-left:3px solid var(--brand-coral); padding:10px 14px; font-size:13px; margin:14px 0; color:var(--brand-dark)}
  #recipeSheet .notes{background:#f7f6f3; padding:12px 14px; font-size:12px; margin-top:16px}
  #recipeSheet .r-macros{display:flex; gap:18px; margin-top:16px; font-size:13px; color:var(--muted)}
  #recipeSheet .r-macros b{color:var(--brand-dark)}
  #recipeSheet .r-foot{margin-top:24px; padding-top:12px; border-top:1px solid var(--brand-cream); font-size:11px; color:var(--muted); text-align:center}
  .h-page{break-after:page}
  .h-day-break{break-before:page}
  .h-first-day{break-before:avoid}
  .h-recipes-start{break-before:page}

  /* 7-day plan print */
  #weekSheet{font-family:var(--font-body)}
  #weekSheet .ws-head{
    display:flex; align-items:center; gap:12px; padding-bottom:6px; margin-bottom:6px;
    border-bottom:2.5px solid var(--brand-coral);
  }
  #weekSheet .ws-logo{flex:none}
  #weekSheet .ws-logo img{height:40px; width:auto}
  #weekSheet .ws-brand-text .pn{font-size:15px; color:var(--brand-coral); font-weight:600; font-family:var(--font-heading)}
  #weekSheet .ws-title{font-size:20px; font-family:var(--font-heading); color:var(--brand-dark); margin:2px 0 1px}
  #weekSheet .ws-sub{font-size:11px; color:var(--muted)}
  #weekSheet .ws-grid{display:grid; gap:2px; width:100%; margin-top:6px}
  #weekSheet .ws-row{display:grid; grid-template-columns:26px repeat(7,1fr); gap:2px}
  #weekSheet .ws-dh{font-size:12px; font-weight:700; color:var(--brand-dark); text-align:center; padding:3px; border-bottom:2px solid var(--brand-cream); font-family:var(--font-heading)}
  #weekSheet .ws-ml{font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); font-weight:600; writing-mode:vertical-rl; transform:rotate(180deg); display:flex; align-items:center; justify-content:center; padding:2px 0; height:100%}
  #weekSheet .ws-cell{border:1px solid var(--line); border-radius:4px; padding:4px; min-height:156px; font-size:12px; line-height:1.3; break-inside:avoid; overflow:hidden; display:flex; flex-direction:column}
  #weekSheet .ws-cell .ws-img{position:relative; flex:1 1 0; min-height:0; overflow:hidden; border-radius:4px; margin-bottom:4px; display:grid; place-items:center}
  #weekSheet .ws-cell .ws-img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  #weekSheet .ws-cell .ws-img .ph-emoji{font-size:28px}
  #weekSheet .ws-cell .ws-mn{font-weight:700; color:var(--brand-dark); margin-bottom:2px; font-size:12px; line-height:1.25; flex-shrink:0}
  #weekSheet .ws-cell .ws-mn .wl{display:block}
  #weekSheet .ws-cell .ws-mm{font-size:10px; color:var(--muted); line-height:1.2; flex-shrink:0}
  #weekSheet .ws-totals{margin-top:14px; font-size:12px}
  #weekSheet .ws-totals .ws-trow{display:grid; grid-template-columns:80px repeat(7,1fr); gap:3px}
  #weekSheet .ws-totals .ws-tlabel{font-weight:700; color:var(--brand-dark); padding:5px}
  #weekSheet .ws-totals .ws-tcell{text-align:center; padding:5px; color:var(--muted)}
  #weekSheet .ws-totals .ws-thead .ws-thcell{text-align:center; padding:4px; font-weight:700; color:var(--brand-coral); font-family:var(--font-heading); border-bottom:2px solid var(--brand-cream); margin-bottom:4px}
  #weekSheet .ws-foot{margin-top:20px; padding-top:10px; border-top:1px solid var(--brand-cream); font-size:11px; color:var(--muted); text-align:center}

  /* Detailed plan print — portrait, one page per day */
  body.mode-detail #handout{display:none !important}
  body.mode-detail #detailSheet{display:block !important}
  #detailSheet .ds-head{
    display:flex; align-items:center; gap:14px; padding-bottom:12px; margin-bottom:16px;
    border-bottom:2.5px solid var(--brand-coral);
  }
  #detailSheet .ds-logo{flex:none}
  #detailSheet .ds-logo img{height:42px; width:auto}
  #detailSheet .ds-brand-text{flex:1}
  #detailSheet .ds-brand-text .pn{font-size:15px; color:var(--brand-coral); font-weight:600; font-family:var(--font-heading)}
  #detailSheet .ds-brand-text .cr{font-size:11px; color:var(--muted)}
  #detailSheet .ds-title{font-size:22px; font-family:var(--font-heading); color:var(--brand-dark); margin:4px 0 1px}
  #detailSheet .ds-sub{font-size:12px; color:var(--muted)}
  #detailSheet .ds-day{page-break-after:always; break-after:page}
  #detailSheet .ds-day:last-child{page-break-after:auto; break-after:auto}
  #detailSheet .ds-day-label{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:20px; font-family:var(--font-heading); color:var(--brand-dark); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--brand-cream)}
  #detailSheet .ds-row{margin-bottom:8px; break-inside:avoid; page-break-inside:avoid}
  #detailSheet .ds-row-label{font-size:16px; font-weight:700; color:var(--brand-coral); font-family:var(--font-heading); margin-bottom:3px; display:flex; align-items:baseline; gap:8px}
  #detailSheet .ds-row-macros{font-size:13px; color:var(--muted); font-weight:400; font-family:var(--font-body)}
  #detailSheet .ds-row-macros b{color:var(--brand-dark); font-weight:600}
  #detailSheet .ds-comps{display:flex; gap:8px; flex-wrap:wrap}
  #detailSheet .ds-comp{width:140px;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
  #detailSheet .ds-comp-thumb{position:relative; aspect-ratio:3/2; overflow:hidden; display:grid; place-items:center}
  #detailSheet .ds-comp-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  #detailSheet .ds-comp-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
  #detailSheet .ds-comp-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}

/* --- Portion size display helper ---
   If a recipe has a manually-entered portionSize + portionUnit, returns the
   scaled value (portionSize × servings) formatted with the unit.
   Otherwise returns "N servings" (servings count from the UI). --- */
function getPortionDisplay(m, servings){
  const L = t();
  const serv = servings || 1;
  if(m && m.portionSize && m.portionSize > 0 && m.portionUnit){
    const total = m.portionSize * serv;
    const numDisplay = total % 1 === 0 ? String(total) : String(Math.round(total * 100) / 100);
    return numDisplay + ' ' + m.portionUnit;
  }
  const servDisplay = serv % 1 === 0 ? String(serv) : String(Math.round(serv * 100) / 100);
  return servDisplay + ' ' + L.detailServingsCount;
}

/* --- Week plan entry helpers: supports both old (string id) and new ({id, servings}) formats ---
   New entries also carry a `slot` field recording which week-plan slot
   (breakfast / morning-snack / lunch / …) the recipe was added to.  This
   lets us display a dinner recipe in the lunch cell when the user picked
   it from the lunch gallery.  Old entries without `slot` fall back to
   type-based matching via slotDisplayMatch(). */
function entryId(e){ return typeof e === 'string' ? e : e.id; }
function entryServ(e){ return typeof e === 'string' ? 1 : (e.servings || 1); }
function entrySlot(e){ return (typeof e === 'object' && e.slot) ? e.slot : ''; }
function mkEntry(id, slot){ return { id, servings: 1, slot: slot || '' }; }

/* Data model:
   detailState.days[di].rows[ri].components[ci] = { id, servings, servingNote }
   - id: recipe ID
   - servings: number (for macro/micro calculation)
   - servingNote: display text like "1 cup", "1/2 cup grated" */

function mkDetailComponent(id){
  const m = byId(id);
  return { id, servings: 1, servingNote: '', includeInExport: false };
}
function mkDetailRow(label){ return { label: label || '', components: [] }; }
function mkDetailDay(label){ return { label: label || '', rows: [mkDetailRow('')] }; }

const detailState = {
  clientName: '',
  numDays: 1,
  currentDay: 0,
  showMacros: true,
  showCompMacros: true,

  notes: '',
  days: [mkDetailDay('Day 1')]
};

function saveDetail(){ try{ localStorage.setItem(DETAIL_KEY, JSON.stringify(detailState)); }catch(e){} }
function loadDetail(){
  try{
    const raw = localStorage.getItem(DETAIL_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.assign(detailState, parsed);
      if(!detailState.days || !detailState.days.length) detailState.days = [mkDetailDay('Day 1')];
      if(typeof detailState.currentDay === 'undefined') detailState.currentDay = 0;
      if(typeof detailState.numDays === 'undefined') detailState.numDays = 1;
      if(typeof detailState.showMacros === 'undefined') detailState.showMacros = true;
      // Migrate old single selectedMicro to microSelection array
      if(typeof detailState.microSelection === 'undefined'){
        if(detailState.selectedMicro) detailState.microSelection = [detailState.selectedMicro];
        else detailState.microSelection = [];
        delete detailState.selectedMicro;
      }
      if(typeof detailState.includeRecipes === 'undefined') detailState.includeRecipes = false;
    }
  }catch(e){}
}

/* Ensure detailState.days has at least numDays entries */
function ensureDetailDays(){
  while(detailState.days.length < detailState.numDays){
    detailState.days.push(mkDetailDay('Day ' + (detailState.days.length + 1)));
  }
  while(detailState.days.length > 7) detailState.days.pop();
  if(detailState.currentDay >= detailState.days.length) detailState.currentDay = detailState.days.length - 1;
  if(detailState.currentDay < 0) detailState.currentDay = 0;
}

/* Collect all components from a day's rows for macro/micro totals */
function detailDayEntries(dayObj){
  const entries = [];
  if(!dayObj || !dayObj.rows) return entries;
  dayObj.rows.forEach(r=>{
    (r.components||[]).forEach(c=> entries.push(c));
  });
  return entries;
}

/* --- Meal category helpers (multi-type): meals can now belong to several
   meal categories at once (e.g. breakfast AND snack). Backward-compatible with
   legacy data that only set `type`. The first slot in `types[]` is treated as
   the primary type for styling purposes; `data-type` attributes still use it. */
const MEAL_TYPES = ['breakfast','lunch','dinner','snack'];
function mealTypes(m){
  if(!m) return [];
  if(Array.isArray(m.types) && m.types.length) return m.types;
  if(m.type) return [m.type];
  return [];
}
function primaryType(m){
  const ts = mealTypes(m);
  return ts[0] || 'snack';
}
function mealHasType(m, ty){ return mealTypes(m).includes(ty); }

/* Lunch and dinner share the same recipe pool — many main dishes work for
   either slot.  When filtering for a week-plan slot we treat lunch & dinner
   as interchangeable so recipes appear in both galleries and can be dropped
   into either row. */
function slotMatchesMeal(m, mt){
  const libType = SLOT_LIB_TYPE[mt] || mt;
  if(libType === 'lunch' || libType === 'dinner'){
    return mealHasType(m, 'lunch') || mealHasType(m, 'dinner');
  }
  return mealHasType(m, libType);
}

/* Determines which cell a recipe should be DISPLAYED in when rendering the
   week grid or PDF.  Unlike slotMatchesMeal (broad, used for the picker),
   this uses priority-based assignment:
   - Dinner-primary recipes (type 'dinner', or types[0]==='dinner') skip
     the lunch cell and go straight to dinner.
   - Lunch-primary recipes go to lunch, not dinner.
   - Recipes tagged as both get assigned to their primary type. */
function slotDisplayMatch(m, mt){
  const libType = SLOT_LIB_TYPE[mt] || mt;
  if(libType === 'lunch'){
    // Lunch cell: match lunch recipes, UNLESS their primary type is dinner
    return mealHasType(m, 'lunch') && primaryType(m) !== 'dinner';
  }
  if(libType === 'dinner'){
    // Dinner cell: match any recipe that has dinner type
    return mealHasType(m, 'dinner');
  }
  return mealHasType(m, libType);
}

/* Unified display matching for week-plan entries.  If the entry was
   created with a `slot` field (new entries), we trust it — the user
   explicitly placed the recipe in that slot.  Old entries without a
   slot fall back to slotDisplayMatch (type-based). */
function slotEntryMatch(e, m, mt){
  if(!m) return false;
  const es = entrySlot(e);
  if(es) return es === mt;
  return slotDisplayMatch(m, mt);
}

/* ---------- client-side image compression ---------- */
/* Resizes an uploaded image to max 640px on the long edge and re-encodes as
   JPEG q78, returning a data URI.  This keeps each stored image ~30-80KB
   instead of the raw upload (often 500KB+), preventing localStorage quota
   exhaustion after uploading images to several recipes. */
function compressImage(dataURI, maxDim, quality, cb){
  const img = new Image();
  img.onload = ()=>{
    let w = img.naturalWidth, h = img.naturalHeight;
    if(w > maxDim || h > maxDim){
      const scale = maxDim / Math.max(w, h);
      w = Math.round(w * scale);
      h = Math.round(h * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    // If the original was a PNG with transparency, fill white bg for JPEG
    try { cb(canvas.toDataURL('image/jpeg', quality)); }
    catch(e){ cb(dataURI); } // fallback to original if toDataURL fails
  };
  img.onerror = ()=> cb(dataURI); // fallback to original
  img.src = dataURI;
}

/* Exports ALL user recipe data (overrides, custom recipes, deleted IDs)
   plus all uploaded images (from IndexedDB cache + any leftover data URIs
   in localStorage) to a single downloadable JSON file. */
function exportBackup(){
  const ud = loadUserData();
  const images = {};
  // Collect from imgCache (populated from IndexedDB on load)
  Object.keys(imgCache).forEach(function(id){
    if(imgCache[id] && typeof imgCache[id] === 'string') images[id] = imgCache[id];
  });
  // Also scan for any remaining data: URIs in localStorage
  Object.keys(ud.overrides||{}).forEach(function(id){
    var ov = ud.overrides[id];
    if(ov.img && typeof ov.img === 'string' && ov.img.startsWith('data:') && !images[id])
      images[id] = ov.img;
  });
  (ud.custom||[]).forEach(function(r){
    if(r.img && typeof r.img === 'string' && r.img.startsWith('data:') && !images[r.id])
      images[r.id] = r.img;
  });

  var recipeCount = Object.keys(ud.overrides||{}).length + (ud.custom||[]).length;
  var imageCount = Object.keys(images).length;
  var deletedCount = (ud.deleted||[]).length;

  var backup = {
    version: 1,
    app: 'meal-idea-generator',
    exportedAt: new Date().toISOString(),
    userData: ud,
    images: images
  };
  var json = JSON.stringify(backup);
  var blob = new Blob([json], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'meal-idea-backup-' + d + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  var sizeKB = Math.round(json.length * 2 / 1024);
  return { recipeCount: recipeCount, imageCount: imageCount, deletedCount: deletedCount, sizeKB: sizeKB };
}

/* Imports a backup JSON file: restores userData to localStorage,
   writes images to IndexedDB, rebuilds and re-renders. */
function importBackup(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var backup = JSON.parse(reader.result);
      if(!backup.userData) { if(cb) cb(new Error('Invalid backup file')); return; }
      // Safety check: warn if backup would mass-delete recipes
      var delCount = (backup.userData.deleted||[]).length;
      if(delCount > BASE_MEALS.length * 0.5){
        var msg = state.lang === 'zh'
          ? '警告：此备份文件包含 ' + delCount + ' 个已删除菜品（共 ' + BASE_MEALS.length + ' 个内置菜品）。确定要导入吗？'
          : 'Warning: This backup has ' + delCount + ' deleted recipes (out of ' + BASE_MEALS.length + ' built-in). Import anyway?';
        if(!confirm(msg)){ if(cb) cb(null, { imageCount: 0, skipped: true }); return; }
      }
      // Restore userData to localStorage
      saveUserData(backup.userData);
      // Restore images to IndexedDB
      var imgs = backup.images || {};
      var ids = Object.keys(imgs);
      if(!ids.length){
        // No images — also clear old imgCache
        Object.keys(imgCache).forEach(function(k){ delete imgCache[k]; });
        rebuildMeals();
        if(cb) cb(null, { imageCount: 0 });
        return;
      }
      // Clear old cache, then write new images
      Object.keys(imgCache).forEach(function(k){ delete imgCache[k]; });
      var done = 0;
      ids.forEach(function(id){
        imgCache[id] = imgs[id]; // cache immediately
        idbPut(id, imgs[id]).then(function(){
          done++;
          if(done === ids.length){
            rebuildMeals();
            if(cb) cb(null, { imageCount: ids.length });
          }
        });
      });
    }catch(e){
      if(cb) cb(e);
    }
  };
  reader.onerror = function(){ if(cb) cb(new Error('Failed to read file')); };
  reader.readAsText(file);
}

/* ---------- IndexedDB image storage (bypasses localStorage 5MB limit) ---------- */
/* Uploaded recipe images are stored in IndexedDB instead of localStorage.
   localStorage only keeps a short 'idb:<recipeId>' marker (~10 bytes),
   while the actual image data lives in IndexedDB (50MB+ capacity). */
const IDB_IMG_DB = 'meal-idea-images';
const IDB_IMG_STORE = 'imgs';
const imgCache = {}; // recipeId -> dataURI (in-memory, loaded from IDB on startup)

function idbOpen(){
  return new Promise(function(resolve, reject){
    try{
      const req = indexedDB.open(IDB_IMG_DB, 1);
      req.onupgradeneeded = function(e){
        const db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_IMG_STORE)) db.createObjectStore(IDB_IMG_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    }catch(e){ reject(e); }
  });
}
function idbPut(key, val){
  return new Promise(function(resolve){
    idbOpen().then(function(db){
      const tx = db.transaction(IDB_IMG_STORE, 'readwrite');
      tx.objectStore(IDB_IMG_STORE).put(val, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
    }).catch(function(){ resolve(false); });
  });
}
function idbDel(key){
  return new Promise(function(resolve){
    idbOpen().then(function(db){
      const tx = db.transaction(IDB_IMG_STORE, 'readwrite');
      tx.objectStore(IDB_IMG_STORE).delete(key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    }).catch(function(){ resolve(); });
  });
}
function idbLoadAll(){
  return new Promise(function(resolve){
    idbOpen().then(function(db){
      const tx = db.transaction(IDB_IMG_STORE, 'readonly');
      const req = tx.objectStore(IDB_IMG_STORE).openCursor();
      req.onsuccess = function(){
        const cursor = req.result;
        if(cursor){ imgCache[cursor.key] = cursor.value; cursor.continue(); }
        else resolve();
      };
      req.onerror = function(){ resolve(); };
    }).catch(function(){ resolve(); });
  });
}

/* Migrate data URI images from localStorage to IndexedDB.
   Replaces each 'data:image/...' in overrides/custom with 'idb:<id>' marker.
   Frees up localStorage space dramatically (each image goes from ~50-500KB → ~10 bytes). */
function migrateImagesToIDB(){
  return new Promise(function(resolve){
    const ud = loadUserData();
    var jobs = [];
    Object.keys(ud.overrides || {}).forEach(function(id){
      var ov = ud.overrides[id];
      if(ov.img && typeof ov.img === 'string' && ov.img.startsWith('data:')){
        jobs.push({ id: id, uri: ov.img, ref: ov });
      }
    });
    (ud.custom || []).forEach(function(r){
      if(r.img && typeof r.img === 'string' && r.img.startsWith('data:')){
        jobs.push({ id: r.id, uri: r.img, ref: r });
      }
    });
    if(!jobs.length){ resolve(0); return; }
    var done = 0;
    jobs.forEach(function(job){
      idbPut(job.id, job.uri).then(function(ok){
        if(ok){
          imgCache[job.id] = job.uri;
          job.ref.img = 'idb:' + job.id;
        }
        done++;
        if(done === jobs.length){
          saveUserData(ud);
          rebuildMeals();
          resolve(jobs.length);
        }
      });
    });
  });
}

/* ---------- storage management ---------- */
/* Returns approximate localStorage usage in bytes. */
function getStorageInfo(){
  try{
    const recipeRaw = localStorage.getItem(RECIPE_KEY) || '';
    const recipeBytes = recipeRaw.length * 2; // UTF-16 ~2 bytes/char
    let totalBytes = 0;
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      totalBytes += ((localStorage.getItem(k)||'').length + (k||'').length) * 2;
    }
    return { recipeBytes, totalBytes, limit: 5200000 }; // ~5MB typical quota
  }catch(e){ return { recipeBytes:0, totalBytes:0, limit:5200000 }; }
}

/* Compress all data-URI images already stored in localStorage overrides/custom.
   Runs asynchronously (canvas), calls cb(done, savedKB) when finished. */
function compressStoredImages(cb){
  const ud = loadUserData();
  const jobs = [];
  // Collect oversized data URIs from overrides
  Object.keys(ud.overrides||{}).forEach(id=>{
    const ov = ud.overrides[id];
    if(ov.img && typeof ov.img === 'string' && ov.img.startsWith('data:') && ov.img.length > 40000){
      jobs.push({ ref: ov, uri: ov.img });
    }
  });
  // Collect from custom recipes
  (ud.custom||[]).forEach(r=>{
    if(r.img && typeof r.img === 'string' && r.img.startsWith('data:') && r.img.length > 40000){
      jobs.push({ ref: r, uri: r.img });
    }
  });

  if(!jobs.length){ if(cb) cb(0, 0); return; }

  const beforeBytes = jobs.reduce((s,j)=>s+j.uri.length, 0) * 2;
  let done = 0;

  jobs.forEach(job=>{
    compressImage(job.uri, 640, 0.78, function(out){
      if(out && out.length < job.uri.length) job.ref.img = out;
      done++;
      if(done === jobs.length){
        // All compression done — save back
        const ok = saveUserData(ud);
        rebuildMeals();
        const afterBytes = jobs.reduce((s,j)=>s+(j.ref.img?j.ref.img.length:0), 0) * 2;
        const savedKB = Math.round((beforeBytes - afterBytes) / 1024);
        if(cb) cb(jobs.length, savedKB, ok);
      }
    });
  });
}

/* If even compression can't free enough space, strip all data-URI images from
   overrides (keeping filenames), freeing the maximum amount. */
function stripAllDataImages(){
  const ud = loadUserData();
  let stripped = 0;
  Object.keys(ud.overrides||{}).forEach(id=>{
    const ov = ud.overrides[id];
    if(ov.img && typeof ov.img === 'string' && (ov.img.startsWith('data:') || ov.img.startsWith('idb:'))){
      if(ov.img.startsWith('idb:')){ idbDel(id); delete imgCache[id]; }
      delete ov.img;
      stripped++;
    }
  });
  (ud.custom||[]).forEach(r=>{
    if(r.img && typeof r.img === 'string' && (r.img.startsWith('data:') || r.img.startsWith('idb:'))){
      if(r.img.startsWith('idb:')){ idbDel(r.id); delete imgCache[r.id]; }
      delete r.img;
      stripped++;
    }
  });
  saveUserData(ud);
  rebuildMeals();
  return stripped;
}

/* 合并所有菜品：内置 + 覆盖 + 自定义，排除已删除 + 注入微量营养素 */
let ALL_MEALS = [];
function rebuildMeals(){
  const ud = loadUserData();
  ALL_MEALS = BASE_MEALS
    .map(m => {
      const merged = ud.overrides[m.id] ? Object.assign({}, m, ud.overrides[m.id]) : m;
      // Inject micronutrient data from MICROS lookup if not already present
      if(!merged.micros && typeof MICROS !== 'undefined' && MICROS[merged.id]){
        merged.micros = MICROS[merged.id];
      }
      // Normalise multi-type: keep `types[]` in sync with legacy `type`.
      const ts = mealTypes(merged);
      merged.types = ts.length ? ts.slice() : ['snack'];
      merged.type = merged.types[0];
      return merged;
    })
    .filter(m => !ud.deleted.includes(m.id) && !ud.archived.includes(m.id))
    .concat(ud.custom.map(m => {
      const c = {...m, _custom: true};
      if(!c.micros && typeof MICROS !== 'undefined' && MICROS[c.id]) c.micros = MICROS[c.id];
      const ts = mealTypes(c);
      c.types = ts.length ? ts.slice() : ['snack'];
      c.type = c.types[0];
      return c;
    }));
}
rebuildMeals();
