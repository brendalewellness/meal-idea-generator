<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Idea Generator · 餐食灵感生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 基础与主题 ===================== */
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1f2421; --muted:#6b7570; --line:#e5e3dc;
  --accent:#3f7d58; --accent-soft:#eaf1ec; --accent-ink:#2c5a3f;
  --danger:#b4544a;
  /* Brenda Le Wellness brand colors */
  --brand-dark:#495a58;
  --brand-coral:#d4967d;
  --brand-cream:#dcd9d0;
  --brand-soft:#f2efe9;
  --r:12px; --sh:0 1px 2px rgba(31,36,33,.05), 0 6px 18px rgba(31,36,33,.06);
  --font-heading:'Lora',Georgia,'Times New Roman',serif;
  --font-body:'Source Sans Pro','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}

/* ===================== 顶栏 ===================== */
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.88);
  backdrop-filter:saturate(1.6) blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:11px 20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px}
.brand b{font-size:16px; letter-spacing:-.2px}
.brand span{font-size:11.5px; color:var(--muted); letter-spacing:.3px}
.topbar .grow{flex:1}
.client-in{
  display:flex; align-items:center; gap:7px; background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:6px 11px;
}
.client-in label{font-size:12px; color:var(--muted); white-space:nowrap}
.client-in input{border:none; background:transparent; outline:none; width:130px; font-weight:500}
.btn{
  border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 14px;
  font-size:13px; font-weight:500; transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:#cfcdc4; background:#fbfaf8}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#376f4d}
.btn.brand-btn{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff}
.btn.brand-btn:hover{background:#3e4d4b}
.btn.coral-btn{background:var(--brand-coral); border-color:var(--brand-coral); color:#fff}
.btn.coral-btn:hover{background:#c98770}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--bg); color:var(--ink)}
.btn.lang{display:inline-flex; align-items:center; gap:6px; font-weight:600; padding:7px 13px}
.btn.lang .globe{font-size:14px; line-height:1}

/* ===================== 三栏布局 ===================== */
.app{
  display:grid; grid-template-columns:266px minmax(0,1fr) 330px;
  gap:18px; padding:18px 20px 60px; align-items:start;
  max-width:1560px; margin:0 auto;
}
@media (max-width:1240px){ .app{grid-template-columns:240px minmax(0,1fr)} .col-plan{grid-column:1/-1} }
@media (max-width:880px){ .app{grid-template-columns:1fr} }
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.col-side{position:sticky; top:66px}
.col-plan{position:sticky; top:66px; max-height:calc(100vh - 80px); overflow-y:auto}
@media (max-width:1240px){ .col-plan{position:static; max-height:none} }
@media (max-width:880px){ .col-side{position:static} }

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.card-pad{padding:15px 16px}
.card-h{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.card-h h3{font-size:13px; letter-spacing:.2px}
.card-h .hint{font-size:11.5px; color:var(--muted); font-weight:400}

/* ===================== 筛选器 ===================== */
.fgroup{padding:14px 16px; border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:none}
.ftitle{
  font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
  font-weight:600; margin-bottom:9px; display:flex; align-items:center; gap:6px;
}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:5px 11px; font-size:12.5px; color:#3d453f; transition:.13s; user-select:none;
  display:inline-flex; align-items:center; gap:5px;
}
.chip:hover{border-color:#c9c7bd}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.chip.on.warn{background:var(--danger); border-color:var(--danger)}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{flex:1; padding:7px 6px; font-size:12.5px; background:#fff; color:#4a544e; transition:.13s}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent); color:#fff}

.matchbar{
  padding:12px 16px; background:var(--accent-soft); display:flex; align-items:center;
  justify-content:space-between; gap:8px; font-size:12.5px; color:var(--accent-ink);
}
.matchbar b{font-size:17px; font-weight:700}

/* ===================== 菜品库 ===================== */
.lib-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tabs{display:flex; gap:4px; background:var(--bg); border-radius:9px; padding:3px}
.tabs button{
  padding:6px 13px; border-radius:7px; font-size:12.5px; color:var(--muted); font-weight:500; transition:.13s;
}
.tabs button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button .n{font-size:11px; opacity:.6; margin-left:4px}

.daypick{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); margin-left:auto}
.daypick .seg button{padding:5px 12px; font-size:12.5px}

.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
  gap:14px; padding:16px;
}
@media (max-width:880px){ .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px; padding:13px} }

.meal{
  border:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff;
  display:flex; flex-direction:column; transition:.16s; position:relative;
}
.meal:hover{border-color:#cfcdc4; transform:translateY(-2px); box-shadow:0 8px 20px rgba(31,36,33,.09)}
.meal.custom::after{
  content:'✎'; position:absolute; top:6px; right:6px; z-index:3; font-size:10px;
  background:var(--brand-coral); color:#fff; border-radius:50%; width:16px; height:16px;
  display:grid; place-items:center; pointer-events:none;
}
.photo{position:relative; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.ph-emoji{font-size:42px; line-height:1; font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.photo .ph-emoji,.h-photo .ph-emoji,.rec-hero .ph-emoji,.lib-thumb .ph-emoji,.week-thumb .ph-emoji{
  width:70px; height:70px; border-radius:50%; display:grid; place-items:center; font-size:34px;
  background:rgba(255,255,255,.66); box-shadow:0 2px 10px rgba(31,36,33,.07);
}
.mini .thumb .ph-emoji{font-size:18px; width:30px; height:30px}
.photo[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.photo[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.photo[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.photo[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.typebadge{
  position:absolute; top:8px; left:8px; z-index:2; font-size:10.5px; font-weight:600;
  letter-spacing:.4px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.92);
  color:#3d453f; backdrop-filter:blur(4px);
}
.carbbadge{
  position:absolute; top:8px; right:8px; z-index:2; font-size:10.5px; font-weight:600;
  padding:3px 8px; border-radius:6px; background:rgba(31,36,33,.72); color:#fff;
}
.meal-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1}
.meal-name{font-size:13.5px; font-weight:600; line-height:1.3}
.meal-alt{font-size:11.5px; color:var(--muted); margin-top:1px}
.meal-meta{font-size:11.5px; color:var(--muted); display:flex; gap:9px; flex-wrap:wrap}
.macro-mini{font-size:10px; color:var(--brand-dark); display:flex; gap:6px; flex-wrap:nowrap; white-space:nowrap; overflow:hidden}
.macro-mini span{background:var(--brand-soft); padding:1px 5px; border-radius:4px; white-space:nowrap; flex-shrink:0}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--bg); color:#5a645e; border:1px solid var(--line)}
.tag.gut{background:#eaf5ee; border-color:#d3e8da; color:#2f6b48}
.tag.asian{background:#fdf0ea; border-color:#f6dccf; color:#a4502c}
.meal-actions{display:flex; gap:6px; margin-top:auto}
.addbtn{
  flex:1; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  border-radius:8px; padding:6px; font-size:12px; font-weight:600; transition:.13s;
}
.addbtn:hover{background:var(--accent); color:#fff}
.recbtn{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px;
  font-size:12px; color:var(--muted); transition:.13s;
}
.recbtn:hover{border-color:#cfcdc4; color:var(--ink)}
.empty{
  padding:46px 24px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7;
}
.empty .big{font-size:30px; display:block; margin-bottom:10px; opacity:.5}

/* ===================== 计划栏 ===================== */
.day{padding:13px 14px; border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.day-h{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.day-h h4{font-size:13px}
.day-h .day-title-edit{
  font-size:13px; font-weight:600; border:1px solid transparent; border-radius:5px;
  padding:2px 6px; background:transparent; outline:none; min-width:60px; flex:1;
}
.day-h .day-title-edit:hover{border-color:var(--line); background:var(--bg)}
.day-h .day-title-edit:focus{border-color:var(--brand-coral); background:#fff}
.day-h .cnt{font-size:11px; color:var(--muted); background:var(--bg); padding:2px 7px; border-radius:5px; white-space:nowrap}
.day-h .sp{flex:1}
.mini{
  border:1px solid var(--line); border-radius:9px; padding:6px 7px; display:flex;
  align-items:center; gap:9px; margin-bottom:7px; background:#fff; transition:.13s;
}
.mini:hover{border-color:#cfcdc4}
.mini .thumb{
  width:38px; height:38px; border-radius:7px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:18px;
}
.mini .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.mini .thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.mini .thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.mini .thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.mini .thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.mini .t{flex:1; min-width:0}
.mini .t b{display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mini .t span{font-size:10.5px; color:var(--muted)}
.mini .x{color:#b8bdb9; font-size:15px; padding:3px 5px; border-radius:6px; line-height:1}
.mini .x:hover{background:#f6ecea; color:var(--danger)}
.dropzone{
  border:1.5px dashed var(--line); border-radius:9px; padding:16px 10px; text-align:center;
  color:#a8aeaa; font-size:11.5px; line-height:1.6;
}
.dropzone.over{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.notefield{width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px; resize:vertical; min-height:64px; outline:none; font-size:12.5px}
.notefield:focus{border-color:#bcc9c1}
.optrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#4a544e; cursor:pointer; padding:3px 0}
.optrow input{accent-color:var(--accent); width:15px; height:15px}

/* ===================== 食谱弹窗 ===================== */
#modal,#libModal,#weekModal{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:22px}
#modal.open,#libModal.open,#weekModal.open{display:flex}
#modal .veil,#libModal .veil,#weekModal .veil{position:absolute; inset:0; background:rgba(25,30,27,.5); backdrop-filter:blur(3px)}
#modal .sheet,#libModal .sheet,#weekModal .sheet{
  position:relative; background:#fff; border-radius:16px; max-width:760px; width:100%;
  max-height:90vh; overflow:auto; box-shadow:0 30px 70px rgba(0,0,0,.3);
}
#libModal .sheet{max-width:900px}
#weekModal .sheet{max-width:1400px; max-height:94vh}
.rec-hero{position:relative; aspect-ratio:16/7; overflow:hidden; display:grid; place-items:center}
.rec-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.rec-hero .ph-emoji{width:116px; height:116px; font-size:56px}
.rec-hero[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.rec-hero[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.rec-hero[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.rec-hero[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.rec-close,.modal-close{position:absolute; top:12px; right:12px; z-index:3; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; font-size:17px; color:#3d453f}
.rec-close:hover,.modal-close:hover{background:#fff}
.rec-body{padding:20px 24px 26px}
.rec-body h2{font-size:21px; letter-spacing:-.3px; font-family:var(--font-heading)}
.rec-body .alt{color:var(--muted); font-size:13px; margin-top:3px}
.rec-meta{display:flex; gap:14px; flex-wrap:wrap; margin:13px 0; font-size:12.5px; color:var(--muted)}
.rec-meta b{color:var(--ink); font-weight:600}
.why{background:var(--accent-soft); border-left:3px solid var(--accent); padding:10px 13px; border-radius:0 9px 9px 0; font-size:13px; color:var(--accent-ink); margin:13px 0}
.two{display:grid; grid-template-columns:1fr 1.35fr; gap:26px; margin-top:16px}
@media (max-width:640px){ .two{grid-template-columns:1fr} }
.sec-t{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:700; margin-bottom:9px}
.ing{list-style:none; padding:0; margin:0; font-size:13px}
.ing li{padding:6px 0 6px 18px; border-bottom:1px dashed var(--line); position:relative}
.ing li:before{content:""; position:absolute; left:2px; top:13px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.steps{list-style:none; padding:0; margin:0; counter-reset:s; font-size:13px}
.steps li{counter-increment:s; padding:0 0 12px 30px; position:relative}
.steps li:before{
  content:counter(s); position:absolute; left:0; top:0; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center;
}
.notes{margin-top:16px; background:var(--bg); border-radius:9px; padding:11px 13px; font-size:12.5px; color:#4a544e}
.notes b{color:var(--ink)}

/* macro section in recipe modal */
.macro-section{margin-top:16px; background:var(--brand-soft); border-radius:9px; padding:14px 16px}
.macro-section .sec-t{color:var(--brand-dark)}
.macro-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.macro-cell{text-align:center}
.macro-cell .g{font-size:22px; font-weight:700; color:var(--brand-dark); font-family:var(--font-heading)}
.macro-cell .g span{font-size:13px; font-weight:400; color:var(--muted)}
.macro-cell .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px}
.macro-cell .pct{font-size:11px; color:var(--brand-coral); margin-top:2px}
.macro-bar{height:5px; border-radius:3px; background:var(--brand-cream); margin-top:6px; overflow:hidden}
.macro-bar .fill{height:100%; border-radius:3px}

/* ===================== Recipe Library Editor ===================== */
.lib-modal-body{padding:0}
.lib-toolbar{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.lib-toolbar h2{font-size:17px; font-family:var(--font-heading)}
.lib-search{flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:13px; outline:none}
.lib-search:focus{border-color:var(--brand-coral)}
.lib-list{padding:14px 18px; display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto}
.lib-item{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; transition:.13s; background:#fff;
}
.lib-item:hover{border-color:#cfcdc4; box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lib-thumb{
  width:50px; height:50px; border-radius:8px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:22px;
}
.lib-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.lib-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.lib-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.lib-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.lib-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.lib-item .info{flex:1; min-width:0}
.lib-item .info b{font-size:13px; font-weight:600; display:block}
.lib-item .info span{font-size:11px; color:var(--muted)}
.lib-item .acts{display:flex; gap:5px}
.lib-item .acts button{padding:5px 9px; font-size:11px; border-radius:6px; border:1px solid var(--line); background:#fff; transition:.13s}
.lib-item .acts button:hover{border-color:#cfcdc4}
.lib-item .acts .del:hover{background:#f6ecea; border-color:var(--danger); color:var(--danger)}

/* recipe editor form */
.rec-editor{padding:18px 22px 26px}
.rec-editor h2{font-size:18px; font-family:var(--font-heading); margin-bottom:14px}
.form-row{margin-bottom:13px}
.form-row label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; outline:none;
}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--brand-coral)}
.form-row textarea{resize:vertical; min-height:50px; font-family:inherit}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
@media (max-width:560px){ .form-grid2,.form-grid3{grid-template-columns:1fr} }
.tag-edit{display:flex; flex-wrap:wrap; gap:6px}
.tag-edit .chip{font-size:11px; padding:3px 8px; cursor:pointer}
.img-upload-area{
  display:flex; align-items:center; gap:12px;
}
.img-preview{
  width:80px; height:80px; border-radius:10px; border:1px solid var(--line); overflow:hidden;
  display:grid; place-items:center; position:relative; flex:none; font-size:30px;
}
.img-preview img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.img-upload-area .file-btn{
  border:1px dashed var(--line); border-radius:8px; padding:8px 14px; font-size:12px; color:var(--muted);
  cursor:pointer; transition:.13s;
}
.img-upload-area .file-btn:hover{border-color:var(--brand-coral); color:var(--brand-dark)}
.macro-inputs{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.macro-input-group{border:1px solid var(--line); border-radius:8px; padding:10px}
.macro-input-group label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block}
.macro-input-group .fields{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.macro-input-group .field{display:flex; align-items:center; gap:4px}
.macro-input-group .field span{font-size:10px; color:var(--muted); white-space:nowrap}
.macro-input-group .field input{width:100%; padding:4px 6px; font-size:12px; border:1px solid var(--line); border-radius:5px}

/* ===================== 7-Day Plan Generator ===================== */
.week-modal-body{padding:0}
.week-config{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end}
.week-config h2{font-size:19px; font-family:var(--font-heading); width:100%; margin-bottom:4px}
.week-config .cfg{display:flex; flex-direction:column; gap:5px}
.week-config .cfg label{font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600}
.week-config .cfg select,.week-config .cfg input{border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; outline:none}
.week-config .meal-types{display:flex; gap:8px; flex-wrap:wrap}
.week-config .meal-types label{font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer}
.week-config .meal-types input{accent-color:var(--brand-dark); width:15px; height:15px}
.week-grid-wrap{padding:14px 20px; overflow-x:auto}
.week-grid{display:grid; gap:6px; min-width:920px}
.week-grid .wg-row{display:grid; grid-template-columns:110px repeat(7,1fr); gap:6px}
.week-grid .wg-head{
  font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;
  text-align:center; padding:5px;
}
.week-grid .wg-day-head{
  font-size:13px; font-weight:700; color:var(--brand-coral); text-align:center; padding:5px;
  border-bottom:2px solid var(--brand-coral);
}
.week-grid .wg-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--brand-dark); font-weight:700;
  display:flex; align-items:center; padding:5px 8px;
}
.week-cell{
  border:1px solid var(--line); border-radius:9px; padding:6px; min-height:120px; background:#fff;
  display:flex; flex-direction:column; gap:4px; transition:.13s; cursor:pointer; position:relative;
}
.week-cell:hover{border-color:var(--brand-coral); box-shadow:0 2px 8px rgba(212,150,125,.18)}
.week-cell.over{border-color:var(--brand-coral); background:var(--brand-soft)}
.week-cell.empty-cell{background:var(--bg); display:grid; place-items:center; color:#c0c5c0; font-size:18px; min-height:120px}
.week-cell .wc-meal{display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:1.3; height:100%}
.week-cell .wc-meal .week-thumb{
  width:100%; aspect-ratio:4/3; border-radius:7px; flex:none; overflow:hidden; position:relative;
  display:grid; place-items:center; font-size:28px;
}
.week-cell .wc-meal .week-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.week-cell .wc-meal .week-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.week-cell .wc-meal .week-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.week-cell .wc-meal .week-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.week-cell .wc-meal .week-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.week-cell .wc-meal b.wc-name{font-size:12px; font-weight:600; line-height:1.3; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.week-cell .wc-meal b.wc-name .wl{display:block}
.week-cell .wc-meal .wc-x{position:absolute; top:4px; right:4px; color:#fff; background:rgba(0,0,0,.35); border-radius:50%; width:20px; height:20px; display:grid; place-items:center; font-size:12px; flex:none; z-index:2}
.week-cell .wc-meal .wc-x:hover{color:#fff; background:rgba(0,0,0,.55)}
.week-actions{padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.week-day-totals{padding:0 24px 12px; font-size:11px; color:var(--muted)}
.week-day-totals .wdt-row{display:grid; grid-template-columns:110px repeat(7,1fr); gap:6px; margin-top:4px}
.week-day-totals .wdt-cell{text-align:center; padding:4px; font-size:12px}
.week-day-totals .wdt-label{font-weight:700; color:var(--brand-dark); font-size:12px}

/* Week meal picker grid */
.wk-pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; max-height:55vh; overflow-y:auto; padding:4px}
.wk-pick-card{cursor:pointer; border:1px solid var(--line); border-radius:9px; overflow:hidden; transition:.13s; background:#fff}
.wk-pick-card:hover{border-color:var(--brand-coral); box-shadow:0 2px 10px rgba(212,150,125,.2); transform:translateY(-1px)}
.wk-pick-thumb{position:relative; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center}
.wk-pick-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.wk-pick-thumb[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
.wk-pick-thumb[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
.wk-pick-thumb[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}
.wk-pick-thumb[data-type="snack"]{background:linear-gradient(140deg,#fbeef3,#f5dbe5)}
.wk-pick-name{font-size:12px; font-weight:600; padding:6px 8px 2px; line-height:1.3; color:var(--ink); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.wk-pick-meta{font-size:10px; color:var(--muted); padding:0 8px 8px}

/* Split view: two meals in one cell */
.week-cell .wc-split{display:flex; gap:3px; height:100%}
.week-cell .wc-split .wc-meal{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; font-size:11px; line-height:1.25; position:relative}
.week-cell .wc-split .wc-meal .week-thumb{width:100%; aspect-ratio:4/3; border-radius:5px; flex:none; overflow:hidden; position:relative; display:grid; place-items:center; font-size:22px}
.week-cell .wc-split .wc-meal .week-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.week-cell .wc-split .wc-meal b.wc-name{font-size:10.5px; font-weight:600; line-height:1.2; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
/* Serving size input */
.wc-serv-row{display:flex; align-items:center; gap:3px; font-size:10px; color:var(--muted); margin-top:2px}
.wc-serv-row label{white-space:nowrap}
.wc-serv-input{width:34px; border:1px solid var(--line); border-radius:4px; padding:1px 3px; font-size:10px; text-align:center; background:#fff; color:var(--ink)}
.wc-serv-input:focus{outline:none; border-color:var(--brand-coral)}
.wc-name-sm{font-size:10.5px !important}
/* Add-second button */
.wc-add2nd{position:absolute; bottom:3px; right:3px; z-index:2; width:20px; height:20px; border-radius:50%; background:var(--brand-soft); border:1px solid var(--brand-cream); display:grid; place-items:center; font-size:13px; color:var(--brand-coral); cursor:pointer; line-height:1}
.wc-add2nd:hover{background:var(--brand-coral); color:#fff}
/* Back button in picker */
.wk-pick-back{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--brand-dark); cursor:pointer; margin-bottom:10px; padding:5px 12px; border:1px solid var(--line); border-radius:8px; background:#fff}
.wk-pick-back:hover{border-color:var(--brand-coral); background:var(--brand-soft)}
/* Micronutrient selector */
.wk-micro-sel{display:flex; flex-wrap:wrap; gap:5px}
.wk-micro-sel label{font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff}
.wk-micro-sel input{accent-color:var(--brand-dark); width:14px; height:14px}
/* Micronutrient totals */
.week-day-totals .wdt-micro{font-size:10px; color:var(--muted)}
.week-day-totals .wdt-micro .wdt-cell{font-size:11px}

/* ===================== 讲义（屏幕隐藏，打印显示） ===================== */
#handout,#recipeSheet,#weekSheet{display:none}
#handout .h-page{padding:0 0 26px}

/* branding header */
#handout .h-head{
  display:flex; align-items:center; gap:16px; padding-bottom:16px; margin-bottom:22px;

}

#handout .h-note{margin-top:14px; background:var(--brand-soft); border-radius:9px; padding:14px 18px; font-size:20px; color:var(--brand-dark); border-left:3px solid var(--brand-coral); line-height:1.5}

#handout .h-day .cnt{font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body)}

#handout .h-photo{position:relative; aspect-ratio:5/3; overflow:hidden; display:grid; place-items:center}

#handout .h-mb .ing{font-size:16px; color:var(--muted); margin-top:5px; line-height:1.4}
#handout .h-mb .h-macros{margin-top:7px}
#handout .h-mb .h-macros .m-tag{font-size:15px; background:var(--brand-soft); color:var(--brand-dark); padding:4px 8px; border-radius:5px; font-weight:600; white-space:nowrap; display:inline-block}
#handout .h-focus{margin-top:6px; display:flex; gap:4px; flex-wrap:wrap}
#handout .h-focus .f-tag{font-size:9px; background:var(--brand-coral); color:#fff; padding:1px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:.3px}
#handout .h-recipes-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
#handout .h-recipe{break-inside:avoid; page-break-inside:avoid; border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:0}

#handout .h-recipe-photo .ph-emoji{width:68px; height:68px; font-size:36px}
#handout .h-recipe-photo[data-type="breakfast"]{background:linear-gradient(140deg,#fdf4e7,#f7e3c6)}
#handout .h-recipe-photo[data-type="lunch"]{background:linear-gradient(140deg,#eaf1ec,#d8e8dc)}
#handout .h-recipe-photo[data-type="dinner"]{background:linear-gradient(140deg,#e9f1f6,#d3e2ed)}

  .app,.topbar,#modal,#libModal,#weekModal,.screen-only{display:none !important}

  #recipeSheet .r-head{

  #recipeSheet .r-brand-text .cr{font-size:12px; color:var(--muted)}
  #recipeSheet .r-head h1{font-size:28px; margin:6px 0 3px; font-family:var(--font-heading); color:var(--brand-dark)}
  #recipeSheet .r-head .z{font-size:14px; color:var(--muted)}
  #recipeSheet .r-meta{display:flex; gap:16px; font-size:13px; color:var(--muted); margin:14px 0}
  #recipeSheet .two{display:grid; grid-template-columns:1fr 1.4fr; gap:26px; margin-top:18px}
  #recipeSheet .sec-t{font-size:12px}
  #recipeSheet .ing li,#recipeSheet .steps li{font-size:13px}
  #recipeSheet .why{background:#f2f6f3; border-left:3px solid var(--brand-coral); padding:10px 14px; font-size:13px; margin:14px 0; color:var(--brand-dark)}
  #recipeSheet .notes{background:#f7f6f3; padding:12px 14px; font-size:12px; margin-top:16px}
  #recipeSheet .r-macros{display:flex; gap:18px; margin-top:16px; font-size:13px; color:var(--muted)}
  #recipeSheet .r-macros b{color:var(--brand-dark)}
  #recipeSheet .r-foot{margin-top:24px; padding-top:12px; border-top:1px solid var(--brand-cream); font-size:11px; color:var(--muted); text-align:center}
  .h-page{break-after:page}
  .h-day-break{break-before:page}
  .h-first-day{break-before:avoid}

  /* 7-day plan print */
  #weekSheet{font-family:var(--font-body)}
  #weekSheet .ws-head{
    display:flex; align-items:center; gap:12px; padding-bottom:6px; margin-bottom:6px;
    border-bottom:2.5px solid var(--brand-coral);
  }
  #weekSheet .ws-logo{flex:none}
  #weekSheet .ws-logo img{height:40px; width:auto}
  #weekSheet .ws-brand-text .pn{font-size:15px; color:var(--brand-coral); font-weight:600; font-family:var(--font-heading)}
  #weekSheet .ws-title{font-size:20px; font-family:var(--font-heading); color:var(--brand-dark); margin:2px 0 1px}
  #weekSheet .ws-sub{font-size:11px; color:var(--muted)}
  #weekSheet .ws-grid{display:grid; gap:3px; width:100%; margin-top:6px}
  #weekSheet .ws-row{display:grid; grid-template-columns:80px repeat(7,1fr); gap:3px}
  #weekSheet .ws-dh{font-size:12px; font-weight:700; color:var(--brand-dark); text-align:center; padding:3px; border-bottom:2px solid var(--brand-cream); font-family:var(--font-heading)}
  #weekSheet .ws-ml{font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); font-weight:600; display:flex; align-items:center; padding:3px}
  #weekSheet .ws-cell{border:1px solid var(--line); border-radius:5px; padding:5px; min-height:156px; font-size:12px; line-height:1.3; break-inside:avoid; overflow:hidden; display:flex; flex-direction:column}
  #weekSheet .ws-cell .ws-img{position:relative; flex:1 1 0; min-height:0; overflow:hidden; border-radius:4px; margin-bottom:4px; display:grid; place-items:center}

  #weekSheet .ws-cell .ws-img .ph-emoji{font-size:28px}

  #weekSheet .ws-cell .ws-mm{font-size:10px; color:var(--muted); line-height:1.2; flex-shrink:0}

  #weekSheet .ws-totals .ws-tcell{text-align:center; padding:5px; color:var(--muted)}
  #weekSheet .ws-foot{margin-top:20px; padding-top:10px; border-top:1px solid var(--brand-cream); font-size:11px; color:var(--muted); text-align:center}
}
</style>

<body>

<!-- ===================== 应用界面 ===================== -->
<div class="topbar screen-only">
  <div class="brand"><b>Meal Idea Generator</b><span id="brandSub">餐食灵感生成器 · 原型</span></div>
  <div class="client-in">
    <label id="lblClient">客户</label>
    <input id="clientName" autocomplete="off">
  </div>
  <div class="grow"></div>
  <button class="btn" id="btnLib"></button>
  <button class="btn coral-btn" id="btnWeek"></button>
  <button class="btn" id="btnDemo"></button>

  <button class="btn" id="btnReset"></button>

  </button>
</div>

<div class="app screen-only">

  <!-- ---------- 左：偏好 ---------- -->
  <aside class="col col-side">
    <div class="card">
      <div class="card-h"><h3 id="tPrefs"></h3><span class="hint" id="tClickFilter"></span></div>

      <div class="fgroup">
        <div class="ftitle" id="tCarb"></div>
        <div class="seg" id="carbSeg">
          <button data-carb="any" id="tCarbAny"></button>
          <button data-carb="low" id="tCarbLow"></button>
          <button data-carb="moderate" id="tCarbMod"></button>
        </div>
      </div>

      <div class="fgroup">
        <div class="ftitle" id="tFocus"></div>
        <div class="chips" id="focusChips"></div>
      </div>

      <div class="fgroup">
        <div class="ftitle" id="tDiet"></div>
        <div class="chips" id="dietChips"></div>
      </div>

      <div class="fgroup">
        <div class="ftitle" id="tAvoid"></div>
        <div class="chips" id="avoidChips"></div>
      </div>

const FOCUS_TAGS = ['gut-healing','asian','quick-easy','no-cook','batch-cook','high-protein'];
const DIET_TAGS  = ['vegetarian','vegan','gluten-free'];
const AVOID_TAGS = ['dairy','gluten','nuts','egg','soy','fish','shellfish','sesame'];

const RECIPE_KEY = 'mig_recipes_v2';
const WEEK_KEY   = 'mig_week_v1';

/* 默认语言：跟随浏览器 */
function detectLang(){
  const n = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  return n.startsWith('zh') ? 'zh' : 'en';
}

const state = {
  lang: detectLang(),
  carb:'any', focus:[], diet:[], avoid:[],
  type:'all', addDay:1,
  day1:[], day2:[], day3:[],
  day1Title:'', day2Title:'', day3Title:'',
  clientName:'', clientNote:'', includeRecipes:true, showMacros:false
};

/* 7-day plan state */
const WEEK_SLOTS = ['breakfast','morning-snack','lunch','afternoon-snack','dinner','night-snack'];
// Map display slot -> meal-library type (all snack variants draw from snack pool)
const SLOT_LIB_TYPE = { 'morning-snack':'snack', 'afternoon-snack':'snack', 'night-snack':'snack' };

const weekState = {
  mealTypes: ['breakfast','morning-snack','lunch','afternoon-snack','dinner','night-snack'],
  carb:'any', focus:[], diet:[], avoid:[],
  clientName:'',
  repeatStrategy:'natural',
  showMacros: true,
  includeRecipes: false,
  notes: '',
  showMicros: false,
  microSelection: ['calcium','iron','sodium','potassium','fibre','vitaminC'],
  days: [[],[],[],[],[],[],[]]
};

/* --- Week plan entry helpers: supports both old (string id) and new ({id, servings}) formats --- */
function entryId(e){ return typeof e === 'string' ? e : e.id; }
function entryServ(e){ return typeof e === 'string' ? 1 : (e.servings || 1); }
function mkEntry(id){ return { id, servings: 1 }; }

const t = () => I18N[state.lang];
const c = m => m[state.lang];
const altName = m => m[state.lang === 'zh' ? 'en' : 'zh'].name;

/* ---------- 用户菜品数据（自定义/覆盖/删除） ---------- */
function loadUserData(){
  try{
    const raw = localStorage.getItem(RECIPE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { custom: [], overrides: {}, deleted: [] };
}
function saveUserData(d){
  try{ localStorage.setItem(RECIPE_KEY, JSON.stringify(d)); }catch(e){}
}

/* 合并所有菜品：内置 + 覆盖 + 自定义，排除已删除 + 注入微量营养素 */
let ALL_MEALS = [];
function rebuildMeals(){
  const ud = loadUserData();
  ALL_MEALS = BASE_MEALS
    .map(m => {
      const merged = ud.overrides[m.id] ? Object.assign({}, m, ud.overrides[m.id]) : m;
      // Inject micronutrient data from MICROS lookup if not already present
      if(!merged.micros && typeof MICROS !== 'undefined' && MICROS[merged.id]){
        merged.micros = MICROS[merged.id];
      }
      return merged;
    })
    .filter(m => !ud.deleted.includes(m.id))
    .concat(ud.custom.map(m => {
      const c = {...m, _custom: true};
      if(!c.micros && typeof MICROS !== 'undefined' && MICROS[c.id]) c.micros = MICROS[c.id];
      return c;
    }));
}
rebuildMeals();

/* ---------- 持久化 ---------- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveWeek(){ try{ localStorage.setItem(WEEK_KEY, JSON.stringify(weekState)); }catch(e){} }
function loadWeek(){
  try{
    const raw = localStorage.getItem(WEEK_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.assign(weekState, parsed);
      // Migrate: convert old string-id entries to {id, servings} objects
      if(weekState.days && Array.isArray(weekState.days)){
        weekState.days = weekState.days.map(day=>{
          if(!Array.isArray(day)) return [];
          return day.map(e => typeof e === 'string' ? mkEntry(e) : e);
        });
      }
      // Ensure new fields exist
      if(!weekState.microSelection) weekState.microSelection = ['calcium','iron','sodium','potassium','fibre','vitaminC'];
      if(typeof weekState.showMicros === 'undefined') weekState.showMicros = false;
    }
  }catch(e){}
}

/* ---------- 过滤逻辑 ---------- */
function matches(m, carb, focus, diet, avoid){
  carb = carb || state.carb; focus = focus || state.focus;
  diet = diet || state.diet; avoid = avoid || state.avoid;
  if(carb !== 'any' && m.carb !== carb) return false;
  for(const x of focus){ if(!m.tags.includes(x)) return false; }
  for(const x of diet){ if(!m.tags.includes(x)) return false; }
  for(const x of avoid){ if(m.contains.includes(x)) return false; }
  return true;
}
function filtered(){ return ALL_MEALS.filter(m=>matches(m)); }

/* ---------- 工具 ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x])); }
function byId(id){ return ALL_MEALS.find(m=>m.id===id); }

/* ---------- 宏量营养素计算 ---------- */
function macroCalories(m, serv){
  if(!m.macros) return 0;
  serv = serv || 1;
  return ((m.macros.protein.g||0)*4 + (m.macros.fat.g||0)*9 + (m.macros.netCarbs.g||0)*4) * serv;
}
function dayMacros(entries){
  const tot = { protein:0, fat:0, netCarbs:0, calories:0 };
  entries.forEach(e=>{
    const m = byId(entryId(e)); if(!m || !m.macros) return;
    const serv = entryServ(e);
    tot.protein += (m.macros.protein.g||0)*serv;
    tot.fat += (m.macros.fat.g||0)*serv;
    tot.netCarbs += (m.macros.netCarbs.g||0)*serv;
    tot.calories += macroCalories(m, serv);
  });
  return tot;
}
/* ---------- 微量营养素计算 ---------- */
const MICRO_KEYS = ['calcium','iron','sodium','potassium','fibre','vitaminC'];
function dayMicros(entries){
  const tot = {};
  MICRO_KEYS.forEach(k=>tot[k]=0);
  entries.forEach(e=>{
    const m = byId(entryId(e)); if(!m || !m.micros) return;
    const serv = entryServ(e);
    MICRO_KEYS.forEach(k=>{ tot[k] += (m.micros[k]||0)*serv; });
  });
  return tot;
}
function macroHTML(m){
  if(!m.macros) return '';
  const L = t();
  const colors = { protein:'#495a58', fat:'#d4967d', netCarbs:'#8a9b8e', calories:'#b89a7a' };
  const labels = { protein: L.protein, fat: L.fat, netCarbs: L.netCarbs, calories: L.calories };
  const cal = Math.round(macroCalories(m));
  const data = { protein:m.macros.protein, fat:m.macros.fat, netCarbs:m.macros.netCarbs, calories:{g:cal,pct:''} };
  return `<div class="macro-grid">
    ${['protein','fat','netCarbs','calories'].map(k=>{
      const v = data[k];
      return `<div class="macro-cell">
        <div class="g">${v.g}<span>${k==='calories'?'':L.grams}</span></div>
        <div class="lbl">${labels[k]}</div>
        ${k==='calories'?'':`<div class="pct">${v.pct}%</div>`}
        ${k==='calories'?'':`<div class="macro-bar"><div class="fill" style="width:${v.pct}%;background:${colors[k]}"></div></div>`}
      </div>`;
    }).join('')}
  </div>`;
}
function macroTagsHTML(m){
  if(!m.macros) return '';
  const L = t();
  const cal = Math.round(macroCalories(m));
  return `<div class="h-macros"><span class="m-tag">${L.protein} ${m.macros.protein.g}${L.grams} · ${L.fat} ${m.macros.fat.g}${L.grams} · ${L.carbs} ${m.macros.netCarbs.g}${L.grams} · ${L.calories} ${cal}</span></div>`;
}

function wrapName(name){
  // Split long names into 1-2 word lines for compact display in week cells
  const words = name.trim().split(/\s+/);
  if(words.length <= 2) return esc(name);
  const lines = [];
  for(let i=0;i<words.length;i+=2){
    lines.push(words.slice(i,i+2).join(' '));
  }
  return lines.map(w=>`<span class="wl">${esc(w)}</span>`).join('');
}
function tagHTML(m){
  const L = t();
  const out = [];
  if(m.tags.includes('gut-healing')) out.push(`<span class="tag gut">${L.tagShort['gut-healing']}</span>`);
  if(m.tags.includes('asian')) out.push(`<span class="tag asian">${L.tagShort['asian']}</span>`);
  m.tags.filter(x=>!['gut-healing','asian'].includes(x)).slice(0,2)
    .forEach(x=>out.push(`<span class="tag">${L.tag[x]||x}</span>`));
  return `<div class="tags">${out.join('')}</div>`;
}

function autoFill(day){
  const L = t();
  const pool = filtered();
  const pick = (type,n)=>{
    const arr = pool.filter(m=>m.type===type);
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr.slice(0,n).map(m=>m.id);
  };
  const ids = [...pick('breakfast',1),...pick('lunch',1),...pick('dinner',1),...pick('snack',1)];
  if(!ids.length){ toast(L.tNoMatch); return; }
  state['day'+day] = ids; save(); renderAll();
  toast(L.tFilled(day));
}

  buildHandout();
  document.body.classList.remove('mode-recipe','mode-week');

/* ---------- 轻提示 ---------- */
let toastTimer;
function toast(msg){
  let el = $('#toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2421;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(-4px)'; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%)'; }, 1900);
}

/* ============================================================

let editingId = null; // null = list view, id = editing

function openLibModal(){
  editingId = null;
  renderLibModal();
  $('#libModal').classList.add('open');
}
function closeLibModal(){ $('#libModal').classList.remove('open'); }

function renderLibModal(){
  const L = t();
  if(editingId === 'new' || (editingId && editingId !== 'new')){
    renderRecipeEditor(editingId);
    return;
  }
  // list view
  const ud = loadUserData();
  const allMeals = ALL_MEALS.slice().sort((a,b)=>{
    const ty = ['breakfast','lunch','dinner','snack'];
    const dt = ty.indexOf(a.type) - ty.indexOf(b.type);
    if(dt) return dt;
    return c(a).name.localeCompare(c(b).name);
  });
  $('#libSheet').innerHTML = `
    <button class="modal-close" data-lib-close>✕</button>
    <div class="lib-modal-body">
      <div class="lib-toolbar">
        <h2>${L.libTitle}</h2>
        <input class="lib-search" id="libSearch" placeholder="${L.libSearch}" value="">
        <button class="btn brand-btn" data-lib-new>${L.libAdd}</button>
      </div>
      <div class="lib-list" id="libList">
        ${allMeals.map(m=>{
          const d = c(m);
          return `<div class="lib-item">
            <div class="lib-thumb" data-type="${m.type}">
              ${m.img ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">` : `<span class="ph-emoji" style="font-size:22px;width:auto;height:auto;background:none;box-shadow:none">${m.emoji}</span>`}
            </div>
            <div class="info">
              <b>${esc(d.name)} ${m._custom?'<span style="color:var(--brand-coral);font-size:10px">✎</span>':''}</b>
              <span>${L.type[m.type]} · ${L.carbName[m.carb]} · ${esc(d.time)}</span>
            </div>
            <div class="acts">
              <button data-lib-edit="${m.id}">${L.libEdit}</button>
              <button class="del" data-lib-del="${m.id}">${L.libDelete}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  $$('#libSheet [data-lib-close]').forEach(b=>b.onclick=closeLibModal);
  $('#libSheet [data-lib-new]').onclick = ()=>{ editingId='new'; renderLibModal(); };
  $$('#libSheet [data-lib-edit]').forEach(b=>b.onclick=()=>{ editingId=b.dataset.libEdit; renderLibModal(); });
  $$('#libSheet [data-lib-del]').forEach(b=>b.onclick=()=>{
    if(!confirm(L.libConfirmDel)) return;
    deleteRecipe(b.dataset.libDel);
  });
  const search = $('#libSearch');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.toLowerCase();
    $$('#libSheet .lib-item').forEach(el=>{
      const txt = el.textContent.toLowerCase();
      el.style.display = txt.includes(q) ? '' : 'none';
    });
  });
}

function saveRecipeFromForm(origMeal){
  const L = t();
  const val = id => { const el = $('#'+id); return el ? el.value.trim() : ''; };
  const lines = id => { const el = $('#'+id); return el ? el.value.split('\n').map(s=>s.trim()).filter(Boolean) : []; };

  const nameZh = val('re-name-zh');
  const nameEn = val('re-name-en');
  if(!nameZh && !nameEn){ toast('Name required'); return; }

  const tags = $$('#re-tags .chip.on').map(b=>b.dataset.tag);
  const contains = $$('#re-contains .chip.on').map(b=>b.dataset.cont);
  const focus = lines('re-focus');

  const imgPrev = $('#re-img-preview');
  const uploadedImg = imgPrev ? imgPrev.dataset.uploaded : null;
  const existingImg = imgPrev && imgPrev.querySelector('img') ? imgPrev.querySelector('img').getAttribute('src') : null;

  // Determine image: uploaded > existing > null
  let img = uploadedImg || existingImg || null;
  // If it was an existing images/ path and no upload, keep the filename
  if(img && !uploadedImg && !/^data:/.test(img) && !img.startsWith('images/')){
    // it's a filename from images/ folder
    img = img.replace(/^images\//,'');
  }

  const updated = {
    type: val('re-type') || 'breakfast',
    carb: val('re-carb') || 'moderate',
    emoji: val('re-emoji') || '🍽',
    tags, contains, focus,
    img: img || null,
    en: {
      name: nameEn || nameZh,
      time: val('re-time-en') || val('re-time-zh') || '',
      servings: val('re-serv-en') || val('re-serv-zh') || '1',
      why: val('re-why-en'),
      ingredients: lines('re-ing-en').length ? lines('re-ing-en') : lines('re-ing-zh'),
      steps: lines('re-steps-en').length ? lines('re-steps-en') : lines('re-steps-zh'),
      notes: val('re-notes-en')
    },
    zh: {
      name: nameZh || nameEn,
      time: val('re-time-zh') || val('re-time-en') || '',
      servings: val('re-serv-zh') || val('re-serv-en') || '1',
      why: val('re-why-zh'),
      ingredients: lines('re-ing-zh').length ? lines('re-ing-zh') : lines('re-ing-en'),
      steps: lines('re-steps-zh').length ? lines('re-steps-zh') : lines('re-steps-en'),
      notes: val('re-notes-zh')
    },
    macros: {
      protein: { g:+val('re-p-g')||0, pct:+val('re-p-pct')||0 },
      fat: { g:+val('re-f-g')||0, pct:+val('re-f-pct')||0 },
      netCarbs: { g:+val('re-c-g')||0, pct:+val('re-c-pct')||0 }
    }
  };

  const ud = loadUserData();

  if(origMeal._custom || ud.custom.find(r=>r.id===origMeal.id)){
    // Update custom recipe
    const idx = ud.custom.findIndex(r=>r.id===origMeal.id);
    if(idx >= 0){
      ud.custom[idx] = { ...ud.custom[idx], ...updated };
    } else {
      ud.custom.push({ id: origMeal.id, ...updated });
    }
  } else {
    // Override built-in recipe
    ud.overrides[origMeal.id] = updated;
  }

  saveUserData(ud);
  rebuildMeals();
  editingId = null;
  renderLibModal();
  renderAll();
  toast(L.libSaved);
}

function deleteRecipe(id){
  const L = t();
  const ud = loadUserData();
  const isCustom = ud.custom.find(r=>r.id===id);
  if(isCustom){
    ud.custom = ud.custom.filter(r=>r.id!==id);
  } else {
    ud.deleted.push(id);
    delete ud.overrides[id];
  }
  saveUserData(ud);
  rebuildMeals();
  renderLibModal();
  renderAll();
  toast(L.libDeleted);
}

/* ============================================================
   7-DAY MEAL PLAN GENERATOR
   ============================================================ */
function openWeekModal(){
  renderWeekModal();
  $('#weekModal').classList.add('open');
}
function closeWeekModal(){ $('#weekModal').classList.remove('open'); }

function renderWeekModal(){
  const L = t();
  const dayLabels = L.weekDays;
  // Always show grid — even when empty (Feature 1: empty cells with "+")
  const MTYPES = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const usedSnackIds = weekState.days.map(()=>new Set());

  // Build grid — ONE cell per (day, slot), with up to 2 meals (Feature 4: split view)
  const gridHTML = MTYPES.map(mt=>{
    const libType = SLOT_LIB_TYPE[mt] || mt;
    const cells = weekState.days.map((dayArr,di)=>{
      // Find entries of this slot type in day
      const matchingEntries = dayArr.filter(e=>{
        const m = byId(entryId(e));
        return m && m.type===libType && !usedSnackIds[di].has(m.id);
      });
      const isSnackSlot = SLOT_LIB_TYPE[mt] && SLOT_LIB_TYPE[mt]!==mt;
      // Max 2 meals per cell (Feature 4); snacks still 1 per variant slot
      const maxPerCell = isSnackSlot ? 1 : 2;
      const entries = matchingEntries.slice(0, maxPerCell);
      entries.forEach(e=>usedSnackIds[di].add(entryId(e)));

      if(!entries.length){
        return `<div class="week-cell empty-cell" data-wday="${di}" data-wtype="${mt}">+</div>`;
      }

      // Render single or split view
      const mealsHTML = entries.map((e,mi)=>{
        const m = byId(entryId(e)); if(!m) return '';
        const d = c(m);
        const serv = entryServ(e);
        const thumb = m.img
          ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">`
          : `<span style="font-size:${entries.length>1?'22px':'28px'}">${m.emoji}</span>`;
        const nameSize = entries.length>1 ? 'wc-name-sm' : '';
        return `<div class="wc-meal" data-wmid="${m.id}" data-wentry="${mi}">
          <div class="week-thumb" data-type="${m.type}">${thumb}</div>
          <b class="wc-name ${nameSize}">${wrapName(d.name)}</b>
          <div class="wc-serv-row">
            <label>${L.weekServings}</label>
            <input class="wc-serv-input" type="number" min="0.5" step="0.5" value="${serv}" data-wc-serv="${di}:${mt}:${mi}">
          </div>
          <button class="wc-x" data-wc-del="${di}:${mt}:${entryId(e)}">✕</button>
          ${entries.length===1 ? `<button class="wc-add2nd" data-wc-add2="${di}:${mt}">+</button>` : ''}
        </div>`;
      }).join('');

      const inner = entries.length>1 ? `<div class="wc-split">${mealsHTML}</div>` : mealsHTML;
      return `<div class="week-cell" data-wday="${di}" data-wtype="${mt}" data-wmcount="${entries.length}">${inner}</div>`;
    }).join('');
    return `<div class="wg-row">
      <div class="wg-label">${L.type[mt]}</div>
      ${cells}
    </div>`;
  }).join('');

  const dayHeaders = `<div class="wg-row">
    <div class="wg-head"></div>
    ${dayLabels.map((dl,di)=>{
      return `<div class="wg-day-head">${esc(dl)}</div>`;
    }).join('')}
  </div>`;

  // Totals row — macros always; micronutrients when enabled (Feature 6)
  const totalsHTML = (() => {
    const rows = ['protein','fat','netCarbs'].map(k=>{
      const cells = weekState.days.map(dayArr=>{
        const dm = dayMacros(dayArr);
        const v = Math.round(dm[k]);
        return `<div class="wdt-cell">${v}g</div>`;
      }).join('');
      const label = k==='protein'?L.protein : k==='fat'?L.fat : L.netCarbs;
      return `<div class="wdt-row"><div class="wdt-label">${label}</div>${cells}</div>`;
    });
    const calCells = weekState.days.map(dayArr=>{
      const dm = dayMacros(dayArr);
      return `<div class="wdt-cell">${Math.round(dm.calories)}</div>`;
    }).join('');
    rows.push(`<div class="wdt-row"><div class="wdt-label">${L.weekCalories}</div>${calCells}</div>`);
    // Micronutrient rows (Feature 6)
    if(weekState.showMicros){
      const microRows = weekState.microSelection.map(mk=>{
        const cells = weekState.days.map(dayArr=>{
          const dm = dayMicros(dayArr);
          return `<div class="wdt-cell wdt-micro">${Math.round(dm[mk])}${L.microUnit[mk]}</div>`;
        }).join('');
        return `<div class="wdt-row wdt-micro"><div class="wdt-label">${L.microLabels[mk]}</div>${cells}</div>`;
      });
      rows.push(...microRows);
    }
    return `<div class="week-day-totals">
      <div style="font-weight:600;font-size:10px;color:var(--brand-dark);margin-bottom:4px">${L.weekDayTotals}</div>
      ${rows.join('')}
    </div>`;
  })();

  // Config area — add micronutrient selector (Feature 6)
  const cfgHTML = `
    <div class="week-config">
      <h2>${L.weekTitle}</h2>
      <div class="cfg">
        <label>${L.weekClientName}</label>
        <input id="wk-client" value="${esc(weekState.clientName)}" placeholder="${L.weekClientPh}" style="width:130px">
      </div>
      <div class="cfg">
        <label>${L.weekCarb}</label>
        <select id="wk-carb">
          <option value="any" ${weekState.carb==='any'?'selected':''}>${L.weekAny}</option>
          <option value="low" ${weekState.carb==='low'?'selected':''}>${L.carbName.low}</option>
          <option value="moderate" ${weekState.carb==='moderate'?'selected':''}>${L.carbName.moderate}</option>
        </select>
      </div>
      <div class="cfg">
        <label>${L.weekMealTypes}</label>
        <div class="meal-types">
          ${WEEK_SLOTS.map(mt=>`<label><input type="checkbox" data-wk-mt="${mt}" ${weekState.mealTypes.includes(mt)?'checked':''}>${L.type[mt]}</label>`).join('')}
        </div>
      </div>
      <div class="cfg">
        <label>${L.weekRepeatB}</label>
        <select id="wk-repeat" style="width:110px">
          <option value="natural" ${weekState.repeatStrategy==='natural'?'selected':''}>${L.weekStrategyA}</option>
          <option value="different" ${weekState.repeatStrategy==='different'?'selected':''}>${L.weekStrategyB}</option>

          <label><input type="checkbox" id="wk-inclrecipes" ${weekState.includeRecipes?'checked':''}>${L.weekIncludeRecipes}</label>
          <label><input type="checkbox" id="wk-showmicros" ${weekState.showMicros?'checked':''}>${L.weekMicros}</label>

        <label>${L.weekMicroDisplay}</label>
        <div class="wk-micro-sel">
          ${MICRO_KEYS.map(mk=>`<label><input type="checkbox" data-wk-micro="${mk}" ${weekState.microSelection.includes(mk)?'checked':''}>${L.microLabels[mk]}</label>`).join('')}

      </div>` : ''}

        <textarea id="wk-notes" rows="2" placeholder="${L.weekNotesPh}" style="width:100%;max-width:460px;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;resize:vertical">${esc(weekState.notes||'')}</textarea>
      </div>
    </div>
  `;

  // Focus/diet/avoid chips
  const filterHTML = `
    <div style="padding:10px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap">
      <div><div class="ftitle" style="margin-bottom:5px">${L.weekFocus}</div>
        <div class="tag-edit">${FOCUS_TAGS.map(x=>`<button class="chip ${weekState.focus.includes(x)?'on':''}" data-wk-focus="${x}">${L.tag[x]}</button>`).join('')}</div>
      </div>
      <div><div class="ftitle" style="margin-bottom:5px">${L.weekDiet}</div>
        <div class="tag-edit">${DIET_TAGS.map(x=>`<button class="chip ${weekState.diet.includes(x)?'on':''}" data-wk-diet="${x}">${L.tag[x]}</button>`).join('')}</div>
      </div>
      <div><div class="ftitle" style="margin-bottom:5px">${L.weekAvoid}</div>
        <div class="tag-edit">${AVOID_TAGS.map(x=>`<button class="chip ${weekState.avoid.includes(x)?'on warn':''}" data-wk-avoid="${x}">${L.contains[x]}</button>`).join('')}</div>
      </div>
    </div>
  `;

  // Always show grid (Feature 1)
  $('#weekSheetModal').innerHTML = `
    <button class="modal-close" data-week-close>✕</button>
    ${cfgHTML}
    ${filterHTML}
    <div class="week-grid-wrap">
      <div class="week-grid">${dayHeaders}${gridHTML}</div>
      ${totalsHTML}
      <div style="font-size:10px;color:var(--muted);padding:4px 0">${L.weekDragHint}</div>
    </div>
    <div class="week-actions">
      <button class="btn" id="wk-clear">${L.weekClear}</button>
      <button class="btn primary" id="wk-generate">${L.weekGenerate}</button>
      <button class="btn coral-btn" id="wk-export">${L.weekExport}</button>
    </div>
  `;

  // Bind events
  $$('#weekSheetModal [data-week-close]').forEach(b=>b.onclick=closeWeekModal);
  $('#wk-generate').onclick = ()=>generateWeekPlan();
  $('#wk-clear').onclick = ()=>{
    weekState.days = [[],[],[],[],[],[],[]]; saveWeek(); renderWeekModal();
    toast(L.weekCleared);
  };
  $('#wk-export').onclick = ()=>exportWeekPDF();
  const wkClient = $('#wk-client');
  if(wkClient) wkClient.addEventListener('input', e=>{ weekState.clientName=e.target.value; saveWeek(); });
  const wkCarb = $('#wk-carb');
  if(wkCarb) wkCarb.addEventListener('change', e=>{ weekState.carb=e.target.value; saveWeek(); });
  const wkRepeat = $('#wk-repeat');
  if(wkRepeat) wkRepeat.addEventListener('change', e=>{ weekState.repeatStrategy=e.target.value; saveWeek(); });
  const wkShowMacros = $('#wk-showmacros');
  if(wkShowMacros) wkShowMacros.addEventListener('change', e=>{ weekState.showMacros=e.target.checked; saveWeek(); });
  const wkInclRecipes = $('#wk-inclrecipes');
  if(wkInclRecipes) wkInclRecipes.addEventListener('change', e=>{ weekState.includeRecipes=e.target.checked; saveWeek(); });
  const wkShowMicros = $('#wk-showmicros');
  if(wkShowMicros) wkShowMicros.addEventListener('change', e=>{ weekState.showMicros=e.target.checked; saveWeek(); renderWeekModal(); });
  const wkNotes = $('#wk-notes');
  if(wkNotes) wkNotes.addEventListener('input', e=>{ weekState.notes=e.target.value; saveWeek(); });

  // Micronutrient selection toggles (Feature 6)
  $$('#weekSheetModal [data-wk-micro]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const mk = cb.dataset.wkMicro;
      if(cb.checked && !weekState.microSelection.includes(mk)) weekState.microSelection.push(mk);
      else weekState.microSelection = weekState.microSelection.filter(x=>x!==mk);
      saveWeek(); renderWeekModal();
    });
  });

  $$('#weekSheetModal [data-wk-mt]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const mt = cb.dataset.wkMt;
      if(cb.checked && !weekState.mealTypes.includes(mt)) weekState.mealTypes.push(mt);
      else weekState.mealTypes = weekState.mealTypes.filter(x=>x!==mt);
      saveWeek(); renderWeekModal();
    });
  });
  const wkToggle = (attr, key) => {
    $$('#weekSheetModal ['+attr+']').forEach(b=>b.onclick=()=>{
      const v = b.getAttribute(attr);
      weekState[key] = weekState[key].includes(v) ? weekState[key].filter(x=>x!==v) : [...weekState[key], v];
      saveWeek(); renderWeekModal();
    });
  };
  wkToggle('data-wk-focus','focus');
  wkToggle('data-wk-diet','diet');
  wkToggle('data-wk-avoid','avoid');

  // Cell click - open picker (Feature 2: pass replace info for populated cells)
  $$('#weekSheetModal .week-cell').forEach(cell=>{
    cell.addEventListener('click', e=>{
      if(e.target.closest('[data-wc-del]')) return;
      if(e.target.closest('[data-wc-serv]')) return;
      if(e.target.closest('[data-wc-add2]')) return;
      const di = +cell.dataset.wday;
      const mt = cell.dataset.wtype;
      const mealCount = +cell.dataset.wmcount || 0;
      // If cell has meals, pass replace mode for the first meal
      if(mealCount > 0){
        openWeekCellPicker(di, mt, {mode:'replace', entryIdx:0});
      } else {
        openWeekCellPicker(di, mt, {mode:'add'});
      }
    });
  });

  // Add second meal button (Feature 4)
  $$('#weekSheetModal [data-wc-add2]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const [di, mt] = b.dataset.wcAdd2.split(':');
      openWeekCellPicker(+di, mt, {mode:'add-second'});
    };
  });

  // Serving size change (Feature 5) — update without full re-render
  $$('#weekSheetModal [data-wc-serv]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const [di, mt, mi] = inp.dataset.wcServ.split(':');
      const libType = SLOT_LIB_TYPE[mt] || mt;
      const matching = weekState.days[+di].filter(ex=>{
        const m = byId(entryId(ex));
        return m && m.type === libType;
      });
      const entry = matching[+mi];
      if(entry){
        const val = parseFloat(e.target.value);
        entry.servings = (isNaN(val) || val < 0.5) ? 1 : val;
        saveWeek();
        updateWeekTotalsOnly();
      }
    });
  });

  // Delete from cell (updated for new data model)
  $$('#weekSheetModal [data-wc-del]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const [di, mt, mid] = b.dataset.wcDel.split(':');
      weekState.days[+di] = weekState.days[+di].filter(ex=>entryId(ex)!==mid);
      saveWeek(); renderWeekModal();
    };
  });

  // Drag and drop (updated for new data model)
  $$('#weekSheetModal .week-cell').forEach(cell=>{
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('over'); });
    cell.addEventListener('dragleave', ()=>cell.classList.remove('over'));
    cell.addEventListener('drop', e=>{
      e.preventDefault(); cell.classList.remove('over');
      const data = e.dataTransfer.getData('text/plain');
      const targetDay = +cell.dataset.wday;
      if(data.startsWith('weekmove:')){
        const [_, fromDay, fromType, mid] = data.split(':');
        // Remove from source
        weekState.days[+fromDay] = weekState.days[+fromDay].filter(ex=>entryId(ex)!==mid);
        // Add to target
        if(!weekState.days[targetDay].some(ex=>entryId(ex)===mid)) weekState.days[targetDay].push(mkEntry(mid));
        saveWeek(); renderWeekModal();
      } else {
        // Adding from library
        const mid = data;
        if(!weekState.days[targetDay].some(ex=>entryId(ex)===mid)) weekState.days[targetDay].push(mkEntry(mid));
        saveWeek(); renderWeekModal();
      }
    });
  });
  // Make meals draggable within grid
  $$('#weekSheetModal .wc-meal').forEach(mealEl=>{
    const cell = mealEl.closest('.week-cell');
    mealEl.setAttribute('draggable','true');
    mealEl.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', `weekmove:${cell.dataset.wday}:${cell.dataset.wtype}:${mealEl.dataset.wmid}`);
    });
  });
}

// Update only the totals section (Feature 5: avoid losing input focus on serving size change)
function updateWeekTotalsOnly(){
  const L = t();
  const totalsEl = $('#weekSheetModal .week-day-totals');
  if(!totalsEl) return;
  const rows = ['protein','fat','netCarbs'].map(k=>{
    const cells = weekState.days.map(dayArr=>{
      const dm = dayMacros(dayArr);
      const v = Math.round(dm[k]);
      return `<div class="wdt-cell">${v}g</div>`;
    }).join('');
    const label = k==='protein'?L.protein : k==='fat'?L.fat : L.netCarbs;
    return `<div class="wdt-row"><div class="wdt-label">${label}</div>${cells}</div>`;
  });
  const calCells = weekState.days.map(dayArr=>{
    const dm = dayMacros(dayArr);
    return `<div class="wdt-cell">${Math.round(dm.calories)}</div>`;
  }).join('');
  rows.push(`<div class="wdt-row"><div class="wdt-label">${L.weekCalories}</div>${calCells}</div>`);
  if(weekState.showMicros){
    weekState.microSelection.forEach(mk=>{
      const cells = weekState.days.map(dayArr=>{
        const dm = dayMicros(dayArr);
        return `<div class="wdt-cell wdt-micro">${Math.round(dm[mk])}${L.microUnit[mk]}</div>`;
      }).join('');
      rows.push(`<div class="wdt-row wdt-micro"><div class="wdt-label">${L.microLabels[mk]}</div>${cells}</div>`);
    });
  }
  totalsEl.innerHTML = `<div style="font-weight:600;font-size:10px;color:var(--brand-dark);margin-bottom:4px">${L.weekDayTotals}</div>${rows.join('')}`;
}

function openWeekCellPicker(dayIdx, mealType, opts){
  const L = t();
  opts = opts || {mode:'add'};
  const libType = SLOT_LIB_TYPE[mealType] || mealType;
  const pool = ALL_MEALS.filter(m=>m.type===libType && matches(m, weekState.carb, weekState.focus, weekState.diet, weekState.avoid));
  if(!pool.length){ toast(L.tNoMatch); return; }

  // Title depends on mode (Feature 2: replace vs add)
  let title;
  if(opts.mode === 'replace') title = L.weekReplaceMeal + ' — ' + L.type[mealType] + ' — ' + L.weekDays[dayIdx];
  else if(opts.mode === 'add-second') title = L.weekAddSecond + ' — ' + L.type[mealType] + ' — ' + L.weekDays[dayIdx];
  else title = L.type[mealType] + ' — ' + L.weekDays[dayIdx];

  // Grid picker with large images
  const grid = pool.slice(0, 24).map(m=>{
    const d = c(m);
    return `<div class="wk-pick-card" data-wk-pick="${m.id}">
      <div class="wk-pick-thumb" data-type="${m.type}">
        ${m.img ? `<img src="${imgSrc(m)}" alt="" onerror="this.remove()">` : `<span style="font-size:32px">${m.emoji}</span>`}
      </div>
      <div class="wk-pick-name">${esc(d.name)}</div>
      <div class="wk-pick-meta">${esc(d.time)} · ${esc(d.servings)}${L.servingsUnit}</div>
    </div>`;
  }).join('');

  $('#weekSheetModal').innerHTML = `
    <button class="modal-close" data-week-close>✕</button>
    <div style="padding:16px 20px">
      <button class="wk-pick-back" data-wk-back>&#8592; ${L.weekBack}</button>
      <h2 style="font-family:var(--font-heading);font-size:16px;margin-bottom:12px">${title}</h2>
      <div class="wk-pick-grid">${grid || `<div class="empty">${L.empty}</div>`}</div>
    </div>
  `;

  // Feature 3: close/back returns to week plan grid (NOT closeWeekModal)
  $$('#weekSheetModal [data-week-close]').forEach(b=>b.onclick=()=>{ renderWeekModal(); });
  $$('#weekSheetModal [data-wk-back]').forEach(b=>b.onclick=()=>{ renderWeekModal(); });

  // Pick a meal — behavior depends on mode (Feature 2 + Feature 4)
  $$('#weekSheetModal [data-wk-pick]').forEach(el=>el.onclick=()=>{
    const mid = el.dataset.wkPick;
    const dayArr = weekState.days[dayIdx];

    if(opts.mode === 'replace'){
      // Find the entry to replace (by type + index)
      const libType2 = SLOT_LIB_TYPE[mealType] || mealType;
      const matching = dayArr.filter(ex=>{
        const m = byId(entryId(ex));
        return m && m.type === libType2;
      });
      const targetEntry = matching[opts.entryIdx || 0];
      if(targetEntry){
        // Replace the ID but keep servings
        targetEntry.id = mid;
      } else {
        dayArr.push(mkEntry(mid));
      }
      saveWeek(); renderWeekModal();
    } else if(opts.mode === 'add-second'){
      // Add as second meal (only if not already present)
      if(!dayArr.some(ex=>entryId(ex)===mid)) dayArr.push(mkEntry(mid));
      saveWeek(); renderWeekModal();
    } else {
      // Default add mode
      if(!dayArr.some(ex=>entryId(ex)===mid)) dayArr.push(mkEntry(mid));
      saveWeek(); renderWeekModal();
    }
  });
}

function generateWeekPlan(){
  const L = t();
  const pool = ALL_MEALS.filter(m=>matches(m, weekState.carb, weekState.focus, weekState.diet, weekState.avoid));
  if(!pool.length){ toast(L.tNoMatch); return; }

  const days = [[],[],[],[],[],[],[]];
  const mTypes = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const natural = weekState.repeatStrategy === 'natural';

  // For each meal slot, pick recipes and distribute
  mTypes.forEach((mt, mtIdx)=>{
    const libType = SLOT_LIB_TYPE[mt] || mt;
    const candidates = pool.filter(m=>m.type===libType);
    if(!candidates.length) return;
    // Shuffle
    const shuffled = candidates.slice();
    for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
    // Offset into shuffled list so different snack slots pick different meals on the same day
    const off = mtIdx;

    if(natural && mt === 'breakfast'){
      const b1 = shuffled[(0+off)%shuffled.length].id;
      const b2 = shuffled[(1+off)%shuffled.length].id;
      const b3 = shuffled[(2+off)%shuffled.length].id;
      [b1,b1,b1,b2,b2,b2,b3].forEach((id,di)=> days[di].push(mkEntry(id)));
    } else if(natural && (mt === 'lunch' || mt === 'dinner')){
      const x1 = shuffled[(0+off)%shuffled.length].id;
      const x2 = shuffled[(1+off)%shuffled.length].id;
      const x3 = shuffled[(2+off)%shuffled.length].id;
      const x4 = shuffled[(3+off)%shuffled.length].id;
      [x1,x1,x2,x2,x3,x3,x4].forEach((id,di)=> days[di].push(mkEntry(id)));
    } else if(natural){
      // All snack variants (incl. morning/afternoon/night)
      const s1 = shuffled[(0+off)%shuffled.length].id;
      const s2 = shuffled[(1+off)%shuffled.length].id;
      const s3 = shuffled[(2+off)%shuffled.length].id;
      [s1,s1,s1,s2,s2,s2,s3].forEach((id,di)=> days[di].push(mkEntry(id)));
    } else {
      // Different daily: pick 7 different (or as many as available)
      const picks = shuffled.slice(0, Math.min(7, shuffled.length)).map(m=>m.id);
      while(picks.length < 7) picks.push(shuffled[Math.floor(Math.random()*shuffled.length)].id);
      picks.forEach((id,di)=> days[di].push(mkEntry(id)));
    }
  });

  weekState.days = days;
  saveWeek();
  renderWeekModal();
  toast(L.weekGenerated);
}

function exportWeekPDF(){
  const L = t();
  if(!weekState.days.some(d=>d.length)){ toast(L.weekNeedGen); return; }
  const en = state.lang === 'en';
  const name = weekState.clientName || (state.clientName || L.defaultClient);
  const MTYPES = WEEK_SLOTS.filter(mt=>weekState.mealTypes.includes(mt));
  const dayLabels = L.weekDays;
  const showMacros = weekState.showMacros;
  const showMicros = weekState.showMicros;
  const microSel = weekState.microSelection || MICRO_KEYS;

  const dayHeaders = `<div class="ws-row"><div class="ws-dh"></div>${dayLabels.map(dl=>`<div class="ws-dh">${esc(dl)}</div>`).join('')}</div>`;

  // Dedup helper: each day's first snack slot wins so a meal doesn't appear in 3 columns
  const usedSnackPdf = weekState.days.map(()=>new Set());
  const rows = MTYPES.map(mt=>{
    const libType = SLOT_LIB_TYPE[mt] || mt;
    const cells = weekState.days.map((dayArr,di)=>{
      // Find matching entries (new data model: {id, servings} objects)
      const matchingEntries = dayArr.filter(e=>{
        const m = byId(entryId(e));
        return m && m.type===libType && !usedSnackPdf[di].has(m.id);
      });
      const isSnackSlot = SLOT_LIB_TYPE[mt] && SLOT_LIB_TYPE[mt]!==mt;
      const maxPerCell = isSnackSlot ? 1 : 2;
      const entries = matchingEntries.slice(0, maxPerCell);
      entries.forEach(e=>usedSnackPdf[di].add(entryId(e)));
      if(!entries.length) return `<div class="ws-cell"></div>`;

      // Render single or split view (Feature 4: split view in PDF)
      const mealsHTML = entries.map(e=>{
        const m = byId(entryId(e)); if(!m) return '';
        const d = c(m);
        const serv = entryServ(e);
        const servLabel = serv !== 1 ? ` <span class="ws-serv">(${serv}${L.weekServings})</span>` : '';
        const mc = showMacros && m.macros ? `<div class="ws-mm">P${Math.round(m.macros.protein.g*serv)} F${Math.round(m.macros.fat.g*serv)} C${Math.round(m.macros.netCarbs.g*serv)} ${Math.round(macroCalories(m, serv))}${L.weekCalories}</div>` : '';
        const img = m.img ? `<div class="ws-img"><img src="${imgSrc(m)}" alt="" onerror="this.remove()"></div>` : `<div class="ws-img"><span class="ph-emoji">${m.emoji}</span></div>`;
        return `<div class="ws-m-item">${img}<div class="ws-mn">${wrapName(d.name)}${servLabel}</div>${mc}</div>`;
      }).join('');

      if(entries.length > 1){
        return `<div class="ws-cell ws-split">${mealsHTML}</div>`;
      }
      return `<div class="ws-cell">${mealsHTML}</div>`;
    }).join('');
    return `<div class="ws-row"><div class="ws-ml">${L.type[mt]}</div>${cells}</div>`;
  }).join('');

  // Totals — macros always; micronutrients when enabled (Feature 6)
  const totRows = ['protein','fat','netCarbs'].map(k=>{
    const cells = weekState.days.map(dayArr=>{
      const dm = dayMacros(dayArr);
      const v = Math.round(dm[k]);
      return `<div class="ws-tcell">${v}g</div>`;
    }).join('');
    const label = k==='protein'?L.weekProtein : k==='fat'?L.weekFat : L.weekCarbs;
    return `<div class="ws-trow"><div class="ws-tlabel">${label}</div>${cells}</div>`;
  }).join('');
  const calCells = weekState.days.map(dayArr=>{
    const dm = dayMacros(dayArr);
    return `<div class="ws-tcell">${Math.round(dm.calories)}</div>`;
  }).join('');
  let totRowsAll = totRows + `<div class="ws-trow"><div class="ws-tlabel">${L.weekCalories}</div>${calCells}</div>`;
  // Micronutrient rows in PDF (Feature 6)
  if(showMicros){
    microSel.forEach(mk=>{
      const cells = weekState.days.map(dayArr=>{
        const dm = dayMicros(dayArr);
        return `<div class="ws-tcell">${Math.round(dm[mk])}${L.microUnit[mk]}</div>`;
      }).join('');
      totRowsAll += `<div class="ws-trow"><div class="ws-tlabel">${L.microLabels[mk]}</div>${cells}</div>`;
    });
  }

  // Notes section
  const notesHTML = weekState.notes && weekState.notes.trim()
    ? `<div class="ws-notes"><div class="ws-notes-title">${L.weekNotesLabel}</div><div class="ws-notes-body">${esc(weekState.notes.trim())}</div></div>`
    : '';

  // Recipes section (optional) — use entryId for dedup
  const allMealIds = [...new Set(weekState.days.flat().map(e=>entryId(e)))];
  const recipesHTML = weekState.includeRecipes && allMealIds.length
    ? `<div class="ws-recipes-start"></div>
       <div class="ws-recipes-title">${L.hRecipes}</div>
       <div class="ws-recipes-grid">${allMealIds.map(id=>{
         const m = byId(id); if(!m) return '';
         const d = c(m);
         const macroLine = m.macros ? `<div class="ws-r-macros">
           <span>${L.protein}: <b>${m.macros.protein.g}${L.grams}</b></span>
           <span>${L.fat}: <b>${m.macros.fat.g}${L.grams}</b></span>
           <span>${L.carbs}: <b>${m.macros.netCarbs.g}${L.grams}</b></span>
           <span>${L.calories}: <b>${Math.round(macroCalories(m))}</b></span>
         </div>` : '';
         const rPhoto = m.img
           ? `<div class="ws-r-photo"><img src="${imgSrc(m)}" alt="" onerror="this.parentElement.style.display='none'"></div>`
           : `<div class="ws-r-photo ph"><span>${m.emoji}</span></div>`;
         return `<div class="ws-recipe">
           ${rPhoto}
           <div class="ws-r-head">
             <h4>${esc(d.name)}</h4>
             <div class="ws-r-meta">${L.type[m.type]} · ${esc(d.time)} · ${esc(d.servings)}${L.servingsUnit}</div>
           </div>
           <div class="ws-r-cols">
             <div><div class="ws-r-sec">${L.ingredients}</div><ul class="ws-r-ing">${d.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
             <div><div class="ws-r-sec">${L.method}</div><ol class="ws-r-steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
           </div>
           ${macroLine}
         </div>`;
       }).join('')}</div>`
    : '';

  const sheetContent = `
    <div class="ws-head">
      ${brandLogoHTMLSmall('ws-logo')}
      <div class="ws-brand-text">
        <div class="pn">${L.practiceName}</div>
      </div>
      <div style="flex:1;text-align:right">
        <div class="ws-title">${L.weekTitle2}</div>
        <div class="ws-sub">${L.weekSubtitle(esc(name))}</div>
      </div>

      ${dayHeaders}
      ${rows}
    </div>
    <div class="ws-totals">
      <div class="ws-totals-title">${L.weekDayTotals}</div>
      ${totRowsAll}
    </div>
    ${notesHTML}
    ${recipesHTML}
    <div class="ws-foot">${L.practiceName} · ${L.credential}</div>`;

  // Open a dedicated print window — avoids CSS mode-switching conflicts
  const w = window.open('', '_blank');

    .ws-dh{font-size:12px;font-weight:700;color:var(--brand-dark);text-align:center;padding:3px;border-bottom:2px solid var(--brand-cream);font-family:var(--font-heading)}
    .ws-ml{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;display:flex;align-items:center;padding:3px}
    .ws-cell{border:1px solid var(--line);border-radius:5px;padding:5px;min-height:156px;font-size:12px;line-height:1.3;overflow:hidden;display:flex;flex-direction:column}

    .ws-cell .ws-img .ph-emoji{font-size:28px}
    .ws-cell .ws-mn{font-weight:700;color:var(--brand-dark);margin-bottom:2px;font-size:12px;line-height:1.25;flex-shrink:0}
    .ws-cell .ws-mn .wl{display:block}
    .ws-cell .ws-mm{font-size:10px;color:var(--muted);line-height:1.2;flex-shrink:0}
    /* Split view: two meals side-by-side (Feature 4) */
