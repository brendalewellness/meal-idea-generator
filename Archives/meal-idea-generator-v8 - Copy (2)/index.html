/* ---------- 事件绑定 ---------- */
function bindLibrary(){
  $$('#libGrid [data-add]').forEach(b=>b.onclick=()=>addToDay(b.dataset.add, state.addDay));
  $$('#libGrid [data-rec]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.rec));
  $$('#planBody [data-rec]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.rec));
  $$('#libGrid .meal').forEach(card=>{
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.querySelector('[data-add]').dataset.add);
    });
  });
}

function bindGlobal(){
  $('#carbSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.carb = b.dataset.carb; save(); renderAll();
  });
  const toggle = (evt, attr, key) => {
    const b = evt.target.closest('['+attr+']'); if(!b) return;
    const v = b.getAttribute(attr);
    state[key] = state[key].includes(v) ? state[key].filter(x=>x!==v) : [...state[key], v];
    save(); renderAll();
  };
  $('#focusChips').addEventListener('click', e=>toggle(e,'data-focus','focus'));
  $('#dietChips').addEventListener('click',  e=>toggle(e,'data-diet','diet'));
  $('#avoidChips').addEventListener('click', e=>toggle(e,'data-avoid','avoid'));

  $('#typeTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.type = b.dataset.type; save(); renderAll();
  });
  $('#daySeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.addDay = +b.dataset.day; save(); renderAll();
  });

  $('#btnAuto').onclick = ()=>autoFill(state.addDay);
  $('#btnLib').onclick = ()=>openLibModal();
  $('#btnWeek').onclick = ()=>openWeekModal();

  $('#clientName').addEventListener('input', e=>{ state.clientName=e.target.value; save(); buildHandout(); });
  $('#clientNote').addEventListener('input', e=>{ state.clientNote=e.target.value; save(); buildHandout(); });
  $('#optRecipes').addEventListener('change', e=>{ state.includeRecipes=e.target.checked; save(); buildHandout(); });
  $('#optMacros').addEventListener('change', e=>{ state.showMacros=e.target.checked; save(); buildHandout(); });

  $('#btnLang').onclick = ()=>{
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    save(); renderAll();
    toast(t().tLang);
  };

  $('#btnDemo').onclick = ()=>{ applyDemo(); save(); renderAll(); toast(t().tDemo); };
  $('#btnPdf').onclick = exportPDF;
  $('#btnPreview').onclick = ()=>{
    const L = t();
    if(!state.day1.length && !state.day2.length && !state.day3.length){ toast(L.tNeedMeal); return; }
    buildHandout();
    const w = window.open('', '_blank');
    if(!w){ toast(L.tPopup); return; }
    const css = document.querySelector('style').textContent;
    w.document.write(`<!DOCTYPE html><html lang="${document.documentElement.lang}"><head><meta charset="UTF-8"><title>${L.previewTitle}</title>
      <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>${css}
      body{background:#f6f5f1;padding:0}
      #handout{display:block !important;background:#fff;max-width:820px;margin:22px auto;padding:34px 38px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
    </style></head><body><div id="handout">${$('#handout').innerHTML}</div></body></html>`);
    w.document.close();
  };
  $('#btnReset').onclick = ()=>{
    state.day1=[]; state.day2=[]; state.day3=[]; save(); renderAll(); toast(t().tCleared);
  };

  $$('#modal [data-close]').forEach(b=>b.onclick=closeModal);
  $$('#libModal [data-lib-close]').forEach(b=>b.onclick=closeLibModal);
  $$('#weekModal [data-week-close]').forEach(b=>b.onclick=closeWeekModal);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeLibModal(); closeWeekModal(); } });
}

/* ---------- 启动 ---------- */
load();
loadWeek();
const qs = new URLSearchParams(location.search);
if(qs.has('lang')){
  const q = qs.get('lang');
  if(q === 'zh' || q === 'en') state.lang = q;
}
if(qs.has('demo')) applyDemo();
renderAll();
bindGlobal();
</script>
